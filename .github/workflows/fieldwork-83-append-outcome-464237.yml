name: fieldwork-83-append-outcome-464237

on:
  pull_request:
    branches:
      - fieldwork/83-append-outcome-464237
    paths:
      - .github/workflows/fieldwork-83-append-outcome-464237.yml

permissions:
  contents: read

concurrency:
  group: fieldwork-83-append-outcome-464237
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record exact identities
        run: |
          set -euo pipefail
          echo "FIELDWORK_APPEND_CARRIER_HEAD=$(git rev-parse HEAD)"
          echo "FIELDWORK_APPEND_SOURCE_HEAD=926e0bc5a32b136f31b9eaae75e2de4abc20fa95"
          echo "FIELDWORK_APPEND_SOURCE_BASE=4642370542739d5dd080b0c87a9de06a6435d3db"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Verify carrier and source fences
        env:
          SOURCE_BASE: 4642370542739d5dd080b0c87a9de06a6435d3db
          SOURCE_HEAD: 926e0bc5a32b136f31b9eaae75e2de4abc20fa95
          WORKFLOW: .github/workflows/fieldwork-83-append-outcome-464237.yml
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$SOURCE_HEAD")" = "$SOURCE_HEAD"
          test "$(git merge-base "$SOURCE_HEAD" "$SOURCE_BASE")" = "$SOURCE_BASE"

          source_actual="$(git diff --name-only "$SOURCE_BASE" "$SOURCE_HEAD" | sort)"
          source_expected="$(printf '%s\n' \
            codex-rs/core/src/session/mod.rs \
            codex-rs/core/src/session/turn_tests.rs \
            codex-rs/thread-store/src/in_memory.rs | sort)"
          test "$source_actual" = "$source_expected"

          carrier_actual="$(git diff --name-only "$SOURCE_HEAD" HEAD | sort)"
          test "$carrier_actual" = "$WORKFLOW"

          git diff --check "$SOURCE_BASE" "$SOURCE_HEAD"
          git diff --check "$SOURCE_HEAD" HEAD
          echo 'FIELDWORK_APPEND_SOURCE_FENCE=3/3'
          echo 'FIELDWORK_APPEND_CARRIER_FENCE=1/1'

      - name: Format-check exact source
        working-directory: codex-rs
        run: cargo fmt --all -- --check

      - name: Resolve and run four exact append controls
        working-directory: codex-rs
        run: |
          set -euo pipefail
          mapfile -t declared <<'EOF'
          append_outcome_ephemeral_history_is_authoritative
          append_outcome_reports_successful_live_append
          append_outcome_reports_prewrite_failure
          append_outcome_reports_commit_then_error_as_failure
          EOF

          cargo test -p codex-core --lib --locked -- --list > /tmp/append-outcome-tests.txt
          count=0
          for suffix in "${declared[@]}"; do
            mapfile -t matches < <(sed -n 's/: test$//p' /tmp/append-outcome-tests.txt | grep -E "(^|::)${suffix}$")
            test "${#matches[@]}" -eq 1
            cargo test -p codex-core --lib --locked "${matches[0]}" -- --exact --nocapture
            count=$((count + 1))
          done
          test "$count" -eq 4
          echo "FIELDWORK_APPEND_OUTCOME_EXACT=${count}/4"

      - name: Run complete thread-store package
        working-directory: codex-rs
        run: cargo test -p codex-thread-store --locked
