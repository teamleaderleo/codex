name: fieldwork-84-mcp-authority-execute

on:
  pull_request:
    branches:
      - fieldwork/84-authority-carrier-base-97576
    paths:
      - .github/fieldwork/84_mcp_authority.py
      - .github/workflows/fieldwork-84-mcp-authority-current.yml
      - .github/workflows/fieldwork-84-mcp-authority-execute.yml

permissions:
  contents: write

concurrency:
  group: fieldwork-84-mcp-authority-execute
  cancel-in-progress: true

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure validation identity
        run: |
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
          echo "FIELDWORK_MCP_AUTHORITY_CARRIER_HEAD=$(git rev-parse HEAD)"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply current-pin authority candidate
        env:
          CURRENT_BASE: 97576b1794872e342450ebd577123e052ab57626
        run: |
          set -euo pipefail
          cp .github/fieldwork/84_mcp_authority.py /tmp/84_mcp_authority.py
          git switch --detach "$CURRENT_BASE"
          python /tmp/84_mcp_authority.py
          git diff --check

      - name: Format and verify exact source fence
        env:
          CURRENT_BASE: 97576b1794872e342450ebd577123e052ab57626
        run: |
          set -euo pipefail
          cd codex-rs
          cargo fmt --all
          cargo fmt --all -- --check
          cd ..
          actual="$(git diff --name-only "$CURRENT_BASE" | sort)"
          expected="$(printf '%s\n' \
            codex-rs/core/src/mcp_tool_call.rs \
            codex-rs/core/src/mcp_tool_call_tests.rs \
            codex-rs/core/src/tools/handlers/mcp.rs | sort)"
          printf 'actual source files:\n%s\n' "$actual"
          test "$actual" = "$expected"
          git diff --check "$CURRENT_BASE"

      - name: Resolve and run two exact authority controls
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test -p codex-core --lib --locked -- --list > /tmp/codex-core-tests.list
          suffixes=(
            mcp_tool_authority_accepts_identical_advertisement
            mcp_tool_authority_rejects_schema_and_connector_drift
          )
          resolved=()
          for suffix in "${suffixes[@]}"; do
            mapfile -t matches < <(sed -n 's/: test$//p' /tmp/codex-core-tests.list | grep "${suffix}$")
            printf '%s matches: %s\n' "$suffix" "${matches[*]:-<none>}"
            test "${#matches[@]}" -eq 1
            resolved+=("${matches[0]}")
          done
          test "$(printf '%s\n' "${resolved[@]}" | sort -u | wc -l)" -eq 2
          for test_name in "${resolved[@]}"; do
            cargo test -p codex-core --lib --locked "$test_name" -- --exact --nocapture
          done
          echo 'FIELDWORK_MCP_AUTHORITY_EXACT=2/2'

      - name: Run focused MCP call module gate
        working-directory: codex-rs
        run: cargo test -p codex-core --lib --locked mcp_tool_call -- --nocapture

      - name: Preserve source fence
        run: |
          set -euo pipefail
          git add \
            codex-rs/core/src/mcp_tool_call.rs \
            codex-rs/core/src/mcp_tool_call_tests.rs \
            codex-rs/core/src/tools/handlers/mcp.rs
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            codex-rs/core/src/mcp_tool_call.rs \
            codex-rs/core/src/mcp_tool_call_tests.rs \
            codex-rs/core/src/tools/handlers/mcp.rs | sort)"
          test "$actual" = "$expected"
          git diff --cached --check

      - name: Publish clean source-only branch
        env:
          SOURCE_BRANCH: fieldwork/84-mcp-authority-97576
        run: |
          set -euo pipefail
          git switch -C "$SOURCE_BRANCH"
          git commit -m 'core: reject MCP calls when live tool authority drifts'
          git push --force origin "HEAD:refs/heads/$SOURCE_BRANCH"
          echo "FIELDWORK_SOURCE_HEAD=$(git rev-parse HEAD)"
          echo "FIELDWORK_SOURCE_BASE=97576b1794872e342450ebd577123e052ab57626"
