name: fieldwork-85-deferred-exposure

on:
  push:
    branches:
      - fieldwork/85-request-exposure-invariants

permissions:
  contents: write

concurrency:
  group: fieldwork-85-deferred-exposure
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/85-request-exposure-invariants
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Apply bounded planner candidate
        run: python3 .github/fieldwork/85_apply_deferred_invariant.py
      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
        working-directory: codex-rs
      - name: Compile and run focused planner tests
        run: cargo test -p codex-core --lib tools::spec_plan::tests --locked
        working-directory: codex-rs
      - name: Check diff
        run: git diff --check
      - name: Commit validated source
        run: |
          rm .github/fieldwork/85_apply_deferred_invariant.py
          rm .github/workflows/fieldwork-85-deferred-exposure.yml
          rmdir .github/fieldwork 2>/dev/null || true
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
          git add codex-rs/core/src/tools .github
          git commit -m 'core: direct-expose deferred tools without a loader'
          git push origin HEAD:fieldwork/85-request-exposure-invariants
