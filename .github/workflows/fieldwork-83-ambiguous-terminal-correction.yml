name: Fieldwork 83 ambiguous terminal correction

on:
  push:
    branches:
      - fieldwork/83-selected-effect-terminal-closure

permissions:
  contents: write

concurrency:
  group: fieldwork-83-ambiguous-terminal-correction
  cancel-in-progress: true

jobs:
  correct-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/83-selected-effect-terminal-closure
          fetch-depth: 0
      - name: Stop until selected-effect source exists
        id: source
        run: |
          if grep -q 'record_tool_receipt_terminal_if_unclaimed' codex-rs/core/src/tools/registry.rs; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Configure validation identity
        if: steps.source.outputs.ready == 'true'
        run: |
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
      - name: Map uncertain outcomes to ambiguous
        if: steps.source.outputs.ready == 'true'
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          path = Path('codex-rs/core/src/tools/lifecycle.rs')
          text = path.read_text(encoding='utf-8')
          old_mapping = dedent('''\
          fn receipt_terminal_state(outcome: ToolCallOutcome) -> ToolOperationTerminalState {
              match outcome {
                  ToolCallOutcome::Completed { .. } => ToolOperationTerminalState::Completed,
                  ToolCallOutcome::Blocked | ToolCallOutcome::Failed { .. } => {
                      ToolOperationTerminalState::Failed
                  }
                  ToolCallOutcome::Aborted => ToolOperationTerminalState::Aborted,
              }
          }
          ''')
          new_mapping = dedent('''\
          fn receipt_terminal_state(outcome: ToolCallOutcome) -> ToolOperationTerminalState {
              match outcome {
                  ToolCallOutcome::Completed { .. } => ToolOperationTerminalState::Completed,
                  ToolCallOutcome::Blocked
                  | ToolCallOutcome::Failed {
                      handler_executed: false,
                  } => ToolOperationTerminalState::Failed,
                  ToolCallOutcome::Failed {
                      handler_executed: true,
                  }
                  | ToolCallOutcome::Aborted => ToolOperationTerminalState::Ambiguous,
              }
          }
          ''')
          if old_mapping in text:
              text = text.replace(old_mapping, new_mapping, 1)
          elif new_mapping not in text:
              raise SystemExit('terminal mapping anchor mismatch')

          old_tests = dedent('''\
              #[test]
              fn maps_blocked_and_failed_to_failed() {
                  assert_eq!(
                      receipt_terminal_state(ToolCallOutcome::Blocked),
                      ToolOperationTerminalState::Failed
                  );
                  assert_eq!(
                      receipt_terminal_state(ToolCallOutcome::Failed {
                          handler_executed: false,
                      }),
                      ToolOperationTerminalState::Failed
                  );
                  assert_eq!(
                      receipt_terminal_state(ToolCallOutcome::Failed {
                          handler_executed: true,
                      }),
                      ToolOperationTerminalState::Failed
                  );
              }

              #[test]
              fn maps_cancellation_to_aborted() {
                  assert_eq!(
                      receipt_terminal_state(ToolCallOutcome::Aborted),
                      ToolOperationTerminalState::Aborted
                  );
              }
          ''')
          new_tests = dedent('''\
              #[test]
              fn maps_blocked_and_pre_execution_failure_to_failed() {
                  assert_eq!(
                      receipt_terminal_state(ToolCallOutcome::Blocked),
                      ToolOperationTerminalState::Failed
                  );
                  assert_eq!(
                      receipt_terminal_state(ToolCallOutcome::Failed {
                          handler_executed: false,
                      }),
                      ToolOperationTerminalState::Failed
                  );
              }

              #[test]
              fn maps_handler_executed_failure_to_ambiguous() {
                  assert_eq!(
                      receipt_terminal_state(ToolCallOutcome::Failed {
                          handler_executed: true,
                      }),
                      ToolOperationTerminalState::Ambiguous
                  );
              }

              #[test]
              fn maps_unconfirmed_cancellation_to_ambiguous() {
                  assert_eq!(
                      receipt_terminal_state(ToolCallOutcome::Aborted),
                      ToolOperationTerminalState::Ambiguous
                  );
              }
          ''')
          if old_tests in text:
              text = text.replace(old_tests, new_tests, 1)
          elif new_tests not in text:
              raise SystemExit('terminal test anchor mismatch')
          path.write_text(text, encoding='utf-8')

          for temporary in [
              '.fieldwork-83-selected-effect-trigger',
              '.github/workflows/fieldwork-83-selected-effect-source.yml',
              '.github/workflows/fieldwork-83-selected-effect-source-v2.yml',
              '.github/workflows/fieldwork-83-selected-effect-repair.yml',
              '.github/workflows/fieldwork-83-selected-effect-pr.yml',
              '.github/workflows/fieldwork-83-ambiguous-terminal-correction.yml',
          ]:
              Path(temporary).unlink(missing_ok=True)
      - name: Install pinned Rust toolchain
        if: steps.source.outputs.ready == 'true'
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Format and run focused tests
        if: steps.source.outputs.ready == 'true'
        run: |
          rustfmt --edition 2024 codex-rs/core/src/tools/lifecycle.rs codex-rs/core/src/tools/registry.rs codex-rs/core/src/tools/registry_tests.rs
          rustfmt --edition 2024 --check codex-rs/core/src/tools/lifecycle.rs codex-rs/core/src/tools/registry.rs codex-rs/core/src/tools/registry_tests.rs
          cd codex-rs
          cargo test -p codex-core --lib receipt_before_dispatch --locked
          cargo test -p codex-core --lib dispatch_notifies_tool_lifecycle_contributors --locked
          cargo test -p codex-core --lib tools::lifecycle::tests --locked
      - name: Verify patch hygiene
        if: steps.source.outputs.ready == 'true'
        run: git diff --check
      - name: Publish corrected source-only head
        if: steps.source.outputs.ready == 'true'
        run: |
          git add -A
          git commit -m 'core: treat uncertain tool outcomes as ambiguous'
          git push origin HEAD:fieldwork/83-selected-effect-terminal-closure
