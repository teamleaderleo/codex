name: fieldwork-84-mcp-publication-result-identity

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fieldwork-84-mcp-publication-result-identity.yml

permissions:
  contents: write

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/84-mcp-publication-tickets
          fetch-depth: 0
          persist-credentials: true
      - run: |
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
      - name: Bind replace_fresh result to accepted candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('codex-rs/codex-mcp/src/runtime.rs')
          text = path.read_text(encoding='utf-8')

          old = '''    pub async fn replace_fresh(&self, input: McpRuntimeInput) -> anyhow::Result<Vec<ToolInfo>> {
              let ticket = self.issue_refresh_ticket(/*force_fresh*/ true);
              if !self.publish(input, /*previous*/ None, ticket).await {
                  anyhow::bail!("MCP refresh was superseded before publication");
              }
              self.latest_hard_refresh_codex_apps_tools_cache().await
          }
          '''.replace('          ', '')
          new = '''    pub async fn replace_fresh(&self, input: McpRuntimeInput) -> anyhow::Result<Vec<ToolInfo>> {
              let ticket = self.issue_refresh_ticket(/*force_fresh*/ true);
              let candidate = self
                  .publish(input, /*previous*/ None, ticket)
                  .await
                  .ok_or_else(|| anyhow::anyhow!("MCP refresh was superseded before publication"))?;
              candidate
                  .connections
                  .hard_refresh_codex_apps_tools_cache()
                  .await
          }
          '''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit('replace_fresh anchor changed')
          text = text.replace(old, new, 1)

          text = text.replace(
              '    ) -> bool {\n',
              '    ) -> Option<Arc<PublishedMcpRuntime>> {\n',
              1,
          )

          old_tail = '''        let accepted = {
              let mut state = self
                  .publication_state
                  .lock()
                  .unwrap_or_else(|poisoned| poisoned.into_inner());
              if state.can_publish(ticket) {
                  self.current.store(candidate);
                  state.mark_published(ticket);
                  true
              } else {
                  false
              }
          };
          if accepted {
              let _ = publish.send(true);
          }
          accepted
          '''.replace('          ', '')
          new_tail = '''        let accepted = {
              let mut state = self
                  .publication_state
                  .lock()
                  .unwrap_or_else(|poisoned| poisoned.into_inner());
              if state.can_publish(ticket) {
                  self.current.store(Arc::clone(&candidate));
                  state.mark_published(ticket);
                  Some(candidate)
              } else {
                  None
              }
          };
              if accepted.is_some() {
                  let _ = publish.send(true);
              }
              accepted
          '''.replace('          ', '')
          if text.count(old_tail) != 1:
              raise SystemExit('publication result anchor changed')
          path.write_text(text.replace(old_tail, new_tail, 1), encoding='utf-8')
          PY
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Execute focused runtime gate
        run: |
          rustfmt --edition 2024 codex-rs/codex-mcp/src/runtime.rs
          rustfmt --edition 2024 --check codex-rs/codex-mcp/src/runtime.rs
          cd codex-rs
          cargo test -p codex-mcp publication_state_ --locked
          cargo test -p codex-mcp publication_gate_opens_only_for_the_winning_candidate --locked
      - name: Publish source-only review head
        run: |
          rm -f .github/workflows/fieldwork-84-mcp-publication-result-identity.yml
          actual=$(git diff --name-only origin/main)
          test "$actual" = "codex-rs/codex-mcp/src/runtime.rs"
          git diff --check
          git add -A
          git commit -m 'mcp: bind fresh results to accepted publication'
          git push origin HEAD:fieldwork/84-mcp-publication-tickets
