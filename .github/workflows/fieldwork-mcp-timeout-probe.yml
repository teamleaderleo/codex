name: Fieldwork MCP timeout cancellation probe

on:
  push:
    branches:
      - fieldwork/mcp-timeout-cancellation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run Codex rmcp timeout ownership probe
        working-directory: codex-rs
        run: cargo test -p codex-rmcp-client --test tool_timeout_cancellation_probe -- --nocapture
