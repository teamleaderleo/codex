name: Fieldwork MCP timeout cancellation probe

on:
  pull_request:
    branches:
      - fieldwork/upstream-5989-base-clean
    paths:
      - codex-rs/rmcp-client/**
      - fieldwork/patches/mcp-timeout/**
      - .github/workflows/fieldwork-mcp-timeout-probe.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run current Codex timeout controls
        working-directory: codex-rs
        run: |
          cargo test -p codex-rmcp-client --test tool_timeout_cancellation_probe -- --nocapture
          cargo test -p codex-rmcp-client --test tool_timeout_elicitation_probe -- --nocapture
          cargo test -p codex-rmcp-client --test tool_timeout_modern_http_probe -- --nocapture
          cargo test -p codex-rmcp-client --test tool_timeout_cancel_delivery_probe -- --nocapture

  native-sdk-timeout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Apply SDK-native timeout candidate
        run: python3 fieldwork/patches/mcp-timeout/apply_candidate.py native-sdk-timeout
      - name: Verify transformed source
        run: |
          cargo fmt --all -- --check
          git diff --check
        working-directory: codex-rs
      - name: Run candidate behavior controls
        working-directory: codex-rs
        env:
          FIELDWORK_EXPECT_MCP_CANCEL: "1"
          FIELDWORK_EXPECT_ELICITATION_TIMEOUT: "1"
          FIELDWORK_EXPECT_CANCEL_SEND_STALL: "1"
        run: |
          cargo test -p codex-rmcp-client --test tool_timeout_cancellation_probe -- --nocapture
          cargo test -p codex-rmcp-client --test tool_timeout_elicitation_probe -- --nocapture
          cargo test -p codex-rmcp-client --test tool_timeout_modern_http_probe -- --nocapture
          cargo test -p codex-rmcp-client --test tool_timeout_cancel_delivery_probe -- --nocapture

  pause-aware-explicit-cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Apply pause-aware explicit cancellation candidate
        run: python3 fieldwork/patches/mcp-timeout/apply_candidate.py pause-aware-explicit-cancel
      - name: Verify transformed source
        run: |
          cargo fmt --all -- --check
          git diff --check
        working-directory: codex-rs
      - name: Run candidate behavior controls
        working-directory: codex-rs
        env:
          FIELDWORK_EXPECT_MCP_CANCEL: "1"
          FIELDWORK_EXPECT_CANCEL_SEND_STALL: "1"
        run: |
          cargo test -p codex-rmcp-client --test tool_timeout_cancellation_probe -- --nocapture
          cargo test -p codex-rmcp-client --test tool_timeout_elicitation_probe -- --nocapture
          cargo test -p codex-rmcp-client --test tool_timeout_modern_http_probe -- --nocapture
          cargo test -p codex-rmcp-client --test tool_timeout_cancel_delivery_probe -- --nocapture

  pause-aware-bounded-cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Apply pause-aware bounded cancellation candidate
        run: python3 fieldwork/patches/mcp-timeout/apply_candidate.py pause-aware-bounded-cancel
      - name: Verify transformed source
        run: |
          cargo fmt --all -- --check
          git diff --check
        working-directory: codex-rs
      - name: Run candidate behavior controls
        working-directory: codex-rs
        env:
          FIELDWORK_EXPECT_MCP_CANCEL: "1"
          FIELDWORK_EXPECT_BOUNDED_CANCEL: "1"
        run: |
          cargo test -p codex-rmcp-client --test tool_timeout_cancellation_probe -- --nocapture
          cargo test -p codex-rmcp-client --test tool_timeout_elicitation_probe -- --nocapture
          cargo test -p codex-rmcp-client --test tool_timeout_modern_http_probe -- --nocapture
          cargo test -p codex-rmcp-client --test tool_timeout_cancel_delivery_probe -- --nocapture
