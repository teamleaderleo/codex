name: fieldwork-239-deferred-mixed-current

on:
  pull_request:
    branches:
      - fieldwork/239-deferred-loader-97576
    paths:
      - .github/workflows/fieldwork-239-deferred-mixed-review.yml

permissions:
  contents: write

concurrency:
  group: fieldwork-239-deferred-mixed-current
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  UPSTREAM_HEAD: a01a2d91461a57809e944de7758477b92617ab01
  REVIEWED_SOURCE: 8f73d8e0bb9a61e7dec7b1367d13649a88615dea
  SOURCE_BRANCH: fieldwork/239-deferred-loader-a01a-v2

jobs:
  exact-review-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Record exact inputs
        run: |
          set -euo pipefail
          git cat-file -e "${UPSTREAM_HEAD}^{commit}"
          git cat-file -e "${REVIEWED_SOURCE}^{commit}"
          test "$(git rev-parse "${REVIEWED_SOURCE}^")" = "$UPSTREAM_HEAD"
          echo "FIELDWORK_DEFERRED_MIXED_CARRIER_HEAD=$(git rev-parse HEAD)"
          echo "FIELDWORK_DEFERRED_MIXED_BASE=$UPSTREAM_HEAD"
          echo "FIELDWORK_DEFERRED_MIXED_REVIEWED_SOURCE=$REVIEWED_SOURCE"

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Construct exact current source with mixed control
        run: |
          set -euo pipefail
          git diff --binary "$UPSTREAM_HEAD" "$REVIEWED_SOURCE" -- \
            codex-rs/core/src/tools/spec_plan.rs \
            codex-rs/core/src/tools/spec_plan_tests.rs > /tmp/reviewed-source.patch
          test -s /tmp/reviewed-source.patch
          git worktree add --detach /tmp/deferred-current-source "$UPSTREAM_HEAD"
          cd /tmp/deferred-current-source
          git apply /tmp/reviewed-source.patch
          python - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/core/src/tools/spec_plan_tests.rs")
          text = path.read_text(encoding="utf-8")
          name = "mixed_deferred_catalogue_normalizes_per_runtime"
          if name in text:
              raise SystemExit(f"{name} already exists")
          test = r'''

          #[tokio::test]
          async fn mixed_deferred_catalogue_normalizes_per_runtime() {
              let plan = probe_with(
                  |turn| {
                      set_feature(turn, Feature::Collab, /*enabled*/ false);
                      turn.model_info.supports_search_tool = true;
                  },
                  ToolPlanInputs {
                      tool_runtimes: vec![Arc::new(DeferredCoreToolWithoutSearchInfo)],
                      extension_tool_executors: vec![Arc::new(DeferredExtensionTool)],
                      ..ToolPlanInputs::default()
                  },
              )
              .await;

              plan.assert_visible_contains(&["tool_search", "unsearchable_deferred"]);
              plan.assert_visible_lacks(&["extension_echo"]);
              plan.assert_registered_contains(&["extension_echo", "unsearchable_deferred"]);
              assert_eq!(plan.exposure("extension_echo"), ToolExposure::Deferred);
              assert_eq!(
                  plan.exposure("unsearchable_deferred"),
                  ToolExposure::Direct
              );
          }
          '''
          path.write_text(text.rstrip() + test + "\n", encoding="utf-8")
          PY
          cd codex-rs
          cargo fmt --all
          cargo fmt --all -- --check
          cd ..
          actual="$(git diff --name-only "$UPSTREAM_HEAD" | sort)"
          expected="$(printf '%s\n' \
            codex-rs/core/src/tools/spec_plan.rs \
            codex-rs/core/src/tools/spec_plan_tests.rs | sort)"
          printf 'exact source files:\n%s\n' "$actual"
          test "$actual" = "$expected"
          git diff --check "$UPSTREAM_HEAD"
          echo 'FIELDWORK_DEFERRED_MIXED_SOURCE_FENCE=2/2'

      - name: Resolve and run five exact planner controls
        run: |
          set -euo pipefail
          cd /tmp/deferred-current-source/codex-rs
          cargo test -p codex-core --lib --locked -- --list > /tmp/deferred-tests.list
          suffixes=(
            deferred_extension_is_direct_when_search_is_unavailable
            deferred_runtime_without_search_metadata_is_direct
            code_mode_keeps_unsearchable_deferred_runtime_registered
            mixed_deferred_catalogue_normalizes_per_runtime
            mcp_and_tool_search_follow_direct_and_deferred_tool_exposure
          )
          executed=0
          for suffix in "${suffixes[@]}"; do
            mapfile -t matches < <(sed -n 's/: test$//p' /tmp/deferred-tests.list | grep "${suffix}$")
            printf '%s matches: %s\n' "$suffix" "${matches[*]:-<none>}"
            test "${#matches[@]}" -eq 1
            cargo test -p codex-core --lib --locked "${matches[0]}" -- --exact --nocapture
            executed=$((executed + 1))
          done
          test "$executed" -eq 5
          echo 'FIELDWORK_DEFERRED_MIXED_EXACT=5/5'

      - name: Classify optional Code Mode fallback
        run: |
          set -euo pipefail
          cd /tmp/deferred-current-source/codex-rs
          suffix=missing_process_host_falls_back_to_direct_tools_and_warns_once
          cargo test -p codex-core --test all --locked -- --list > /tmp/deferred-integration.list
          mapfile -t matches < <(sed -n 's/: test$//p' /tmp/deferred-integration.list | grep "${suffix}$")
          test "${#matches[@]}" -eq 1
          set +e
          cargo test -p codex-core --test all --locked "${matches[0]}" -- --exact --nocapture 2>&1 | tee /tmp/deferred-default.log
          default_status=${PIPESTATUS[0]}
          RUST_MIN_STACK=16777216 cargo test -p codex-core --test all --locked "${matches[0]}" -- --exact --nocapture 2>&1 | tee /tmp/deferred-large.log
          large_status=${PIPESTATUS[0]}
          set -e
          test "$large_status" -eq 0
          if test "$default_status" -ne 0; then
            grep -E 'stack overflow|has overflowed its stack' /tmp/deferred-default.log
          fi
          echo "FIELDWORK_DEFERRED_MIXED_FALLBACK=default:${default_status};large:${large_status}"

      - name: Run focused spec-plan gate
        run: |
          set -euo pipefail
          cd /tmp/deferred-current-source/codex-rs
          cargo test -p codex-core --lib --locked tools::spec_plan::tests -- --nocapture

      - name: Publish validated exact-current source
        run: |
          set -euo pipefail
          cd /tmp/deferred-current-source
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
          git add \
            codex-rs/core/src/tools/spec_plan.rs \
            codex-rs/core/src/tools/spec_plan_tests.rs
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            codex-rs/core/src/tools/spec_plan.rs \
            codex-rs/core/src/tools/spec_plan_tests.rs | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m 'core: expose deferred tools when no loader exists'
          test "$(git rev-parse HEAD^)" = "$UPSTREAM_HEAD"
          git push --force origin "HEAD:refs/heads/$SOURCE_BRANCH"
          echo "FIELDWORK_DEFERRED_MIXED_SOURCE=$(git rev-parse HEAD)"
          echo "FIELDWORK_DEFERRED_MIXED_SOURCE_BRANCH=$SOURCE_BRANCH"
