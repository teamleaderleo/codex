name: Patch 1 Wine target guards

on:
  push:
    branches:
      - validation/code-mode-wine-target-guards

permissions:
  contents: write

jobs:
  wine-target-guards:
    name: Validate orphan-session Windows-target guards
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bazel-ci
        with:
          target: Linux

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev

      - name: Run targeted Wine-exec validation
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact_dir="$RUNNER_TEMP/patch1-wine-target-guards"
          mkdir -p "$artifact_dir"
          log_file="$artifact_dir/validation.log"
          exec > >(tee "$log_file") 2>&1

          finish() {
            status=$?
            git status --short --untracked-files=all > "$artifact_dir/git-status.txt" || true
            git diff --check > "$artifact_dir/git-diff-check.txt" 2>&1 || true
            {
              printf 'exit_status=%s\n' "$status"
              printf 'validation_head=%s\n' "$(git rev-parse HEAD)"
              printf 'code_head=%s\n' "77e7e3149df366236db2426596c23ebbe1d6bb48"
            } > "$artifact_dir/result.txt"
            exit "$status"
          }
          trap finish EXIT

          expected_head="77e7e3149df366236db2426596c23ebbe1d6bb48"
          expected_changes=".github/workflows/patch1-wine-target-guards.yml"
          actual_changes="$(git diff --name-only "$expected_head" HEAD)"
          [[ "$actual_changes" == "$expected_changes" ]]
          [[ "$(uname -m)" == "x86_64" ]]

          python3 - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/core/tests/suite/code_mode/orphan_sessions.rs")
          text = path.read_text()
          expected = 4
          actual = text.count("skip_if_target_windows!(")
          if actual != expected:
              raise SystemExit(f"expected {expected} target-Windows guards, found {actual}")
          if text.count("skip_if_remote!(") != 1:
              raise SystemExit("expected one local-only survivor guard")
          PY

          {
            printf 'agent=Agent 69\n'
            printf 'code_head=%s\n' "$expected_head"
            printf 'validation_head=%s\n' "$(git rev-parse HEAD)"
            printf 'platform=%s\n' "$(uname -a)"
            printf 'bazel=%s\n' "$(bazel --version)"
            printf 'target=//codex-rs/core:core-all-wine-exec-test\n'
            printf 'filter=suite::code_mode::orphan_sessions::\n'
          } | tee "$artifact_dir/environment.txt"

          set +e
          set -o pipefail
          bazel test //codex-rs/core:core-all-wine-exec-test \
            --nocache_test_results \
            --test_output=all \
            --test_arg='suite::code_mode::orphan_sessions::' \
            --test_arg='--nocapture' \
            2>&1 | tee -a "$log_file"
          test_status=${PIPESTATUS[0]}
          set -e

          grep -E \
            'suite::code_mode::orphan_sessions::|PID/release paths|Windows exec target|test result:|PASSED|FAILED|skipp' \
            "$log_file" \
            > "$artifact_dir/summary.txt" || true

          cat "$artifact_dir/summary.txt"
          git diff --check
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
          exit "$test_status"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: patch1-wine-target-guards-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/patch1-wine-target-guards
          if-no-files-found: error
          retention-days: 14

      - name: Publish readable validation summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/patch1-wine-target-guards"
          publish_dir="validation-results/patch1-wine-target-guards"
          rm -rf "$publish_dir"
          mkdir -p "$publish_dir"
          for file in environment.txt result.txt summary.txt git-status.txt git-diff-check.txt; do
            if [[ -f "$artifact_dir/$file" ]]; then
              cp "$artifact_dir/$file" "$publish_dir/$file"
            fi
          done
          git config user.name "Agent 69"
          git config user.email "actions@users.noreply.github.com"
          git add "$publish_dir"
          git commit -m "test: record Agent 69 Wine validation [skip ci]"
          git push origin "HEAD:refs/heads/validation/code-mode-wine-target-guards-results" --force
