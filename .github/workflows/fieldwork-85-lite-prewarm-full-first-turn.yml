name: fieldwork-85-lite-prewarm-full-first-turn

on:
  push:
    branches:
      - fieldwork/85-lite-prewarm-full-first-turn

permissions:
  contents: write

concurrency:
  group: fieldwork-85-lite-prewarm-full-first-turn
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/85-lite-prewarm-full-first-turn
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Apply bounded transport candidate
        run: python3 .github/fieldwork/85_apply_lite_prewarm_full_first_turn.py
      - name: Format
        working-directory: codex-rs
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Test Responses Lite first generated request
        working-directory: codex-rs
        run: cargo test -p codex-core --test all websocket_first_responses_lite_turn_sends_full_manifest_after_startup_prewarm --locked
      - name: Test Responses Lite generated-response reuse
        working-directory: codex-rs
        run: cargo test -p codex-core --test all responses_lite_reuses_generated_response_after_full_first_turn --locked
      - name: Preserve non-Lite prewarm reuse
        working-directory: codex-rs
        run: cargo test -p codex-core --test all responses_websocket_request_prewarm_reuses_connection --locked
      - name: Check patch hygiene
        run: git diff --check
      - name: Commit validated source
        run: |
          rm .github/fieldwork/85_apply_lite_prewarm_full_first_turn.py
          rm .github/workflows/fieldwork-85-lite-prewarm-full-first-turn.yml
          rmdir .github/fieldwork 2>/dev/null || true
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
          git add codex-rs/core/src/client.rs codex-rs/core/tests/suite/agent_websocket.rs codex-rs/core/tests/suite/client_websockets.rs .github
          git commit -m 'core: send full first Responses Lite turn after prewarm'
          git push origin HEAD:fieldwork/85-lite-prewarm-full-first-turn
