name: fieldwork-83-direct-append-commit-error

on:
  pull_request:
    branches:
      - main
    paths:
      - .fieldwork-83-direct-append-evidence
      - .github/fieldwork/83_add_append_recovery_test.py
      - .github/workflows/fieldwork-83-direct-append-evidence.yml
      - .github/workflows/fieldwork-83-direct-append-evidence-pr.yml
      - .github/workflows/fieldwork-83-direct-append-commit-error.yml
      - codex-rs/thread-store/src/in_memory.rs
      - codex-rs/core/src/session/turn.rs
      - codex-rs/core/src/session/turn_tests.rs

permissions:
  contents: write

concurrency:
  group: fieldwork-83-direct-append-evidence-pr
  cancel-in-progress: true

jobs:
  test-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/83-direct-append-evidence
          fetch-depth: 0
          persist-credentials: true
      - name: Configure validation identity
        run: |
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
      - name: Apply reviewed append candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('.github/workflows/fieldwork-83-direct-append-evidence.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python3 - <<'PY'") + 1
          stop = next(i for i, line in enumerate(lines[start:], start) if line.strip() == 'PY')
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines[start:stop]
          )
          Path('/tmp/fieldwork-83-direct-append-evidence.py').write_text(script + '\n')
          PY
          python3 /tmp/fieldwork-83-direct-append-evidence.py
          python3 .github/fieldwork/83_add_append_recovery_test.py
      - name: Add commit-then-error ambiguity control
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          store_path = 'codex-rs/thread-store/src/in_memory.rs'
          replace_once(
              store_path,
              dedent('''\
                  calls: InMemoryThreadStoreCalls,
                  fail_next_append: Option<String>,
                  created_threads: HashMap<ThreadId, CreateThreadParams>,
              '''),
              dedent('''\
                  calls: InMemoryThreadStoreCalls,
                  fail_next_append: Option<String>,
                  fail_next_append_after_write: Option<String>,
                  created_threads: HashMap<ThreadId, CreateThreadParams>,
              '''),
          )
          replace_once(
              store_path,
              dedent('''\
                  #[doc(hidden)]
                  pub async fn fail_next_append_for_test(&self, message: impl Into<String>) {
                      self.state.lock().await.fail_next_append = Some(message.into());
                  }

                  async fn create_thread(&self, params: CreateThreadParams) -> ThreadStoreResult<()> {
              '''),
              dedent('''\
                  #[doc(hidden)]
                  pub async fn fail_next_append_for_test(&self, message: impl Into<String>) {
                      self.state.lock().await.fail_next_append = Some(message.into());
                  }

                  /// Causes the next non-empty append to persist and then return an error once.
                  ///
                  /// This test/debug-only hook models acknowledgement loss after the write became
                  /// authoritative. Callers must treat the append outcome as ambiguous.
                  #[doc(hidden)]
                  pub async fn fail_next_append_after_write_for_test(
                      &self,
                      message: impl Into<String>,
                  ) {
                      self.state.lock().await.fail_next_append_after_write = Some(message.into());
                  }

                  async fn create_thread(&self, params: CreateThreadParams) -> ThreadStoreResult<()> {
              '''),
          )
          replace_once(
              store_path,
              dedent('''\
                  state.calls.append_items += 1;
                  if let Some(message) = state.fail_next_append.take() {
                      return Err(ThreadStoreError::Internal { message });
                  }
                  state
                      .histories
                      .entry(params.thread_id)
                      .or_default()
                      .extend(persisted_items);
                  Ok(())
              '''),
              dedent('''\
                  state.calls.append_items += 1;
                  if let Some(message) = state.fail_next_append.take() {
                      return Err(ThreadStoreError::Internal { message });
                  }
                  let fail_after_write = state.fail_next_append_after_write.take();
                  state
                      .histories
                      .entry(params.thread_id)
                      .or_default()
                      .extend(persisted_items);
                  if let Some(message) = fail_after_write {
                      return Err(ThreadStoreError::Internal { message });
                  }
                  Ok(())
              '''),
          )

          tests = Path('codex-rs/core/src/session/turn_tests.rs')
          text = tests.read_text(encoding='utf-8')
          test_name = 'direct_tool_result_persistence_marks_commit_then_error_ambiguous'
          if test_name in text:
              raise SystemExit(f'{test_name} already exists')
          text += dedent(r'''

          #[tokio::test]
          async fn direct_tool_result_persistence_marks_commit_then_error_ambiguous() {
              let (session, turn_context, store) = make_session_with_in_memory_persistence().await;

              session
                  .begin_tool_operation_receipt(
                      "call-commit-error".to_string(),
                      ToolOperationEffect::PotentialMutation,
                  )
                  .await;
              session
                  .record_tool_operation_terminal(
                      "call-commit-error",
                      ToolOperationTerminalState::Completed,
                  )
                  .await;
              store
                  .fail_next_append_after_write_for_test(
                      "injected acknowledgement failure after durable append",
                  )
                  .await;

              record_direct_tool_result(
                  &session,
                  &turn_context,
                  direct_function_result("call-commit-error"),
              )
              .await;

              let ambiguous_receipt = session
                  .tool_operation_receipt("call-commit-error")
                  .await
                  .expect("ambiguous receipt should exist");
              assert_eq!(
                  ambiguous_receipt.result_state,
                  ToolOperationResultState::Ambiguous
              );
              assert!(session.has_unreconciled_potential_mutation().await);

              session
                  .begin_tool_operation_receipt(
                      "call-after-commit-error".to_string(),
                      ToolOperationEffect::PotentialMutation,
                  )
                  .await;
              session
                  .record_tool_operation_terminal(
                      "call-after-commit-error",
                      ToolOperationTerminalState::Completed,
                  )
                  .await;
              record_direct_tool_result(
                  &session,
                  &turn_context,
                  direct_function_result("call-after-commit-error"),
              )
              .await;

              let ambiguous_receipt = session
                  .tool_operation_receipt("call-commit-error")
                  .await
                  .expect("ambiguous receipt should remain");
              assert_eq!(
                  ambiguous_receipt.result_state,
                  ToolOperationResultState::Ambiguous
              );
              let recovered_receipt = session
                  .tool_operation_receipt("call-after-commit-error")
                  .await
                  .expect("later receipt should exist");
              assert_eq!(
                  recovered_receipt.result_state,
                  ToolOperationResultState::Persisted
              );
              assert!(session.has_unreconciled_potential_mutation().await);
              assert_eq!(store.calls().await.append_items, 2);

              let persisted = session
                  .services
                  .live_thread
                  .as_ref()
                  .expect("live thread")
                  .load_history(/*include_archived*/ true)
                  .await
                  .expect("load persisted history");
              assert!(has_persisted_function_result(
                  &persisted.items,
                  "call-commit-error",
              ));
              assert!(has_persisted_function_result(
                  &persisted.items,
                  "call-after-commit-error",
              ));

              let in_memory = session.clone_history().await;
              assert!(has_in_memory_function_result(
                  in_memory.raw_items(),
                  "call-commit-error",
              ));
              assert!(has_in_memory_function_result(
                  in_memory.raw_items(),
                  "call-after-commit-error",
              ));
          }
          ''')
          tests.write_text(text, encoding='utf-8')
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Format and run focused tests
        run: |
          rustfmt --edition 2024 codex-rs/thread-store/src/in_memory.rs codex-rs/core/src/session/turn.rs codex-rs/core/src/session/turn_tests.rs
          rustfmt --edition 2024 --check codex-rs/thread-store/src/in_memory.rs codex-rs/core/src/session/turn.rs codex-rs/core/src/session/turn_tests.rs
          cd codex-rs
          cargo test -p codex-core --lib direct_tool_result_persistence_ --locked
          cargo test -p codex-thread-store --lib in_memory --locked
      - name: Verify patch hygiene
        run: git diff --check
      - name: Publish validated source-only head
        run: |
          rm -f .fieldwork-83-direct-append-evidence
          rm -f .github/fieldwork/83_add_append_recovery_test.py
          rm -f .github/workflows/fieldwork-83-direct-append-evidence.yml
          rm -f .github/workflows/fieldwork-83-direct-append-evidence-pr.yml
          rm -f .github/workflows/fieldwork-83-direct-append-commit-error.yml
          rmdir .github/fieldwork 2>/dev/null || true
          git add -A
          git commit -m 'core: prove append acknowledgement ambiguity'
          git push origin HEAD:fieldwork/83-direct-append-evidence
