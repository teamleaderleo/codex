name: fieldwork-83-result-transition-pr

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fieldwork-83-result-transition-tests.yml
      - .github/workflows/fieldwork-83-result-transition-pr.yml
      - codex-rs/core/src/session/turn.rs
      - codex-rs/core/src/session/turn_tests.rs

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Apply production-path transition tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/fieldwork-83-result-transition-tests.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == 'from pathlib import Path')
          stop = next(
              i for i, line in enumerate(source[start:], start)
              if line.strip() == "Path('.github/workflows/fieldwork-83-result-transition-tests.yml').unlink()"
          )
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:stop + 1])
          Path('/tmp/fieldwork-83-result-transition.py').write_text(script + '\n')
          PY
          python3 /tmp/fieldwork-83-result-transition.py
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Format and run focused tests
        working-directory: codex-rs
        run: |
          cargo fmt --all
          cargo test -p codex-core --lib direct_tool_result_persistence --locked
          cargo test -p codex-core --lib response_input_tool_call_id --locked
          cargo test -p codex-core --lib tool_operation_receipts --locked
      - name: Verify patch hygiene
        run: git diff --check
