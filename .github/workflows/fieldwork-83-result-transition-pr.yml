name: fieldwork-83-result-transition-pr

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fieldwork-83-result-transition-tests.yml
      - .github/workflows/fieldwork-83-result-transition-pr.yml
      - codex-rs/core/src/session/turn.rs
      - codex-rs/core/src/session/turn_tests.rs

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Apply production-path transition tests
        run: |
          sed -n '/          from pathlib import Path/,/          Path(".github\/workflows\/fieldwork-83-result-transition-tests.yml").unlink()/p' \
            .github/workflows/fieldwork-83-result-transition-tests.yml \
            | sed 's/^          //' > /tmp/fieldwork-83-result-transition.py
          python3 /tmp/fieldwork-83-result-transition.py
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Format and run focused tests
        working-directory: codex-rs
        run: |
          cargo fmt --all
          cargo test -p codex-core --lib direct_tool_result_persistence --locked
          cargo test -p codex-core --lib response_input_tool_call_id --locked
          cargo test -p codex-core --lib tool_operation_receipts --locked
      - name: Verify patch hygiene
        run: git diff --check
