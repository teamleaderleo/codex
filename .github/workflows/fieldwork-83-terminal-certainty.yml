name: Fieldwork 83 terminal certainty

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/fieldwork/83_terminal_certainty.py
      - .github/workflows/fieldwork-83-terminal-certainty.yml
      - codex-rs/core/src/tools/lifecycle.rs
      - codex-rs/core/src/tools/parallel.rs
      - codex-rs/tools/src/tool_operation.rs
      - codex-rs/tools/src/tool_operation_tests.rs

permissions:
  contents: write

concurrency:
  group: fieldwork-83-terminal-certainty
  cancel-in-progress: true

jobs:
  test-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/83-terminal-certainty
          fetch-depth: 0
          persist-credentials: true
      - name: Configure validation identity
        run: |
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
      - name: Harden source generator anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('.github/fieldwork/83_terminal_certainty.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def replace_once(')
          stop = text.index('\n\nlifecycle =')
          helpers = dedent('''\
          def _indent_block(block: str, spaces: int) -> str:
              prefix = " " * spaces
              return "".join(
                  prefix + line if line.strip() else line
                  for line in block.splitlines(keepends=True)
              )


          def _line_boundary_matches(text: str, block: str):
              matches = []
              offset = 0
              while True:
                  index = text.find(block, offset)
                  if index < 0:
                      return matches
                  if index == 0 or text[index - 1] == "\\n":
                      matches.append(index)
                  offset = index + 1


          def _indented_matches(text: str, block: str):
              matches = []
              seen = set()
              for spaces in range(33):
                  candidate = _indent_block(block, spaces)
                  if candidate in seen:
                      continue
                  seen.add(candidate)
                  for index in _line_boundary_matches(text, candidate):
                      matches.append((index, candidate, spaces))
              return matches


          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              matches = _indented_matches(text, old)
              if len(matches) != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {len(matches)}")
              index, candidate, spaces = matches[0]
              replacement = _indent_block(new, spaces)
              target.write_text(
                  text[:index] + replacement + text[index + len(candidate) :],
                  encoding="utf-8",
              )


          def replace_first(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              matches = _indented_matches(text, old)
              if not matches:
                  raise SystemExit(f"{path}: first anchor missing")
              index, candidate, spaces = min(matches, key=lambda match: match[0])
              replacement = _indent_block(new, spaces)
              target.write_text(
                  text[:index] + replacement + text[index + len(candidate) :],
                  encoding="utf-8",
              )


          def replace_last(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              matches = _indented_matches(text, old)
              if not matches:
                  raise SystemExit(f"{path}: last anchor missing")
              index, candidate, spaces = max(matches, key=lambda match: match[0])
              replacement = _indent_block(new, spaces)
              target.write_text(
                  text[:index] + replacement + text[index + len(candidate) :],
                  encoding="utf-8",
              )
          ''')
          path.write_text(text[:start] + helpers + text[stop:], encoding='utf-8')
          PY
      - name: Apply terminal-certainty source slice
        run: python3 .github/fieldwork/83_terminal_certainty.py
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Format and run focused tests
        run: |
          rustfmt --edition 2024 codex-rs/core/src/tools/lifecycle.rs codex-rs/core/src/tools/parallel.rs codex-rs/tools/src/tool_operation.rs codex-rs/tools/src/tool_operation_tests.rs
          rustfmt --edition 2024 --check codex-rs/core/src/tools/lifecycle.rs codex-rs/core/src/tools/parallel.rs codex-rs/tools/src/tool_operation.rs codex-rs/tools/src/tool_operation_tests.rs
          cd codex-rs
          cargo test -p codex-tools --locked
          cargo test -p codex-core --lib tools::lifecycle::tests --locked
          cargo test -p codex-core --lib tools::parallel::tests --locked
      - name: Verify patch hygiene
        run: git diff --check
      - name: Publish validated source-only head
        run: |
          rm -f .github/fieldwork/83_terminal_certainty.py
          rm -f .github/workflows/fieldwork-83-terminal-certainty.yml
          rmdir .github/fieldwork 2>/dev/null || true
          git add -A
          git commit -m 'core: preserve execution certainty for cancelled tools'
          git push origin HEAD:fieldwork/83-terminal-certainty
