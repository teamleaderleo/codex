name: fieldwork-84-publication-a01a

on:
  pull_request:
    branches:
      - fieldwork/84-publication-carrier-base-a01a
    paths:
      - .github/workflows/fieldwork-84-publication-a01a.yml

permissions:
  contents: read

concurrency:
  group: fieldwork-84-publication-a01a
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact publication source head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: c3373c717f3138ff5f0a979d12836f60800d2bcf
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Verify one-file source fence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c3373c717f3138ff5f0a979d12836f60800d2bcf
          actual="$(git diff --name-only a01a2d91461a57809e944de7758477b92617ab01 HEAD)"
          test "$actual" = 'codex-rs/codex-mcp/src/runtime.rs'
          git diff --check a01a2d91461a57809e944de7758477b92617ab01 HEAD
          echo 'FIELDWORK_MCP_PUBLICATION_SOURCE=c3373c717f3138ff5f0a979d12836f60800d2bcf'

      - name: Format and run five exact publication controls
        working-directory: codex-rs
        env:
          RUST_MIN_STACK: 16777216
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p codex-mcp --lib --locked -- --list > /tmp/codex-mcp-tests.list
          suffixes=(
            publication_state_rejects_older_generation
            publication_state_carries_freshness_across_overlapping_refreshes
            publication_state_rejects_candidate_when_freshness_advances
            publication_state_keeps_stale_candidate_gate_closed
            publication_gate_opens_only_for_the_winning_candidate
          )
          resolved=()
          for suffix in "${suffixes[@]}"; do
            mapfile -t matches < <(sed -n 's/: test$//p' /tmp/codex-mcp-tests.list | grep "${suffix}$")
            printf '%s matches: %s\n' "$suffix" "${matches[*]:-<none>}"
            test "${#matches[@]}" -eq 1
            resolved+=("${matches[0]}")
          done
          test "$(printf '%s\n' "${resolved[@]}" | sort -u | wc -l)" -eq 5
          for test_name in "${resolved[@]}"; do
            cargo test -p codex-mcp --lib --locked "$test_name" -- --exact --nocapture
          done
          echo 'FIELDWORK_MCP_PUBLICATION_EXACT=5/5'

      - name: Run complete codex-mcp package
        working-directory: codex-rs
        env:
          RUST_MIN_STACK: 16777216
        run: cargo test -p codex-mcp --locked
