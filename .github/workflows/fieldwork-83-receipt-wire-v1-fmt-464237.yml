name: fieldwork-83-receipt-wire-v1-fmt-464237

on:
  pull_request:
    branches:
      - fieldwork/83-receipt-wire-v1-fmt-464237
    paths:
      - .github/workflows/fieldwork-83-receipt-wire-v1-fmt-464237.yml

permissions:
  contents: read

concurrency:
  group: fieldwork-83-receipt-wire-v1-fmt-464237
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out exact carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source and carrier fences
        env:
          SOURCE_BASE: 4642370542739d5dd080b0c87a9de06a6435d3db
          SOURCE_HEAD: 8b31601977ccedce8a1c79c81b1b055d733402a9
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$SOURCE_HEAD"
          test "$(git merge-base "$SOURCE_HEAD" "$SOURCE_BASE")" = "$SOURCE_BASE"
          source_actual="$(git diff --name-only "$SOURCE_BASE" "$SOURCE_HEAD" | sort)"
          source_expected="$(printf '%s\n' codex-rs/protocol/src/lib.rs codex-rs/protocol/src/tool_operation.rs | sort)"
          test "$source_actual" = "$source_expected"
          carrier_actual="$(git diff --name-only "$SOURCE_HEAD" HEAD | sort)"
          carrier_expected='.github/workflows/fieldwork-83-receipt-wire-v1-fmt-464237.yml'
          test "$carrier_actual" = "$carrier_expected"
          git diff --check "$SOURCE_BASE" "$SOURCE_HEAD"
          echo "FIELDWORK_RECEIPT_WIRE_SOURCE_HEAD=$SOURCE_HEAD"
          echo "FIELDWORK_RECEIPT_WIRE_CARRIER_HEAD=$(git rev-parse HEAD)"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Format-check exact source
        working-directory: codex-rs
        run: cargo fmt --all -- --check

      - name: Run five exact receipt-wire controls
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test -p codex-protocol --lib --locked -- --list > /tmp/receipt-wire-tests.list
          suffixes=(
            potential_mutation_requires_terminal_and_persisted_result
            duplicate_result_becomes_ambiguous
            code_mode_identity_excludes_synthetic_host_call_id
            checkpoint_round_trips_receipt_state
            unknown_version_remains_visible_to_replay_validation
          )
          executed=0
          for suffix in "${suffixes[@]}"; do
            mapfile -t matches < <(sed -n 's/: test$//p' /tmp/receipt-wire-tests.list | grep "${suffix}$")
            printf '%s matches: %s\n' "$suffix" "${matches[*]:-<none>}"
            test "${#matches[@]}" -eq 1
            cargo test -p codex-protocol --lib --locked "${matches[0]}" -- --exact --nocapture
            executed=$((executed + 1))
          done
          test "$executed" -eq 5
          echo 'FIELDWORK_RECEIPT_WIRE_EXACT=5/5'

      - name: Run complete protocol package
        working-directory: codex-rs
        run: cargo test -p codex-protocol --locked
