name: fieldwork-239-lite-publish

on:
  pull_request:
    branches:
      - fieldwork/upstream-97576-lite-base
    paths:
      - .github/fieldwork/239_apply_lite_full_first_turn.py
      - .github/workflows/fieldwork-239-lite-publish.yml

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Apply current-head source and tests
        run: python3 .github/fieldwork/239_apply_lite_full_first_turn.py
      - name: Format and verify source inventory
        run: |
          set -euo pipefail
          cd codex-rs
          cargo fmt --all
          cd ..
          git diff --check
          git diff --name-only > /tmp/source-files
          cat /tmp/source-files
          test "$(wc -l < /tmp/source-files)" -eq 3
          grep -Fx 'codex-rs/core/src/client.rs' /tmp/source-files
          grep -Fx 'codex-rs/core/tests/suite/agent_websocket.rs' /tmp/source-files
          grep -Fx 'codex-rs/core/tests/suite/client_websockets.rs' /tmp/source-files
          git diff --binary -- \
            codex-rs/core/src/client.rs \
            codex-rs/core/tests/suite/agent_websocket.rs \
            codex-rs/core/tests/suite/client_websockets.rs > /tmp/source.patch
      - name: Resolve and run exact client controls
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test -p codex-core --test all --locked -- --list > /tmp/tests.list
          suffixes=(
            responses_lite_reuses_generated_response_after_full_first_turn
            responses_lite_retries_full_first_turn_after_failed_generation
          )
          executed=0
          for suffix in "${suffixes[@]}"; do
            mapfile -t matches < <(sed -n 's/: test$//p' /tmp/tests.list | grep "${suffix}$")
            printf '%s matches: %s\n' "$suffix" "${matches[*]:-<none>}"
            test "${#matches[@]}" -eq 1
            cargo test -p codex-core --test all --locked "${matches[0]}" -- --exact --nocapture
            executed=$((executed + 1))
          done
          test "$executed" -eq 2
          echo "FIELDWORK_LITE_CLIENT_EXACT=2/2"
      - name: Classify exact agent regression on default and enlarged stacks
        working-directory: codex-rs
        run: |
          set -euo pipefail
          suffix=websocket_first_responses_lite_turn_sends_exact_current_request_after_startup_prewarm
          cargo test -p codex-core --test all --locked -- --list > /tmp/tests.list
          mapfile -t matches < <(sed -n 's/: test$//p' /tmp/tests.list | grep "${suffix}$")
          printf '%s matches: %s\n' "$suffix" "${matches[*]:-<none>}"
          test "${#matches[@]}" -eq 1
          set +e
          cargo test -p codex-core --test all --locked "${matches[0]}" -- --exact --nocapture 2>&1 | tee /tmp/default.log
          default_status=${PIPESTATUS[0]}
          RUST_MIN_STACK=16777216 cargo test -p codex-core --test all --locked "${matches[0]}" -- --exact --nocapture 2>&1 | tee /tmp/large.log
          large_status=${PIPESTATUS[0]}
          set -e
          test "$large_status" -eq 0
          if test "$default_status" -ne 0; then
            grep -E 'stack overflow|has overflowed its stack' /tmp/default.log
          fi
          echo "FIELDWORK_LITE_AGENT=default:${default_status};large:${large_status}"
      - name: Publish source-only exact head
        run: |
          set -euo pipefail
          upstream=97576b1794872e342450ebd577123e052ab57626
          target=fieldwork/239-lite-source-97576
          git reset --hard "$upstream"
          git apply /tmp/source.patch
          cd codex-rs
          cargo fmt --all -- --check
          cd ..
          git diff --check
          git config user.name fieldwork-bot
          git config user.email fieldwork-bot@users.noreply.github.com
          git add \
            codex-rs/core/src/client.rs \
            codex-rs/core/tests/suite/agent_websocket.rs \
            codex-rs/core/tests/suite/client_websockets.rs
          git commit -m 'core: send full first Responses Lite turn after prewarm'
          source_sha=$(git rev-parse HEAD)
          git push --force origin "HEAD:refs/heads/${target}"
          echo "FIELDWORK_LITE_SOURCE=${source_sha}"
