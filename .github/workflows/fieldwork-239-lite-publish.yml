name: fieldwork-239-lite-publish

on:
  pull_request:
    branches:
      - fieldwork/upstream-97576-lite-base
    paths:
      - .github/fieldwork/239_apply_lite_full_first_turn.py
      - .github/fieldwork/239_fix_lite_agent_prefix.py
      - .github/workflows/fieldwork-239-lite-publish.yml

concurrency:
  group: fieldwork-239-lite-publish
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SOURCE_BASE: e6cfd40c3f444aadd6017c9eeab01db70f48961a
  SOURCE_BRANCH: fieldwork/239-lite-source-e6cfd

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Record exact carrier
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_BASE}^{commit}"
          echo "FIELDWORK_LITE_CARRIER_HEAD=$(git rev-parse HEAD)"
          echo "FIELDWORK_LITE_SOURCE_BASE=$SOURCE_BASE"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Build reviewed three-file patch
        run: |
          set -euo pipefail
          python3 .github/fieldwork/239_apply_lite_full_first_turn.py
          cd codex-rs
          cargo fmt --all
          cd ..
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            codex-rs/core/src/client.rs \
            codex-rs/core/tests/suite/agent_websocket.rs \
            codex-rs/core/tests/suite/client_websockets.rs | sort)"
          printf 'carrier source files:\n%s\n' "$actual"
          test "$actual" = "$expected"
          git diff --binary -- \
            codex-rs/core/src/client.rs \
            codex-rs/core/tests/suite/agent_websocket.rs \
            codex-rs/core/tests/suite/client_websockets.rs > /tmp/source.patch
          test -s /tmp/source.patch
      - name: Construct exact source worktree
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/fieldwork-lite-source "$SOURCE_BASE"
          cd /tmp/fieldwork-lite-source
          git apply /tmp/source.patch
          cd codex-rs
          cargo fmt --all
          cargo fmt --all -- --check
          cd ..
          actual="$(git diff --name-only "$SOURCE_BASE" | sort)"
          expected="$(printf '%s\n' \
            codex-rs/core/src/client.rs \
            codex-rs/core/tests/suite/agent_websocket.rs \
            codex-rs/core/tests/suite/client_websockets.rs | sort)"
          printf 'exact source files:\n%s\n' "$actual"
          test "$actual" = "$expected"
          git diff --check "$SOURCE_BASE"
          echo 'FIELDWORK_LITE_SOURCE_FENCE=3/3'
      - name: Resolve and run exact client controls on source
        run: |
          set -euo pipefail
          cd /tmp/fieldwork-lite-source/codex-rs
          cargo test -p codex-core --test all --locked -- --list > /tmp/lite-tests.list
          suffixes=(
            responses_lite_reuses_generated_response_after_full_first_turn
            responses_lite_retries_full_first_turn_after_failed_generation
          )
          executed=0
          for suffix in "${suffixes[@]}"; do
            mapfile -t matches < <(sed -n 's/: test$//p' /tmp/lite-tests.list | grep "${suffix}$")
            printf '%s matches: %s\n' "$suffix" "${matches[*]:-<none>}"
            test "${#matches[@]}" -eq 1
            cargo test -p codex-core --test all --locked "${matches[0]}" -- --exact --nocapture
            executed=$((executed + 1))
          done
          test "$executed" -eq 2
          echo 'FIELDWORK_LITE_CLIENT_EXACT=2/2'
      - name: Classify exact agent regression on source
        run: |
          set -euo pipefail
          cd /tmp/fieldwork-lite-source/codex-rs
          suffix=websocket_first_responses_lite_turn_sends_exact_current_request_after_startup_prewarm
          cargo test -p codex-core --test all --locked -- --list > /tmp/lite-agent-tests.list
          mapfile -t matches < <(sed -n 's/: test$//p' /tmp/lite-agent-tests.list | grep "${suffix}$")
          printf '%s matches: %s\n' "$suffix" "${matches[*]:-<none>}"
          test "${#matches[@]}" -eq 1
          set +e
          cargo test -p codex-core --test all --locked "${matches[0]}" -- --exact --nocapture 2>&1 | tee /tmp/lite-default.log
          default_status=${PIPESTATUS[0]}
          RUST_MIN_STACK=16777216 cargo test -p codex-core --test all --locked "${matches[0]}" -- --exact --nocapture 2>&1 | tee /tmp/lite-large.log
          large_status=${PIPESTATUS[0]}
          set -e
          test "$large_status" -eq 0
          if test "$default_status" -ne 0; then
            grep -E 'stack overflow|has overflowed its stack' /tmp/lite-default.log
          fi
          echo "FIELDWORK_LITE_AGENT=default:${default_status};large:${large_status}"
      - name: Publish validated source-only exact head
        run: |
          set -euo pipefail
          cd /tmp/fieldwork-lite-source
          git config user.name fieldwork-bot
          git config user.email fieldwork-bot@users.noreply.github.com
          git add \
            codex-rs/core/src/client.rs \
            codex-rs/core/tests/suite/agent_websocket.rs \
            codex-rs/core/tests/suite/client_websockets.rs
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            codex-rs/core/src/client.rs \
            codex-rs/core/tests/suite/agent_websocket.rs \
            codex-rs/core/tests/suite/client_websockets.rs | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m 'core: send full first Responses Lite turn after prewarm'
          source_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$SOURCE_BASE"
          git push --force origin "HEAD:refs/heads/${SOURCE_BRANCH}"
          echo "FIELDWORK_LITE_SOURCE=$source_sha"
          echo "FIELDWORK_LITE_SOURCE_BRANCH=$SOURCE_BRANCH"
