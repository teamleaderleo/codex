name: fieldwork-83-dispatch-receipt

on:
  pull_request:
    paths:
      - codex-rs/core/src/state/**
      - codex-rs/core/src/session/**
      - codex-rs/core/src/tools/**
      - .github/fieldwork/83_dispatch_apply.py
      - .github/workflows/fieldwork-83-dispatch-receipt.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/83-dispatch-receipt-wiring
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
      - name: Apply bounded source candidate
        run: python3 .github/fieldwork/83_dispatch_apply.py
      - name: Format
        run: cargo fmt --all
        working-directory: codex-rs
      - name: Compile and run focused core tests
        run: |
          cargo test -p codex-core tool_operation --locked
          cargo test -p codex-core operation_effect --locked
        working-directory: codex-rs
      - name: Check diff
        run: git diff --check
      - name: Commit validated source
        run: |
          rm .github/fieldwork/83_dispatch_apply.py
          rm .github/workflows/fieldwork-83-dispatch-receipt.yml
          rmdir .github/fieldwork 2>/dev/null || true
          git config user.name "teamleaderleo"
          git config user.email "13091533+teamleaderleo@users.noreply.github.com"
          git add codex-rs/core/src .github
          git commit -m "core: retain direct tool operation receipts across turns"
          git push origin HEAD:fieldwork/83-dispatch-receipt-wiring
