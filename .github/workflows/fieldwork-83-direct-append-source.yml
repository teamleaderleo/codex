name: fieldwork-83-append-outcome-current-upstream

on:
  push:
    branches:
      - fieldwork/83-direct-append-carrier-20260731
    paths:
      - .github/workflows/fieldwork-83-direct-append-source.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fieldwork-83-direct-append-source.yml

permissions:
  contents: write

concurrency:
  group: fieldwork-83-append-outcome-current-upstream
  cancel-in-progress: true

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/83-direct-append-carrier-20260731
          fetch-depth: 0
          persist-credentials: true

      - name: Configure validation identity
        run: |
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Install repository test runners
        run: |
          command -v just >/dev/null || cargo install --locked just
          cargo nextest --version >/dev/null 2>&1 || cargo install --locked cargo-nextest

      - name: Apply reviewed append-outcome candidate to exact current upstream
        env:
          CURRENT_BASE: 97576b1794872e342450ebd577123e052ab57626
          REVIEWED_BASE: b545c94041017d000e2c8b2f6272705d21b85dfb
          REVIEWED_HEAD: 30a0a9b50da5fd2f7d58ee81315e0311e84e221e
        run: |
          test "$(git rev-parse fieldwork/upstream-97576b-source-base)" = "$CURRENT_BASE"
          git diff --binary "$REVIEWED_BASE" "$REVIEWED_HEAD" -- \
            codex-rs/core/src/session/mod.rs \
            codex-rs/core/src/session/turn_tests.rs \
            codex-rs/thread-store/src/in_memory.rs \
            > /tmp/fieldwork-83-append-outcome.patch
          test -s /tmp/fieldwork-83-append-outcome.patch
          git switch --detach "$CURRENT_BASE"
          git apply --3way --index /tmp/fieldwork-83-append-outcome.patch
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            codex-rs/core/src/session/mod.rs \
            codex-rs/core/src/session/turn_tests.rs \
            codex-rs/thread-store/src/in_memory.rs | sort)"
          test "$actual" = "$expected"
          git diff --cached --check

      - name: Format and run exact append-outcome controls
        run: |
          just fmt
          just test -p codex-core append_outcome_ephemeral_history_is_authoritative --exact
          just test -p codex-core append_outcome_reports_successful_live_append --exact
          just test -p codex-core append_outcome_reports_prewrite_failure --exact
          just test -p codex-core append_outcome_reports_commit_then_error_as_failure --exact
          echo 'FIELDWORK_APPEND_OUTCOME_EXACT=4/4'

      - name: Run thread-store package tests
        run: |
          just test -p codex-thread-store

      - name: Preserve exact source fence
        run: |
          git add \
            codex-rs/core/src/session/mod.rs \
            codex-rs/core/src/session/turn_tests.rs \
            codex-rs/thread-store/src/in_memory.rs
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            codex-rs/core/src/session/mod.rs \
            codex-rs/core/src/session/turn_tests.rs \
            codex-rs/thread-store/src/in_memory.rs | sort)"
          test "$actual" = "$expected"
          git diff --cached --check

      - name: Publish clean source-only branch
        env:
          SOURCE_BRANCH: fieldwork/83-append-outcome-upstream-97576b
        run: |
          git switch -C "$SOURCE_BRANCH"
          git commit -m 'core: propagate rollout append outcomes'
          git push --force origin "HEAD:refs/heads/$SOURCE_BRANCH"
