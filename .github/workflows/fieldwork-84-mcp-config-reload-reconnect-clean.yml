name: fieldwork-84-mcp-config-reload-reconnect-clean

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fieldwork-84-mcp-config-reload-reconnect-clean.yml

permissions:
  contents: write

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/84-mcp-config-reload-reconnect-clean
          fetch-depth: 0
          persist-credentials: true
      - run: |
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
      - name: Apply reconnect primitive and focused regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('codex-rs/core/src/codex_thread.rs')
          text = source.read_text(encoding='utf-8')
          old = '''    /// Refresh MCP configuration and managed requirements without reloading unrelated settings.
          pub async fn refresh_mcp_config(&self, next_config: crate::config::Config) {
              self.session.refresh_mcp_config(next_config).await;
          }
          '''.replace('          ', '')
          new = '''    /// Refresh MCP configuration and managed requirements without reloading unrelated settings.
          ///
          /// A host-requested MCP config reload is an explicit freshness boundary. Request fresh
          /// connections before publishing the new config so a stable endpoint cannot retain its
          /// startup-captured server identity and tool catalogue.
          pub async fn refresh_mcp_config(&self, next_config: crate::config::Config) {
              self.session
                  .services
                  .mcp_runtime
                  .reconnect_on_next_refresh();
              self.session.refresh_mcp_config(next_config).await;
          }
          '''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit('refresh_mcp_config anchor changed')
          source.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('codex-rs/core/tests/suite/mcp_tool_exposure.rs')
          text = tests.read_text(encoding='utf-8')
          anchor = '''#[tokio::test(flavor = "multi_thread", worker_threads = 2)]
          async fn out_of_band_resource_read_reconciles_the_published_mcp_runtime() -> Result<()> {
          '''.replace('          ', '')
          regression = '''#[tokio::test(flavor = "multi_thread", worker_threads = 2)]
          async fn host_mcp_config_refresh_reconnects_ready_clients() -> Result<()> {
              skip_if_no_network!(Ok(()));

              let server = responses::start_mock_server().await;
              let (apps_server, startup_control) =
                  AppsTestServer::mount_with_startup_control(&server).await?;
              let test = search_capable_apps_builder(apps_server.chatgpt_base_url.clone())
                  .build(&server)
                  .await?;
              wait_for_mcp_server(&test.codex, CODEX_APPS_MCP_SERVER_NAME).await?;

              let initial_attempts = startup_control.initialize_attempts();
              assert!(initial_attempts > 0);

              test.codex.refresh_mcp_config(test.config.clone()).await;

              tokio::time::timeout(Duration::from_secs(5), async {
                  while startup_control.initialize_attempts() <= initial_attempts {
                      tokio::time::sleep(Duration::from_millis(10)).await;
                  }
              })
              .await
              .expect("host MCP config refresh should reconnect the ready client");
              assert_eq!(startup_control.initialize_attempts(), initial_attempts + 1);
              Ok(())
          }

          '''.replace('          ', '')
          if text.count(anchor) != 1:
              raise SystemExit('MCP exposure test anchor changed')
          tests.write_text(text.replace(anchor, regression + anchor, 1), encoding='utf-8')
          PY
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Execute focused source gate
        run: |
          rustfmt --edition 2024 \
            codex-rs/core/src/codex_thread.rs \
            codex-rs/core/tests/suite/mcp_tool_exposure.rs
          rustfmt --edition 2024 --check \
            codex-rs/core/src/codex_thread.rs \
            codex-rs/core/tests/suite/mcp_tool_exposure.rs
          cd codex-rs
          cargo test -p codex-core --test all host_mcp_config_refresh_reconnects_ready_clients --locked
          cargo test -p codex-core --test all reconciliation_reuses_connection_without_relisting_regular_tools --locked
      - name: Publish source-only head
        run: |
          rm -f .github/workflows/fieldwork-84-mcp-config-reload-reconnect-clean.yml
          expected=$(printf '%s\n' \
            codex-rs/core/src/codex_thread.rs \
            codex-rs/core/tests/suite/mcp_tool_exposure.rs)
          actual=$(git diff --name-only origin/main | sort)
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"
          git diff --check
          git add -A
          git commit -m 'core: reconnect MCP clients on host config reload'
          git push origin HEAD:fieldwork/84-mcp-config-reload-reconnect-clean
