name: fieldwork-85-lite-code-mode-isolation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fieldwork-85-lite-code-mode-isolation.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  responses-lite-without-code-mode:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Apply Responses Lite candidate
        run: python3 .github/fieldwork/85_apply_lite_prewarm_full_first_turn.py
      - name: Replace full Code Mode regression with no-Code-Mode control
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('codex-rs/core/tests/suite/agent_websocket.rs')
          text = path.read_text(encoding='utf-8')
          start = text.index('async fn websocket_first_responses_lite_turn_sends_full_manifest_after_startup_prewarm()')
          attribute_start = text.rfind('#[tokio::test', 0, start)
          next_test = text.index('\n#[tokio::test', start)
          replacement = r'''#[tokio::test(flavor = "multi_thread", worker_threads = 2)]
          async fn websocket_first_responses_lite_turn_without_code_mode_uses_default_stack() -> Result<()>
          {
              skip_if_no_network!(Ok(()));

              let server = start_websocket_server(vec![vec![
                  vec![ev_response_created("warm-1"), ev_completed("warm-1")],
                  vec![
                      ev_response_created("resp-1"),
                      ev_assistant_message("msg_1", "hello"),
                      ev_completed("resp-1"),
                  ],
              ]])
              .await;

              let mut builder = test_codex()
                  .with_model_info_override("gpt-5.4", |model_info| {
                      model_info.use_responses_lite = true;
                      model_info.tool_mode = None;
                  })
                  .with_model("gpt-5.4");
              let test = builder.build_with_websocket_server(&server).await?;
              test.submit_turn_with_policy("hello", test.config.legacy_sandbox_policy())
                  .await?;

              assert_eq!(server.handshakes().len(), 1);
              let connection = server.single_connection();
              assert_eq!(connection.len(), 2);
              let warmup = connection
                  .first()
                  .expect("missing Responses Lite warmup request")
                  .body_json();
              let turn = connection
                  .get(1)
                  .expect("missing Responses Lite turn request")
                  .body_json();

              assert_eq!(warmup["generate"].as_bool(), Some(false));
              assert_eq!(turn.get("previous_response_id"), None);
              assert!(
                  turn.get("input")
                      .and_then(Value::as_array)
                      .is_some_and(|items| !items.is_empty()),
                  "first generated Responses Lite turn should carry direct input"
              );

              server.shutdown().await;
              Ok(())
          }

          '''.replace('          ', '')
          path.write_text(text[:attribute_start] + replacement + text[next_test + 1:], encoding='utf-8')
          PY
      - name: Format diagnostic source
        working-directory: codex-rs
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
      - name: Run Responses Lite without Code Mode on default worker stack
        working-directory: codex-rs
        run: cargo test -p codex-core --test all websocket_first_responses_lite_turn_without_code_mode_uses_default_stack --locked
