name: fieldwork-85-deferred-exposure-clean

on:
  push:
    branches:
      - fieldwork/85-deferred-exposure-clean

permissions:
  contents: write

concurrency:
  group: fieldwork-85-deferred-exposure-clean
  cancel-in-progress: true

jobs:
  apply-test-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out current main restack branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/85-deferred-exposure-clean
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact tested source diff
        run: |
          git diff 92f28f9bd0edbe00b28516ba0a2d84e08ebd8ac3^ 92f28f9bd0edbe00b28516ba0a2d84e08ebd8ac3 -- \
            codex-rs/core/src/tools/spec_plan.rs \
            codex-rs/core/src/tools/spec_plan_tests.rs \
            | git apply --3way
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Format and run focused planner tests
        working-directory: codex-rs
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p codex-core --lib tools::spec_plan::tests --locked
      - name: Verify patch hygiene
        run: git diff --check
      - name: Publish source-only restack
        run: |
          rm .github/workflows/fieldwork-85-deferred-exposure-clean.yml
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
          git add codex-rs/core/src/tools .github
          git commit -m 'core: direct-expose deferred tools without a loader'
          git push origin HEAD:fieldwork/85-deferred-exposure-clean
