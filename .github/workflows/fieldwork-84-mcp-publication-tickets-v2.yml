name: fieldwork-84-mcp-publication-tickets-v2

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fieldwork-84-mcp-publication-tickets-v2.yml

permissions:
  contents: write

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/84-mcp-publication-tickets
          fetch-depth: 0
          persist-credentials: true
      - run: |
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
      - name: Apply generation and freshness state with scoped publication tail
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/fieldwork-84-mcp-publication-tickets.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python3 - <<'PY'") + 1
          stop = next(i for i, line in enumerate(lines[start:], start) if line.strip() == 'PY')
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines[start:stop]
          )

          brittle_start = script.index("old_publish_tail = '''")
          brittle_end = script.index(
              "\n\ntext = text.replace(\n    '''    /// Ensures the next refresh",
              brittle_start,
          )
          scoped_tail = r'''
          tail_start = text.index(
              "        self.current.store(Arc::new(PublishedMcpRuntime {",
              publish_start,
          )
          tail_end = text.index(
              "\n    /// Ensures the next refresh creates fresh connections",
              tail_start,
          )
          new_publish_tail = """        let candidate = Arc::new(PublishedMcpRuntime {
              connections,
              config: Some(config),
              auth,
              auth_token,
              plugins_available,
              ready_selected_capability_roots,
          });
              let accepted = {
                  let mut state = self
                      .publication_state
                      .lock()
                      .unwrap_or_else(|poisoned| poisoned.into_inner());
                  if state.can_publish(ticket) {
                      self.current.store(candidate);
                      state.mark_published(ticket);
                      true
                  } else {
                      false
                  }
              };
              if accepted {
                  let _ = publish.send(true);
              }
              accepted
          }

          """
          text = text[:tail_start] + new_publish_tail + text[tail_end:]
          '''.strip('\n')
          script = script[:brittle_start] + scoped_tail + script[brittle_end:]
          Path('/tmp/fieldwork-84-publication-tickets.py').write_text(script + '\n')
          PY
          python3 /tmp/fieldwork-84-publication-tickets.py
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Execute focused runtime tests
        run: |
          rustfmt --edition 2024 codex-rs/codex-mcp/src/runtime.rs
          rustfmt --edition 2024 --check codex-rs/codex-mcp/src/runtime.rs
          cd codex-rs
          cargo test -p codex-mcp publication_state_ --locked
          cargo test -p codex-mcp publication_gate_opens_only_for_the_winning_candidate --locked
      - name: Publish source-only head
        run: |
          rm -f .github/workflows/fieldwork-84-mcp-publication-tickets.yml
          rm -f .github/workflows/fieldwork-84-mcp-publication-tickets-v2.yml
          actual=$(git diff --name-only origin/main)
          test "$actual" = "codex-rs/codex-mcp/src/runtime.rs"
          git diff --check
          git add -A
          git commit -m 'mcp: publish only the latest refresh generation'
          git push origin HEAD:fieldwork/84-mcp-publication-tickets
