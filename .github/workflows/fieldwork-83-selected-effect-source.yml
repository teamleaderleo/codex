name: Fieldwork 83 selected effect source

on:
  push:
    branches:
      - fieldwork/83-selected-effect-terminal-closure

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/83-selected-effect-terminal-closure
          fetch-depth: 0
      - name: Configure validation identity
        run: |
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
      - name: Apply reviewed source slice
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          lifecycle = Path('codex-rs/core/src/tools/lifecycle.rs')
          lines = lifecycle.read_text(encoding='utf-8').splitlines()
          if 'use codex_tools::ToolOperationEffect;' in lines:
              lines.remove('use codex_tools::ToolOperationEffect;')
          start = lines.index('pub(crate) async fn notify_tool_start(invocation: &ToolInvocation) {')
          contributor = next(
              i for i in range(start + 1, len(lines))
              if lines[i].strip() == 'for contributor in invocation'
          )
          del lines[start + 1:contributor]
          lifecycle.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          registry = Path('codex-rs/core/src/tools/registry.rs')
          text = registry.read_text(encoding='utf-8')
          import_line = 'use codex_tools::ToolOperationEffect;\n'
          if 'use codex_tools::ToolOperationTerminalState;' not in text:
              if text.count(import_line) != 1:
                  raise SystemExit('terminal import anchor mismatch')
              text = text.replace(
                  import_line,
                  import_line + 'use codex_tools::ToolOperationTerminalState;\n',
                  1,
              )

          old_match = (
              '        let dispatch_trace = ToolDispatchTrace::start(&invocation);\n'
              '        let tool = match self.tool(&tool_name) {\n'
              '            Some(tool) => tool,\n'
              '            None => {\n'
          )
          new_match = (
              '        let dispatch_trace = ToolDispatchTrace::start(&invocation);\n'
              '        let tool = match self.tool(&tool_name) {\n'
              '            Some(tool) => {\n'
              '                invocation\n'
              '                    .session\n'
              '                    .begin_tool_operation_receipt(\n'
              '                        call_id_owned.clone(),\n'
              '                        tool.operation_effect(),\n'
              '                    )\n'
              '                    .await;\n'
              '                tool\n'
              '            }\n'
              '            None => {\n'
              '                invocation\n'
              '                    .session\n'
              '                    .begin_tool_operation_receipt(\n'
              '                        call_id_owned.clone(),\n'
              '                        ToolOperationEffect::PotentialMutation,\n'
              '                    )\n'
              '                    .await;\n'
          )
          if text.count(old_match) != 1:
              raise SystemExit('tool selection anchor mismatch')
          text = text.replace(old_match, new_match, 1)

          match_start = text.index('        let tool = match self.tool(&tool_name) {')
          telemetry_start = text.index('        let telemetry_tags = tool.telemetry_tags(&invocation).await;', match_start)
          segment = text[match_start:telemetry_start]
          old_return = (
              '                let err = FunctionCallError::RespondToModel(message);\n'
              '                dispatch_trace.record_failed(&err);\n'
              '                return Err(err);\n'
          )
          new_return = (
              '                let err = FunctionCallError::RespondToModel(message);\n'
              '                dispatch_trace.record_failed(&err);\n'
              '                record_tool_receipt_terminal_if_unclaimed(\n'
              '                    &invocation,\n'
              '                    terminal_outcome_reached.as_deref(),\n'
              '                    ToolOperationTerminalState::Failed,\n'
              '                )\n'
              '                .await;\n'
              '                return Err(err);\n'
          )
          if segment.count(old_return) != 1:
              raise SystemExit('unsupported terminal anchor mismatch')
          segment = segment.replace(old_return, new_return, 1)
          text = text[:match_start] + segment + text[telemetry_start:]

          incompatible_start = text.index('        if !tool.matches_kind(&invocation.payload) {')
          notify_start = text.index('        notify_tool_start(&invocation).await;', incompatible_start)
          segment = text[incompatible_start:notify_start]
          old_fatal = (
              '            let err = FunctionCallError::Fatal(message);\n'
              '            dispatch_trace.record_failed(&err);\n'
              '            return Err(err);\n'
          )
          new_fatal = (
              '            let err = FunctionCallError::Fatal(message);\n'
              '            dispatch_trace.record_failed(&err);\n'
              '            record_tool_receipt_terminal_if_unclaimed(\n'
              '                &invocation,\n'
              '                terminal_outcome_reached.as_deref(),\n'
              '                ToolOperationTerminalState::Failed,\n'
              '            )\n'
              '            .await;\n'
              '            return Err(err);\n'
          )
          if segment.count(old_fatal) != 1:
              raise SystemExit('incompatible terminal anchor mismatch')
          segment = segment.replace(old_fatal, new_fatal, 1)
          text = text[:incompatible_start] + segment + text[notify_start:]

          helper_marker = 'async fn notify_tool_finish_if_unclaimed(\n'
          helper = dedent('''\
          async fn record_tool_receipt_terminal_if_unclaimed(
              invocation: &ToolInvocation,
              terminal_outcome_reached: Option<&AtomicBool>,
              terminal_state: ToolOperationTerminalState,
          ) -> bool {
              if terminal_outcome_reached.is_some_and(|reached| reached.swap(true, Ordering::AcqRel)) {
                  return false;
              }

              invocation
                  .session
                  .record_tool_operation_terminal(&invocation.call_id, terminal_state)
                  .await;
              true
          }

          ''')
          if 'async fn record_tool_receipt_terminal_if_unclaimed' not in text:
              if text.count(helper_marker) != 1:
                  raise SystemExit('terminal helper anchor mismatch')
              text = text.replace(helper_marker, helper + helper_marker, 1)
          registry.write_text(text, encoding='utf-8')

          tests = Path('codex-rs/core/src/tools/registry_tests.rs')
          text = tests.read_text(encoding='utf-8')
          addition = dedent(r'''

          #[tokio::test]
          async fn receipt_before_dispatch_uses_selected_read_only_effect() -> anyhow::Result<()> {
              let (session, turn) = crate::session::tests::make_session_and_context().await;
              let tool_name = codex_tools::ToolName::plain("read_only_receipt");
              let handler = Arc::new(ReadOnlyTestHandler {
                  tool_name: tool_name.clone(),
              }) as Arc<dyn CoreToolRuntime>;
              let registry = ToolRegistry::new(HashMap::from([(tool_name.clone(), handler)]));
              let session = Arc::new(session);

              registry
                  .dispatch_any_with_terminal_outcome(
                      test_invocation(
                          Arc::clone(&session),
                          Arc::new(turn),
                          "read-only-call",
                          tool_name,
                      ),
                      None,
                  )
                  .await?;

              let receipt = session
                  .tool_operation_receipt("read-only-call")
                  .await
                  .expect("receipt should exist");
              assert_eq!(receipt.effect, codex_tools::ToolOperationEffect::ReadOnly);
              assert_eq!(
                  receipt.terminal_state,
                  codex_tools::ToolOperationTerminalState::Completed
              );
              Ok(())
          }

          #[tokio::test]
          async fn receipt_before_dispatch_closes_unsupported_call() {
              let (session, turn) = crate::session::tests::make_session_and_context().await;
              let registry = ToolRegistry::new(HashMap::new());
              let session = Arc::new(session);
              let terminal = Arc::new(AtomicBool::new(false));

              let err = registry
                  .dispatch_any_with_terminal_outcome(
                      test_invocation(
                          Arc::clone(&session),
                          Arc::new(turn),
                          "unsupported-call",
                          codex_tools::ToolName::plain("missing_tool"),
                      ),
                      Some(Arc::clone(&terminal)),
                  )
                  .await
                  .expect_err("unsupported tool should fail");

              assert!(matches!(err, FunctionCallError::RespondToModel(_)));
              assert!(terminal.load(Ordering::Acquire));
              let receipt = session
                  .tool_operation_receipt("unsupported-call")
                  .await
                  .expect("receipt should exist");
              assert_eq!(
                  receipt.effect,
                  codex_tools::ToolOperationEffect::PotentialMutation
              );
              assert_eq!(
                  receipt.terminal_state,
                  codex_tools::ToolOperationTerminalState::Failed
              );
              assert_eq!(
                  receipt.result_state,
                  codex_tools::ToolOperationResultState::Pending
              );
          }

          #[tokio::test]
          async fn receipt_before_dispatch_closes_incompatible_payload_with_selected_effect() {
              let (session, turn) = crate::session::tests::make_session_and_context().await;
              let tool_name = codex_tools::ToolName::plain("read_only_incompatible");
              let handler = Arc::new(ReadOnlyTestHandler {
                  tool_name: tool_name.clone(),
              }) as Arc<dyn CoreToolRuntime>;
              let registry = ToolRegistry::new(HashMap::from([(tool_name.clone(), handler)]));
              let session = Arc::new(session);
              let terminal = Arc::new(AtomicBool::new(false));
              let mut invocation = test_invocation(
                  Arc::clone(&session),
                  Arc::new(turn),
                  "incompatible-call",
                  tool_name,
              );
              invocation.payload = ToolPayload::Custom {
                  input: "not a function payload".to_string(),
              };

              let err = registry
                  .dispatch_any_with_terminal_outcome(
                      invocation,
                      Some(Arc::clone(&terminal)),
                  )
                  .await
                  .expect_err("incompatible payload should fail");

              assert!(matches!(err, FunctionCallError::Fatal(_)));
              assert!(terminal.load(Ordering::Acquire));
              let receipt = session
                  .tool_operation_receipt("incompatible-call")
                  .await
                  .expect("receipt should exist");
              assert_eq!(receipt.effect, codex_tools::ToolOperationEffect::ReadOnly);
              assert_eq!(
                  receipt.terminal_state,
                  codex_tools::ToolOperationTerminalState::Failed
              );
              assert_eq!(
                  receipt.result_state,
                  codex_tools::ToolOperationResultState::Pending
              );
          }
          ''')
          if 'receipt_before_dispatch_uses_selected_read_only_effect' in text:
              raise SystemExit('selected effect tests already exist')
          tests.write_text(text + addition, encoding='utf-8')

          Path('.github/workflows/fieldwork-83-selected-effect-source.yml').unlink()
          Path('.fieldwork-83-selected-effect-trigger').unlink(missing_ok=True)
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Format and run focused tests
        run: |
          rustfmt --edition 2024 codex-rs/core/src/tools/lifecycle.rs codex-rs/core/src/tools/registry.rs codex-rs/core/src/tools/registry_tests.rs
          rustfmt --edition 2024 --check codex-rs/core/src/tools/lifecycle.rs codex-rs/core/src/tools/registry.rs codex-rs/core/src/tools/registry_tests.rs
          cd codex-rs
          cargo test -p codex-core --lib receipt_before_dispatch --locked
          cargo test -p codex-core --lib dispatch_notifies_tool_lifecycle_contributors --locked
          cargo test -p codex-core --lib tools::lifecycle::tests --locked
      - name: Verify patch hygiene
        run: git diff --check
      - name: Commit validated source
        run: |
          git add -A
          git commit -m 'core: begin tool receipts from selected runtime before dispatch'
          git push origin HEAD:fieldwork/83-selected-effect-terminal-closure
