name: Fieldwork 23 authoritative transcript

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install repository tools
        run: |
          cargo install just --locked
          cargo install dotslash --locked
          pipx install uv

      - name: Apply asserted source edits
        run: python3 .github/fieldwork/fieldwork_23_patch.py

      - name: Format
        working-directory: codex-rs
        run: just fmt

      - name: Test codex-core
        working-directory: codex-rs
        run: just test -p codex-core

      - name: Fix codex-core lints
        working-directory: codex-rs
        run: just fix -p codex-core

      - name: Format fixer output
        working-directory: codex-rs
        run: just fmt

      - name: Review resulting diff
        run: |
          git diff --check
          git diff --stat
          git diff -- codex-rs/core/src/unified_exec

      - name: Commit verified implementation
        run: |
          rm .github/workflows/fieldwork-23-authoritative-transcript.yml
          rm .github/fieldwork/fieldwork_23_patch.py
          git config user.name "teamleaderleo"
          git config user.email "13091533+teamleaderleo@users.noreply.github.com"
          git add codex-rs/core/src/unified_exec \
            .github/workflows/fieldwork-23-authoritative-transcript.yml \
            .github/fieldwork/fieldwork_23_patch.py
          git commit -m "core: make unified exec completion transcripts authoritative"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
