name: fieldwork-terminal-97576-shallow

on:
  pull_request:
    branches:
      - fieldwork/23-terminal-97576-isolated-base
    paths:
      - .github/fieldwork/23-terminal-97576-isolated-trigger

permissions:
  contents: write

concurrency:
  group: fieldwork-terminal-97576-isolated
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  UPSTREAM_HEAD: 97576b1794872e342450ebd577123e052ab57626
  HISTORICAL_SOURCE: 7db66fe3f235df77c36a9db521677e23379bcac5
  SOURCE_BRANCH: fieldwork/23-terminal-97576-source

jobs:
  shallow-restack-and-verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out exact carrier head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Extract reviewed source scripts
        shell: python
        run: |
          from pathlib import Path

          workflow = Path(
              '.github/workflows/fieldwork-terminal-acd540-restack.yml'
          ).read_text(encoding='utf-8').splitlines()
          steps = {
              'Restack historical source and preserve current source work': '/tmp/restack.sh',
              'Verify source fence and format': '/tmp/format.sh',
              'Execute focused codex-core target gate': '/tmp/focused.sh',
              'Publish source-only branch': '/tmp/publish.sh',
          }
          for name, destination in steps.items():
              step = workflow.index(f'      - name: {name}')
              run_line = next(
                  index
                  for index in range(step + 1, len(workflow))
                  if workflow[index].strip() == 'run: |'
              )
              end = next(
                  (
                      index
                      for index in range(run_line + 1, len(workflow))
                      if workflow[index].startswith('      - name: ')
                  ),
                  len(workflow),
              )
              script_lines = []
              for line in workflow[run_line + 1 : end]:
                  if line.startswith('          '):
                      script_lines.append(line[10:])
                  elif line.strip():
                      raise SystemExit(
                          f'unexpected indentation in {name}: {line!r}'
                      )
                  else:
                      script_lines.append('')
              Path(destination).write_text(
                  '\n'.join(script_lines) + '\n',
                  encoding='utf-8',
              )

      - name: Fetch exact source refs only
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin \
            refs/heads/fieldwork/upstream-97576-base:refs/remotes/origin/fieldwork/upstream-97576-base
          git fetch --no-tags --depth=2 origin \
            refs/heads/fieldwork/23-terminal-current-upstream:refs/remotes/origin/fieldwork/23-terminal-current-upstream
          git checkout --detach "$UPSTREAM_HEAD"
          test "$(git rev-parse HEAD)" = "$UPSTREAM_HEAD"
          test "$(git rev-parse origin/fieldwork/23-terminal-current-upstream)" = "$HISTORICAL_SOURCE"
          echo "FIELDWORK_TERMINAL_INPUT_BASE=$UPSTREAM_HEAD"
          echo "FIELDWORK_TERMINAL_INPUT_SOURCE=$HISTORICAL_SOURCE"

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-nextest

      - name: Reconstruct current source
        run: bash /tmp/restack.sh

      - name: Format and verify source fence
        run: bash /tmp/format.sh

      - name: Resolve and run nine exact controls through the repository test entrypoint
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo nextest list -p codex-core --lib --message-format json > /tmp/tests.json
          python3 - <<'PY' > /tmp/resolved-tests
          import json
          from pathlib import Path

          suffixes = (
              'local_output_task_retains_stdout_before_best_effort_broadcast',
              'local_output_task_retains_invalid_utf8_when_broadcast_lags',
              'completed_item_includes_output_emitted_before_subscription',
              'reconcile_transcript_replaces_partial_stream_with_authoritative_output',
              'split_valid_utf8_prefix_respects_max_bytes_for_ascii',
              'split_valid_utf8_prefix_avoids_splitting_utf8_codepoints',
              'split_valid_utf8_prefix_makes_progress_on_invalid_utf8',
              'split_valid_utf8_prefix_consumes_all_valid_bytes_before_invalid_utf8',
              'split_invalid_utf8_advances_without_shifting_remaining_bytes',
          )
          listing = json.loads(Path('/tmp/tests.json').read_text(encoding='utf-8'))
          tests = []
          for suite in listing['rust-suites'].values():
              for name, testcase in suite['testcases'].items():
                  if testcase['filter-match']['status'] == 'matches':
                      tests.append(name)

          resolved = []
          for suffix in suffixes:
              matches = sorted(name for name in tests if name.endswith(suffix))
              print(f'{suffix} matches: {matches}', file=__import__('sys').stderr)
              if len(matches) != 1:
                  raise SystemExit(
                      f'expected exactly one full test name for {suffix}, found {len(matches)}'
                  )
              resolved.append(matches[0])

          if len(set(resolved)) != len(suffixes):
              raise SystemExit('resolved test names are not unique')
          print('\n'.join(resolved))
          PY

          count=0
          while IFS= read -r test_name; do
            printf 'exact test: %s\n' "$test_name"
            just test -p codex-core --lib -E "test(=$test_name)" --no-tests=fail
            count=$((count + 1))
          done < /tmp/resolved-tests
          test "$count" -eq 9
          echo 'FIELDWORK_TERMINAL_97576_EXACT=9/9'

      - name: Run focused codex-core gate
        working-directory: codex-rs
        run: bash /tmp/focused.sh

      - name: Publish source-only exact head
        run: |
          set -euo pipefail
          bash /tmp/publish.sh
          echo "FIELDWORK_TERMINAL_SOURCE_BRANCH=$SOURCE_BRANCH"
