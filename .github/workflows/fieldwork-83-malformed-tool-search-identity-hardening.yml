name: fieldwork-83-malformed-tool-search-identity-hardening

on:
  push:
    branches:
      - fieldwork/83-malformed-tool-search-identity
    paths:
      - codex-rs/core/src/stream_events_utils.rs
      - codex-rs/core/src/stream_events_utils_tests.rs
      - .github/workflows/fieldwork-83-malformed-tool-search-identity-hardening.yml

permissions:
  contents: write

concurrency:
  group: fieldwork-83-malformed-tool-search-identity-hardening
  cancel-in-progress: true

jobs:
  harden-test-publish:
    if: github.actor == 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/83-malformed-tool-search-identity
          fetch-depth: 0
          persist-credentials: true
      - name: Configure validation identity
        run: |
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
      - name: Remove unpairable fallback
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          path = Path('codex-rs/core/src/stream_events_utils.rs')
          text = path.read_text(encoding='utf-8')
          for import_line in [
              'use codex_protocol::models::FunctionCallOutputBody;\n',
              'use codex_protocol::models::FunctionCallOutputPayload;\n',
          ]:
              if text.count(import_line) != 1:
                  raise SystemExit(f'import anchor mismatch: {import_line!r}')
              text = text.replace(import_line, '', 1)

          start = text.index('fn pre_dispatch_tool_failure_response(')
          marker = '\npub(crate) async fn apply_turn_item_contributors('
          end = text.index(marker, start)
          replacement = dedent('''\
          fn pre_dispatch_tool_failure_response(
              item: &ResponseItem,
              message: &str,
          ) -> Option<PreDispatchToolFailure> {
              if let ResponseItem::ToolSearchCall {
                  call_id: Some(call_id),
                  execution,
                  ..
              } = item
                  && execution == "client"
              {
                  warn!(
                      error = %message,
                      "client tool_search request rejected before dispatch"
                  );
                  return Some(PreDispatchToolFailure {
                      response: ResponseInputItem::ToolSearchOutput {
                          call_id: call_id.clone(),
                          status: "failed".to_string(),
                          execution: "client".to_string(),
                          tools: Vec::new(),
                      },
                      receipt_call_id: Some(call_id.clone()),
                  });
              }

              None
          }
          ''')
          text = text[:start] + replacement + text[end:]

          old = dedent('''\
                      let PreDispatchToolFailure {
                          response,
                          receipt_call_id,
                      } = pre_dispatch_tool_failure_response(&item, message);
          ''')
          new = dedent('''\
                      let Some(PreDispatchToolFailure {
                          response,
                          receipt_call_id,
                      }) = pre_dispatch_tool_failure_response(&item, &message)
                      else {
                          return Err(CodexErr::Fatal(format!(
                              "tool request rejected before dispatch without pairable identity: {message}"
                          )));
                      };
          ''')
          if text.count(old) != 1:
              raise SystemExit(f'caller anchor mismatch: found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('.github/workflows/fieldwork-83-malformed-tool-search-identity-hardening.yml').unlink()
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Format and run focused tests
        run: |
          rustfmt --edition 2024 codex-rs/core/src/stream_events_utils.rs codex-rs/core/src/stream_events_utils_tests.rs
          rustfmt --edition 2024 --check codex-rs/core/src/stream_events_utils.rs codex-rs/core/src/stream_events_utils_tests.rs
          cd codex-rs
          cargo test -p codex-core --lib malformed_client_tool_search_preserves_identity_and_receipt --locked
          cargo test -p codex-core --lib compaction_identity --locked
      - name: Verify source-only hygiene
        run: |
          git diff --check
          test ! -e .github/workflows/fieldwork-83-malformed-tool-search-identity.yml
          test ! -e .github/workflows/fieldwork-83-malformed-tool-search-identity-hardening.yml
      - name: Publish hardened source-only head
        run: |
          git add -A
          git commit -m 'core: fail closed on unpairable pre-dispatch tool errors'
          git push origin HEAD:fieldwork/83-malformed-tool-search-identity
