name: Fieldwork 83 integrated session receipts

on:
  pull_request:
    paths:
      - codex-rs/core/src/state/**
      - codex-rs/core/src/session/**
      - codex-rs/core/src/tools/lifecycle.rs
      - .github/workflows/fieldwork-83-session-receipts-integrated.yml

permissions:
  contents: write

jobs:
  replace-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/83-canonical-session-receipts-integrated
          fetch-depth: 0
      - name: Configure validation identity
        run: |
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
      - name: Remove superseded turn owner
        run: |
          if [ -f codex-rs/core/src/state/turn_operation_receipt_tests.rs ]; then
            git revert -m 1 --no-edit 555332c9c4b92fe7426777297428a04dd11e605f
          fi
      - name: Attach session owner and retarget lifecycle
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              if new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f'anchor mismatch in {path}: {old!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_exact(
              Path('codex-rs/core/src/state/session.rs'),
              'use super::AdditionalContextStore;\n',
              'use super::AdditionalContextStore;\nuse super::ToolOperationReceipts;\n',
          )
          replace_exact(
              Path('codex-rs/core/src/state/session.rs'),
              '    pub(crate) history: ContextManager,\n    pub(crate) latest_rate_limits: Option<RateLimitSnapshot>,\n',
              '    pub(crate) history: ContextManager,\n    pub(crate) tool_operation_receipts: ToolOperationReceipts,\n    pub(crate) latest_rate_limits: Option<RateLimitSnapshot>,\n',
          )
          replace_exact(
              Path('codex-rs/core/src/state/session.rs'),
              '            history,\n            latest_rate_limits: None,\n',
              '            history,\n            tool_operation_receipts: ToolOperationReceipts::default(),\n            latest_rate_limits: None,\n',
          )
          replace_exact(
              Path('codex-rs/core/src/session/mod.rs'),
              'mod token_budget;\n',
              'mod token_budget;\nmod tool_operation;\n',
          )

          lifecycle = Path('codex-rs/core/src/tools/lifecycle.rs')
          text = lifecycle.read_text(encoding='utf-8')
          old_start = '''    if let Some(turn_state) = matching_active_turn_state(
              invocation.session.as_ref(),
              invocation.turn.as_ref(),
          )
          .await
          {
              turn_state.lock().await.begin_tool_operation(
                  invocation.call_id.clone(),
                  ToolOperationEffect::PotentialMutation,
              );
          }
          '''
          new_start = '''    invocation
              .session
              .begin_tool_operation_receipt(
                  invocation.call_id.clone(),
                  ToolOperationEffect::PotentialMutation,
              )
              .await;
          '''
          if text.count(old_start) != 1:
              raise SystemExit('lifecycle start anchor mismatch')
          text = text.replace(old_start, new_start, 1)

          old_finish = '''    if let Some(turn_state) = matching_active_turn_state(session, turn).await {
              turn_state
                  .lock()
                  .await
                  .record_tool_operation_terminal(call_id, receipt_terminal_state(outcome));
          }
          '''
          new_finish = '''    session
              .record_tool_operation_terminal(call_id, receipt_terminal_state(outcome))
              .await;
          '''
          if text.count(old_finish) != 1:
              raise SystemExit('lifecycle finish anchor mismatch')
          text = text.replace(old_finish, new_finish, 1)

          old_helper = '''async fn matching_active_turn_state(
              session: &Session,
              turn: &TurnContext,
          ) -> Option<std::sync::Arc<tokio::sync::Mutex<crate::state::TurnState>>> {
              let active_turn = session.active_turn.lock().await;
              active_turn.as_ref().and_then(|active_turn| {
                  let task = active_turn.task.as_ref()?;
                  (task.turn_context.sub_id == turn.sub_id).then(|| active_turn.turn_state.clone())
              })
          }

          '''
          if text.count(old_helper) != 1:
              raise SystemExit('lifecycle helper anchor mismatch')
          lifecycle.write_text(text.replace(old_helper, '', 1), encoding='utf-8')

          Path('.github/workflows/fieldwork-83-session-receipts-integrated.yml').unlink()
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Format and test
        working-directory: codex-rs
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p codex-core --lib tool_operation_receipts --locked
          cargo test -p codex-core --lib tools::lifecycle::tests --locked
      - name: Verify diff hygiene
        run: git diff --check
      - name: Commit validated replacement
        run: |
          git add codex-rs/core/src/state codex-rs/core/src/session codex-rs/core/src/tools/lifecycle.rs .github/workflows/fieldwork-83-session-receipts-integrated.yml
          git commit -m 'core: move live tool receipts to canonical session owner'
          git push origin HEAD:fieldwork/83-canonical-session-receipts-integrated
