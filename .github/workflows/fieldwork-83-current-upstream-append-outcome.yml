name: fieldwork-83-current-upstream-append-outcome

on:
  pull_request:
    branches:
      - fieldwork/upstream-b545-append-outcome-base
    paths:
      - .github/workflows/fieldwork-83-current-upstream-append-outcome.yml

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: true
          fetch-depth: 0
      - run: |
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
      - name: Propagate authoritative append outcome
        run: |
          git fetch origin f7265553ea1510304f3091833dcbce65ef21f10c a0ab863c8d9f90fd9bd284cc6b31049e2579da51
          git diff --binary f7265553ea1510304f3091833dcbce65ef21f10c a0ab863c8d9f90fd9bd284cc6b31049e2579da51 -- codex-rs/thread-store/src/in_memory.rs > /tmp/store.patch
          git apply --3way /tmp/store.patch
          python3 - <<'PY'
          from pathlib import Path

          session = Path('codex-rs/core/src/session/mod.rs')
          text = session.read_text(encoding='utf-8')

          record_old = '''    pub(crate) async fn record_conversation_items(
              &self,
              turn_context: &TurnContext,
              items: &[ResponseItem],
          ) {
              let items = self.prepare_conversation_items_for_history(turn_context, items);
              let items = items.as_ref();
              {
                  let mut state = self.state.lock().await;
                  state.current_time_reminder.note_recorded_items(items);
                  state.record_items(
                      items.iter(),
                      turn_context.model_info.truncation_policy.into(),
                  );
              }
              self.persist_rollout_response_items(items).await;
              self.send_raw_response_items(turn_context, items).await;
          }
          '''.replace('          ', '')
          record_new = '''    pub(crate) async fn record_conversation_items(
              &self,
              turn_context: &TurnContext,
              items: &[ResponseItem],
          ) -> bool {
              let items = self.prepare_conversation_items_for_history(turn_context, items);
              let items = items.as_ref();
              {
                  let mut state = self.state.lock().await;
                  state.current_time_reminder.note_recorded_items(items);
                  state.record_items(
                      items.iter(),
                      turn_context.model_info.truncation_policy.into(),
                  );
              }
              let persisted = self.persist_rollout_response_items(items).await;
              self.send_raw_response_items(turn_context, items).await;
              persisted
          }
          '''.replace('          ', '')
          if text.count(record_old) != 1:
              raise SystemExit('record_conversation_items body changed')
          text = text.replace(record_old, record_new, 1)

          response_old = '''    async fn persist_rollout_response_items(&self, items: &[ResponseItem]) {
              let rollout_items: Vec<RolloutItem> = items
                  .iter()
                  .cloned()
                  .map(RolloutItem::ResponseItem)
                  .collect();
              self.persist_rollout_items(&rollout_items).await;
          }
          '''.replace('          ', '')
          response_new = '''    async fn persist_rollout_response_items(&self, items: &[ResponseItem]) -> bool {
              let rollout_items: Vec<RolloutItem> = items
                  .iter()
                  .cloned()
                  .map(RolloutItem::ResponseItem)
                  .collect();
              self.persist_rollout_items_checked(&rollout_items).await
          }
          '''.replace('          ', '')
          if text.count(response_old) != 1:
              raise SystemExit('persist_rollout_response_items body changed')
          text = text.replace(response_old, response_new, 1)

          persist_old = '''    pub(crate) async fn persist_rollout_items(&self, items: &[RolloutItem]) {
              if let Some(live_thread) = self.live_thread()
                  && let Err(e) = live_thread.append_items(items).await
              {
                  error!("failed to record rollout items: {e:#}");
              }
          }
          '''.replace('          ', '')
          persist_new = '''    pub(crate) async fn persist_rollout_items(&self, items: &[RolloutItem]) {
              let _ = self.persist_rollout_items_checked(items).await;
          }

          async fn persist_rollout_items_checked(&self, items: &[RolloutItem]) -> bool {
              let Some(live_thread) = self.live_thread() else {
                  return true;
              };
              if let Err(e) = live_thread.append_items(items).await {
                  error!("failed to record rollout items: {e:#}");
                  return false;
              }
              true
          }
          '''.replace('          ', '')
          if text.count(persist_old) != 1:
              raise SystemExit('persist_rollout_items body changed')
          session.write_text(text.replace(persist_old, persist_new, 1), encoding='utf-8')

          tests = Path('codex-rs/core/src/session/turn_tests.rs')
          text = tests.read_text(encoding='utf-8')
          import_anchor = 'use codex_protocol::items::AgentMessageContent;\n'
          imports = '''use codex_protocol::models::BaseInstructions;
          use codex_protocol::protocol::RolloutItem;
          use codex_protocol::protocol::SessionSource;
          use codex_protocol::protocol::ThreadMemoryMode;
          use codex_thread_store::CreateThreadParams;
          use codex_thread_store::InMemoryThreadStore;
          use codex_thread_store::LiveThread;
          use codex_thread_store::ThreadPersistenceMetadata;
          use codex_thread_store::ThreadStore;
          use uuid::Uuid;
          '''.replace('          ', '')
          if text.count(import_anchor) != 1:
              raise SystemExit('turn test import anchor changed')
          text = text.replace(import_anchor, import_anchor + imports, 1)

          additions = '''

          fn append_outcome_function_result(call_id: &str) -> ResponseItem {
              ResponseItem::FunctionCallOutput {
                  call_id: call_id.to_string(),
                  output: codex_protocol::models::FunctionCallOutputPayload::from_text(
                      "ok".to_string(),
                  ),
              }
          }

          async fn make_append_outcome_session()
          -> (Session, TurnContext, Arc<InMemoryThreadStore>) {
              let (mut session, turn_context) =
                  crate::session::tests::make_session_and_context().await;
              let store = Arc::new(InMemoryThreadStore::default());
              let thread_store: Arc<dyn ThreadStore> = store.clone();
              let config = session.get_config().await;
              let live_thread = LiveThread::create(
                  Arc::clone(&thread_store),
                  CreateThreadParams {
                      session_id: session.session_id(),
                      thread_id: session.thread_id(),
                      extra_config: None,
                      forked_from_id: None,
                      parent_thread_id: None,
                      source: SessionSource::Exec,
                      thread_source: None,
                      originator: "test_originator".to_string(),
                      base_instructions: BaseInstructions::default(),
                      dynamic_tools: Vec::new(),
                      selected_capability_roots: Vec::new(),
                      multi_agent_version: None,
                      history_mode: Default::default(),
                      history_base: None,
                      subagent_history_start_ordinal: None,
                      initial_window_id: Uuid::now_v7().to_string(),
                      metadata: ThreadPersistenceMetadata {
                          cwd: Some(config.cwd.to_path_buf()),
                          model_provider: config.model_provider_id.clone(),
                          memory_mode: ThreadMemoryMode::Enabled,
                      },
                  },
              )
              .await
              .expect("create in-memory thread persistence");
              session.services.thread_store = thread_store;
              session.services.live_thread = Some(live_thread);
              (session, turn_context, store)
          }

          fn append_outcome_history_contains(items: &[RolloutItem], call_id: &str) -> bool {
              items.iter().any(|item| {
                  matches!(
                      item,
                      RolloutItem::ResponseItem(ResponseItem::FunctionCallOutput {
                          call_id: observed,
                          ..
                      }) if observed == call_id
                  )
              })
          }

          #[tokio::test]
          async fn append_outcome_ephemeral_history_is_authoritative() {
              let (session, turn_context) =
                  crate::session::tests::make_session_and_context().await;
              let item = append_outcome_function_result("ephemeral");
              assert!(
                  session
                      .record_conversation_items(&turn_context, std::slice::from_ref(&item))
                      .await
              );
          }

          #[tokio::test]
          async fn append_outcome_reports_successful_live_append() {
              let (session, turn_context, store) = make_append_outcome_session().await;
              let item = append_outcome_function_result("persisted");
              assert!(
                  session
                      .record_conversation_items(&turn_context, std::slice::from_ref(&item))
                      .await
              );
              assert_eq!(store.calls().await.append_items, 1);
              let history = session
                  .services
                  .live_thread
                  .as_ref()
                  .expect("live thread")
                  .load_history(/*include_archived*/ true)
                  .await
                  .expect("load history");
              assert!(append_outcome_history_contains(&history.items, "persisted"));
          }

          #[tokio::test]
          async fn append_outcome_reports_prewrite_failure() {
              let (session, turn_context, store) = make_append_outcome_session().await;
              store.fail_next_append_for_test("prewrite failure").await;
              let item = append_outcome_function_result("prewrite");
              assert!(
                  !session
                      .record_conversation_items(&turn_context, std::slice::from_ref(&item))
                      .await
              );
              let history = session
                  .services
                  .live_thread
                  .as_ref()
                  .expect("live thread")
                  .load_history(/*include_archived*/ true)
                  .await
                  .expect("load history");
              assert!(!append_outcome_history_contains(&history.items, "prewrite"));
          }

          #[tokio::test]
          async fn append_outcome_reports_commit_then_error_as_failure() {
              let (session, turn_context, store) = make_append_outcome_session().await;
              store
                  .fail_next_append_after_write_for_test("acknowledgement loss")
                  .await;
              let item = append_outcome_function_result("commit-error");
              assert!(
                  !session
                      .record_conversation_items(&turn_context, std::slice::from_ref(&item))
                      .await
              );
              let history = session
                  .services
                  .live_thread
                  .as_ref()
                  .expect("live thread")
                  .load_history(/*include_archived*/ true)
                  .await
                  .expect("load history");
              assert!(append_outcome_history_contains(&history.items, "commit-error"));
          }
          '''.replace('          ', '')
          if 'append_outcome_ephemeral_history_is_authoritative' in text:
              raise SystemExit('append outcome tests already installed')
          tests.write_text(text + additions, encoding='utf-8')
          PY
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Execute focused append outcome controls
        run: |
          cd codex-rs
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          cargo test -p codex-core append_outcome_ --lib --locked
          cargo test -p codex-thread-store in_memory --locked
      - name: Publish source-only current-upstream prerequisite
        run: |
          git diff -- \
            codex-rs/core/src/session/mod.rs \
            codex-rs/core/src/session/turn_tests.rs \
            codex-rs/thread-store/src/in_memory.rs > /tmp/source.patch
          test -s /tmp/source.patch
          git checkout -B publish b545c94041017d000e2c8b2f6272705d21b85dfb
          git apply /tmp/source.patch
          git diff --check
          git add \
            codex-rs/core/src/session/mod.rs \
            codex-rs/core/src/session/turn_tests.rs \
            codex-rs/thread-store/src/in_memory.rs
          git commit -m 'core: propagate rollout append outcomes'
          git push --force origin HEAD:fieldwork/83-append-outcome-current-upstream
