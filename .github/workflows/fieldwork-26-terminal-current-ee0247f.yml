name: fieldwork-26-terminal-current-ee0247f

on:
  pull_request:
    branches:
      - fieldwork/26-terminal-current-base-ee0247f
    paths:
      - .github/workflows/fieldwork-26-terminal-current-ee0247f.yml

permissions:
  contents: read

concurrency:
  group: fieldwork-26-terminal-current-ee0247f-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_MIN_STACK: "33554432"
  SOURCE_BASE: ee0247f95a6fe2b094ba2253d82cae2a2b4c2dff
  SOURCE_HEAD: b2a704c708748462d7893fe82cf8971f00ca751e

jobs:
  validate:
    name: validate-${{ matrix.kind }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: baseline
            sha: ee0247f95a6fe2b094ba2253d82cae2a2b4c2dff
          - kind: source
            sha: b2a704c708748462d7893fe82cf8971f00ca751e
    env:
      CANDIDATE_KIND: ${{ matrix.kind }}
      CANDIDATE_SHA: ${{ matrix.sha }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 2
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-nextest

      - name: Install repository Python runner
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.3"

      - name: Record immutable metadata
        run: |
          set -euo pipefail
          mkdir -p fieldwork-logs
          {
            echo "candidate_kind=$CANDIDATE_KIND"
            echo "candidate_sha=$(git rev-parse HEAD)"
            echo "candidate_parent=$(git rev-parse HEAD^1 2>/dev/null || true)"
            echo "source_base=$SOURCE_BASE"
            echo "source_head=$SOURCE_HEAD"
            echo "runner_os=$(uname -a)"
            rustc --version
            cargo --version
            cargo nextest --version
          } | tee fieldwork-logs/metadata.txt
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Verify source fence and formatting
        if: matrix.kind == 'source'
        run: |
          set -euo pipefail
          status_file=fieldwork-logs/status.env
          set +e
          {
            test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
            test "$(git rev-parse HEAD^1)" = "$SOURCE_BASE"
            actual="$(git diff --name-only "$SOURCE_BASE"...HEAD | sort)"
            expected="$(printf '%s\n' \
              codex-rs/core/src/unified_exec/async_watcher.rs \
              codex-rs/core/src/unified_exec/async_watcher_tests.rs \
              codex-rs/core/src/unified_exec/process.rs \
              codex-rs/core/src/unified_exec/process_tests.rs | sort)"
            printf 'actual source files:\n%s\n' "$actual"
            test "$actual" = "$expected"
            git diff --check "$SOURCE_BASE"...HEAD
            cd codex-rs
            just fmt
            cd ..
            git diff --exit-code
          } 2>&1 | tee fieldwork-logs/source-fence-format.log
          status=${PIPESTATUS[0]}
          set -e
          echo "source_fence_format=$status" >> "$status_file"

      - name: Resolve and run twelve exact controls
        if: matrix.kind == 'source'
        working-directory: codex-rs
        run: |
          set -euo pipefail
          status_file=../fieldwork-logs/status.env
          set +e
          {
            cargo nextest list -p codex-core --lib --message-format json > /tmp/tests.json
            python3 - <<'PY' > /tmp/resolved-tests
          import json
          from pathlib import Path

          suffixes = (
              'local_output_task_retains_stdout_before_best_effort_broadcast',
              'local_output_task_retains_invalid_utf8_when_broadcast_lags',
              'completed_item_includes_output_emitted_before_subscription',
              'reconcile_transcript_replaces_partial_stream_with_authoritative_output',
              'streaming_output_finishes_on_close_without_waiting_for_grace',
              'streaming_output_keeps_grace_as_fallback_without_close',
              'exit_watcher_waits_for_late_network_denial_before_classifying_end',
              'split_valid_utf8_prefix_respects_max_bytes_for_ascii',
              'split_valid_utf8_prefix_avoids_splitting_utf8_codepoints',
              'split_valid_utf8_prefix_makes_progress_on_invalid_utf8',
              'split_valid_utf8_prefix_consumes_all_valid_bytes_before_invalid_utf8',
              'split_invalid_utf8_advances_without_shifting_remaining_bytes',
          )
          listing = json.loads(Path('/tmp/tests.json').read_text(encoding='utf-8'))
          tests = []
          for suite in listing['rust-suites'].values():
              for name, testcase in suite['testcases'].items():
                  if testcase['filter-match']['status'] == 'matches':
                      tests.append(name)

          resolved = []
          for suffix in suffixes:
              matches = sorted(name for name in tests if name.endswith(suffix))
              print(f'{suffix} matches: {matches}', file=__import__('sys').stderr)
              if len(matches) != 1:
                  raise SystemExit(
                      f'expected exactly one full test name for {suffix}, found {len(matches)}'
                  )
              resolved.append(matches[0])

          if len(set(resolved)) != len(suffixes):
              raise SystemExit('resolved test names are not unique')
          print('\n'.join(resolved))
          PY
            count=0
            while IFS= read -r test_name; do
              printf 'exact test: %s\n' "$test_name"
              just test -p codex-core --lib -E "test(=$test_name)" --no-tests=fail
              count=$((count + 1))
            done < /tmp/resolved-tests
            test "$count" -eq 12
            echo 'FIELDWORK_TERMINAL_CURRENT_EXACT=12/12'
          } 2>&1 | tee ../fieldwork-logs/exact-controls.log
          status=${PIPESTATUS[0]}
          set -e
          echo "exact_controls=$status" >> "$status_file"

      - name: Run full codex-core library gate
        working-directory: codex-rs
        run: |
          set -euo pipefail
          status_file=../fieldwork-logs/status.env
          set +e
          just test -p codex-core --lib 2>&1 | tee ../fieldwork-logs/codex-core-nextest.log
          status=${PIPESTATUS[0]}
          set -e
          echo "codex_core_nextest=$status" >> "$status_file"

      - name: Compile codex-core integration targets
        working-directory: codex-rs
        run: |
          set -euo pipefail
          status_file=../fieldwork-logs/status.env
          set +e
          cargo test -p codex-core --tests --no-run 2>&1 | tee ../fieldwork-logs/codex-core-integration-compile.log
          status=${PIPESTATUS[0]}
          set -e
          echo "codex_core_integration_compile=$status" >> "$status_file"

      - name: Upload complete execution record
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: fieldwork-26-${{ matrix.kind }}-${{ github.run_id }}
          path: fieldwork-logs
          if-no-files-found: error
          retention-days: 30

      - name: Enforce recorded statuses
        if: always()
        run: |
          set -euo pipefail
          cat fieldwork-logs/status.env
          if grep -Ev '^[a-z_]+=0$' fieldwork-logs/status.env; then
            echo 'one or more recorded checks failed' >&2
            exit 1
          fi
          echo "FIELDWORK_TERMINAL_CURRENT_${CANDIDATE_KIND^^}=PASS"
