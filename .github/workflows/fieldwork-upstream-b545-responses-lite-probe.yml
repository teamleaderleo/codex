name: fieldwork-upstream-b545-responses-lite-probe

# Head-only trigger marker: current-upstream stack classification pass 4.
on:
  pull_request:
    branches:
      - fieldwork/upstream-b545-probe-base
    paths:
      - .github/workflows/fieldwork-upstream-b545-responses-lite-probe.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Apply source-and-test intent from the owned diagnostic branch
        run: |
          git fetch origin d1045ae0001444549a4905715e7962e14c2ae163
          mkdir -p .github/fieldwork
          git show d1045ae0001444549a4905715e7962e14c2ae163:.github/fieldwork/85_apply_lite_prewarm_full_first_turn.py > .github/fieldwork/85_apply_lite_prewarm_full_first_turn.py
          python3 .github/fieldwork/85_apply_lite_prewarm_full_first_turn.py
          rm .github/fieldwork/85_apply_lite_prewarm_full_first_turn.py
          git diff --check
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Format temporary candidate
        working-directory: codex-rs
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
      - name: Run generated-response reuse control
        working-directory: codex-rs
        run: cargo test -p codex-core --test all responses_lite_reuses_generated_response_after_full_first_turn --locked -- --nocapture
      - name: Classify default versus enlarged worker stack
        working-directory: codex-rs
        run: |
          set +e
          cargo test -p codex-core --test all websocket_first_responses_lite_turn_sends_full_manifest_after_startup_prewarm --locked -- --nocapture
          default_status=$?
          RUST_MIN_STACK=16777216 cargo test -p codex-core --test all websocket_first_responses_lite_turn_sends_full_manifest_after_startup_prewarm --locked -- --nocapture
          large_status=$?
          set -e
          echo "FIELDWORK_RESPONSES_LITE=default:${default_status};large:${large_status}"
          test "$default_status" -ne 0
          test "$large_status" -eq 0
      - name: Instrument current-upstream new-turn entry
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('codex-rs/core/src/session/turn_context.rs')
          text = path.read_text(encoding='utf-8')
          start = text.index('    pub(crate) async fn new_turn_with_sub_id(')
          end = text.index('\n    pub(crate) async fn new_default_turn(', start)
          segment = text[start:end]
          opening = '    ) -> CodexResult<Arc<TurnContext>> {\n'
          if segment.count(opening) != 1:
              raise SystemExit('new-turn opening changed')
          segment = segment.replace(
              opening,
              opening + '        eprintln!("FIELDWORK_CURRENT_NEW_TURN=entered");\n',
              1,
          )
          lock = '            let mut state = self.state.lock().await;\n'
          if segment.count(lock) != 1:
              raise SystemExit('new-turn state lock changed')
          segment = segment.replace(
              lock,
              '            eprintln!("FIELDWORK_CURRENT_NEW_TURN=before_state_lock");\n'
              + lock
              + '            eprintln!("FIELDWORK_CURRENT_NEW_TURN=after_state_lock");\n',
              1,
          )
          path.write_text(text[:start] + segment + text[end:], encoding='utf-8')
          PY
          cd codex-rs
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Run current-upstream marker regression
        working-directory: codex-rs
        run: |
          set +e
          cargo test -p codex-core --test all websocket_first_responses_lite_turn_sends_full_manifest_after_startup_prewarm --locked -- --nocapture
          status=$?
          set -e
          echo "FIELDWORK_CURRENT_NEW_TURN_STATUS=${status}"
          test "$status" -ne 0
