name: Fieldwork 83 focused receipt tests

on:
  push:
    branches:
      - fieldwork/83-compaction-mutation-identity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipt-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Show pinned Rust toolchain
        run: rustc --version && cargo --version
      - name: Run codex-tools tests
        run: cargo test -p codex-tools --locked
