name: fieldwork-83-direct-append-review-fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fieldwork-83-direct-append-review-fix.yml

permissions:
  contents: write

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/83-direct-append-clean
          fetch-depth: 0
          persist-credentials: true
      - run: |
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
      - name: Add live-history assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('codex-rs/core/src/session/turn_tests.rs')
          text = path.read_text()
          first = '''    assert!(has_persisted_function_result(
              &persisted.items,
              "call-after-failure",
          ));
          }
          '''.replace('          ', '')
          first_new = '''    assert!(has_persisted_function_result(
              &persisted.items,
              "call-after-failure",
          ));
              let in_memory = session.clone_history().await;
              assert!(has_in_memory_function_result(
                  in_memory.raw_items(),
                  "call-first-failure",
              ));
              assert!(has_in_memory_function_result(
                  in_memory.raw_items(),
                  "call-after-failure",
              ));
          }
          '''.replace('          ', '')
          second = '''    assert!(has_persisted_function_result(
              &persisted.items,
              "call-after-commit-error",
          ));
          }
          '''.replace('          ', '')
          second_new = '''    assert!(has_persisted_function_result(
              &persisted.items,
              "call-after-commit-error",
          ));
              let in_memory = session.clone_history().await;
              assert!(has_in_memory_function_result(
                  in_memory.raw_items(),
                  "call-commit-error",
              ));
              assert!(has_in_memory_function_result(
                  in_memory.raw_items(),
                  "call-after-commit-error",
              ));
          }
          '''.replace('          ', '')
          if text.count(first) != 1 or text.count(second) != 1:
              raise SystemExit('review assertion anchors changed')
          path.write_text(text.replace(first, first_new, 1).replace(second, second_new, 1))
          PY
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Execute focused review gate
        run: |
          rustfmt --edition 2024 codex-rs/core/src/session/turn_tests.rs
          rustfmt --edition 2024 --check codex-rs/core/src/session/turn_tests.rs
          cd codex-rs
          cargo test -p codex-core --lib direct_tool_result_persistence_ --locked
      - name: Publish source-only review head
        run: |
          rm -f .github/workflows/fieldwork-83-direct-append-review-fix.yml
          expected=$(printf '%s\n' \
            codex-rs/core/src/session/turn.rs \
            codex-rs/core/src/session/turn_tests.rs \
            codex-rs/thread-store/src/in_memory.rs)
          actual=$(git diff --name-only origin/main | sort)
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"
          git diff --check
          git add -A
          git commit -m 'test: retain direct results across append uncertainty'
          git push origin HEAD:fieldwork/83-direct-append-clean
