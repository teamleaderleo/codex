name: fieldwork-85-box-new-turn-current-upstream

# Head-only trigger marker: boxed new-turn pass 1.
on:
  pull_request:
    branches:
      - fieldwork/upstream-b545-box-new-turn-base
    paths:
      - .github/workflows/fieldwork-85-box-new-turn-current-upstream.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Apply Responses Lite source and tests
        run: |
          git fetch origin d1045ae0001444549a4905715e7962e14c2ae163
          mkdir -p .github/fieldwork
          git show d1045ae0001444549a4905715e7962e14c2ae163:.github/fieldwork/85_apply_lite_prewarm_full_first_turn.py > .github/fieldwork/85_apply_lite_prewarm_full_first_turn.py
          python3 .github/fieldwork/85_apply_lite_prewarm_full_first_turn.py
          rm .github/fieldwork/85_apply_lite_prewarm_full_first_turn.py
      - name: Box the new-turn future at the handler boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('codex-rs/core/src/session/handlers.rs')
          text = path.read_text(encoding='utf-8')
          old = '    let Ok(current_context) = sess.new_turn_with_sub_id(sub_id.clone(), updates).await else {\n'
          new = '''    let Ok(current_context) =
              Box::pin(sess.new_turn_with_sub_id(sub_id.clone(), updates)).await
          else {
          '''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit('new-turn handler call changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Format diagnostic tree
        working-directory: codex-rs
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
      - name: Classify boxed default versus enlarged stack
        working-directory: codex-rs
        run: |
          set +e
          cargo test -p codex-core --test all websocket_first_responses_lite_turn_sends_full_manifest_after_startup_prewarm --locked -- --nocapture
          default_status=$?
          RUST_MIN_STACK=16777216 cargo test -p codex-core --test all websocket_first_responses_lite_turn_sends_full_manifest_after_startup_prewarm --locked -- --nocapture
          large_status=$?
          set -e
          echo "FIELDWORK_BOXED_NEW_TURN=default:${default_status};large:${large_status}"
          test "$large_status" -eq 0
