name: Fieldwork 23 transcript priority

on:
  pull_request:
    branches:
      - fieldwork/23-pinned-base

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Restore authoritative transcript priority
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/core/src/unified_exec/async_watcher.rs")
          text = path.read_text()
          old = '''    if !fallback.is_empty() {
              return fallback;
          }

          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected one fallback-priority block, found {text.count(old)}")
          path.write_text(text.replace(old, ""))
          PY

      - name: Format Rust
        working-directory: codex-rs
        run: cargo fmt --all -- --config imports_granularity=Item,group_imports=StdExternalCrate

      - name: Review and commit
        run: |
          git diff --check
          git diff -- codex-rs/core/src/unified_exec/async_watcher.rs
          rm .github/workflows/fieldwork-23-transcript-priority.yml
          git config user.name "teamleaderleo"
          git config user.email "13091533+teamleaderleo@users.noreply.github.com"
          git add codex-rs/core/src/unified_exec/async_watcher.rs \
            .github/workflows/fieldwork-23-transcript-priority.yml
          git commit -m "core: prefer reconciled unified exec transcript"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
