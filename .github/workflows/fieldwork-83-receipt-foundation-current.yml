name: fieldwork-83-receipt-foundation-current

on:
  pull_request:
    branches:
      - fieldwork/upstream-97576b-source-base
    paths:
      - .github/workflows/fieldwork-83-receipt-foundation-current.yml

permissions:
  contents: write

concurrency:
  group: fieldwork-83-receipt-foundation-current
  cancel-in-progress: true

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure validation identity
        run: |
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
          echo "FIELDWORK_RECEIPT_CARRIER_HEAD=$(git rev-parse HEAD)"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply merged receipt foundation to exact current upstream
        env:
          CURRENT_BASE: 97576b1794872e342450ebd577123e052ab57626
          FOUNDATION_BASE: 2b7b93081361b77f8ddaceaf362a09765b4153bf
          FOUNDATION_HEAD: 73ae22f90300d632833f9e4a531c4dd857c5db36
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$CURRENT_BASE")" = "$CURRENT_BASE"
          git diff --binary "$FOUNDATION_BASE" "$FOUNDATION_HEAD" -- . ':(exclude).github/**' \
            > /tmp/fieldwork-83-receipt-foundation.patch
          test -s /tmp/fieldwork-83-receipt-foundation.patch
          git switch --detach "$CURRENT_BASE"
          git apply --3way --index /tmp/fieldwork-83-receipt-foundation.patch
          git diff --cached --check

      - name: Format-check and run exact receipt foundation controls
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p codex-tools --lib --locked -- --list > /tmp/codex-tools-tests.list
          cargo test -p codex-core --lib --locked -- --list > /tmp/codex-core-tests.list

          declare -A seen=()
          total=0

          run_group() {
            local package="$1"
            local list_file="$2"
            local token="$3"
            local marker="$4"
            mapfile -t matches < <(sed -n 's/: test$//p' "$list_file" | grep "$token" | sort -u)
            printf '%s matches (%s):\n' "$token" "${#matches[@]}"
            printf '  %s\n' "${matches[@]:-<none>}"
            test "${#matches[@]}" -gt 0
            local group_count=0
            for full_name in "${matches[@]}"; do
              test -z "${seen[$package:$full_name]:-}"
              seen[$package:$full_name]=1
              cargo test -p "$package" --lib --locked "$full_name" -- --exact --nocapture
              group_count=$((group_count + 1))
              total=$((total + 1))
            done
            echo "${marker}=${group_count}"
          }

          run_group codex-tools /tmp/codex-tools-tests.list tool_operation FIELDWORK_RECEIPT_TOOL_OPERATION_EXACT
          run_group codex-core /tmp/codex-core-tests.list compaction_identity FIELDWORK_RECEIPT_COMPACTION_IDENTITY_EXACT
          run_group codex-core /tmp/codex-core-tests.list tool_operation_receipts FIELDWORK_RECEIPT_STATE_EXACT
          run_group codex-core /tmp/codex-core-tests.list receipt_before_dispatch FIELDWORK_RECEIPT_DISPATCH_EXACT
          run_group codex-core /tmp/codex-core-tests.list direct_tool_result_persistence_ FIELDWORK_RECEIPT_PERSISTENCE_EXACT

          test "$total" -gt 0
          echo "FIELDWORK_RECEIPT_FOUNDATION_EXACT_TOTAL=$total"

      - name: Preserve reviewed source fence
        run: |
          set -euo pipefail
          git add codex-rs/core codex-rs/tools
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            codex-rs/core/src/context_manager/compaction_identity.rs \
            codex-rs/core/src/context_manager/compaction_identity_tests.rs \
            codex-rs/core/src/context_manager/mod.rs \
            codex-rs/core/src/session/mod.rs \
            codex-rs/core/src/session/tool_operation.rs \
            codex-rs/core/src/session/turn.rs \
            codex-rs/core/src/session/turn_tests.rs \
            codex-rs/core/src/state/mod.rs \
            codex-rs/core/src/state/session.rs \
            codex-rs/core/src/state/tool_operation_receipts.rs \
            codex-rs/core/src/state/tool_operation_receipts_tests.rs \
            codex-rs/core/src/tools/lifecycle.rs \
            codex-rs/core/src/tools/registry.rs \
            codex-rs/core/src/tools/registry_tests.rs \
            codex-rs/tools/src/lib.rs \
            codex-rs/tools/src/tool_executor.rs \
            codex-rs/tools/src/tool_executor_tests.rs \
            codex-rs/tools/src/tool_operation.rs \
            codex-rs/tools/src/tool_operation_tests.rs | sort)"
          test "$actual" = "$expected"
          git diff --cached --check

      - name: Publish clean source-only branch
        env:
          SOURCE_BRANCH: fieldwork/83-receipt-foundation-upstream-97576b
        run: |
          set -euo pipefail
          git switch -C "$SOURCE_BRANCH"
          git commit -m 'core: restore mutation receipt foundation'
          git push --force origin "HEAD:refs/heads/$SOURCE_BRANCH"
          echo "FIELDWORK_SOURCE_HEAD=$(git rev-parse HEAD)"
          echo "FIELDWORK_SOURCE_BASE=97576b1794872e342450ebd577123e052ab57626"
