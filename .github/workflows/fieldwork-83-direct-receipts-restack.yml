name: Fieldwork 83 direct receipt restack

on:
  push:
    branches:
      - fieldwork/83-direct-receipts-clean

permissions:
  contents: write

jobs:
  copy-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out clean branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/83-direct-receipts-clean
          fetch-depth: 0
      - name: Copy reviewed source slice
        run: |
          git fetch origin fieldwork/83-dispatch-receipt-wiring
          git checkout origin/fieldwork/83-dispatch-receipt-wiring -- \
            codex-rs/core/src/session/mod.rs \
            codex-rs/core/src/session/tool_operation.rs \
            codex-rs/core/src/session/turn.rs \
            codex-rs/core/src/state/mod.rs \
            codex-rs/core/src/state/session.rs \
            codex-rs/core/src/state/tool_operation.rs \
            codex-rs/core/src/state/tool_operation_tests.rs \
            codex-rs/core/src/tools/lifecycle.rs \
            codex-rs/core/src/tools/registry.rs \
            codex-rs/core/src/tools/registry_tests.rs
          rm .github/workflows/fieldwork-83-direct-receipts-restack.yml
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Format and test
        working-directory: codex-rs
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p codex-core tool_operation --locked
          cargo test -p codex-core operation_effect --locked
      - name: Verify patch hygiene
        run: git diff --check
      - name: Commit validated source
        run: |
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
          git add codex-rs/core/src .github/workflows/fieldwork-83-direct-receipts-restack.yml
          git commit -m 'core: retain bounded direct tool operation receipts'
          git push origin HEAD:fieldwork/83-direct-receipts-clean
