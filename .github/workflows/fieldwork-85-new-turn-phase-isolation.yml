name: fieldwork-85-new-turn-phase-isolation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fieldwork-85-new-turn-phase-isolation.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  new-turn-markers:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Apply Responses Lite candidate
        run: python3 .github/fieldwork/85_apply_lite_prewarm_full_first_turn.py
      - name: Instrument new-turn boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('codex-rs/core/src/session/turn_context.rs')
          text = path.read_text(encoding='utf-8')
          start = text.index('    pub(crate) async fn new_turn_with_sub_id(')
          end = text.index('\n    }\n', start) + len('\n    }')
          segment = text[start:end]
          replacements = [
              (
                  '        let notify_config_contributors = !self.services.extensions.config_contributors().is_empty();\n',
                  '        eprintln!("FIELDWORK_NEW_TURN=entered");\n'
                  '        let notify_config_contributors = !self.services.extensions.config_contributors().is_empty();\n'
                  '        eprintln!("FIELDWORK_NEW_TURN=before_state_lock");\n',
              ),
              (
                  '            let mut state = self.state.lock().await;\n',
                  '            let mut state = self.state.lock().await;\n'
                  '            eprintln!("FIELDWORK_NEW_TURN=after_state_lock");\n'
                  '            eprintln!("FIELDWORK_NEW_TURN=before_apply_updates");\n',
              ),
              (
                  '            match state.session_configuration.clone().apply(&updates) {\n',
                  '            let apply_result = state.session_configuration.clone().apply(&updates);\n'
                  '            eprintln!("FIELDWORK_NEW_TURN=after_apply_updates");\n'
                  '            match apply_result {\n',
              ),
              (
                  '        self.emit_config_changed_contributors(previous_config.as_ref(), new_config.as_ref());\n',
                  '        eprintln!("FIELDWORK_NEW_TURN=after_update_block");\n'
                  '        eprintln!("FIELDWORK_NEW_TURN=before_config_contributors");\n'
                  '        self.emit_config_changed_contributors(previous_config.as_ref(), new_config.as_ref());\n'
                  '        eprintln!("FIELDWORK_NEW_TURN=after_config_contributors");\n',
              ),
              (
                  '        Ok(self\n            .new_turn_from_configuration(\n',
                  '        eprintln!("FIELDWORK_NEW_TURN=before_new_turn_from_configuration");\n'
                  '        let turn = self\n'
                  '            .new_turn_from_configuration(\n',
              ),
              (
                  '            )\n            .await)\n',
                  '            )\n'
                  '            .await;\n'
                  '        eprintln!("FIELDWORK_NEW_TURN=after_new_turn_from_configuration");\n'
                  '        Ok(turn)\n',
              ),
          ]
          for old, new in replacements:
              if segment.count(old) != 1:
                  raise SystemExit(f'new-turn anchor changed: {old!r}')
              segment = segment.replace(old, new, 1)
          path.write_text(text[:start] + segment + text[end:], encoding='utf-8')
          PY
      - name: Format diagnostic source
        working-directory: codex-rs
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
      - name: Run full regression with new-turn markers
        working-directory: codex-rs
        run: cargo test -p codex-core --test all websocket_first_responses_lite_turn_sends_full_manifest_after_startup_prewarm --locked -- --nocapture
