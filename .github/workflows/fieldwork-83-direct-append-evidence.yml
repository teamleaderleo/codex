name: fieldwork-83-direct-append-evidence

on:
  push:
    branches:
      - fieldwork/83-direct-append-evidence
    paths:
      - .fieldwork-83-direct-append-evidence

permissions:
  contents: write

concurrency:
  group: fieldwork-83-direct-append-evidence
  cancel-in-progress: false

jobs:
  test-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/83-direct-append-evidence
          fetch-depth: 0
          persist-credentials: true
      - name: Configure validation identity
        run: |
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
      - name: Apply direct append evidence slice
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {text.count(old)}')
              target.write_text(text.replace(old, new, 1))

          replace_once(
              'codex-rs/thread-store/src/in_memory.rs',
              '''struct InMemoryThreadStoreState {
              calls: InMemoryThreadStoreCalls,
              created_threads: HashMap<ThreadId, CreateThreadParams>,'''.replace('              ', '    '),
              '''struct InMemoryThreadStoreState {
              calls: InMemoryThreadStoreCalls,
              fail_next_append: Option<String>,
              created_threads: HashMap<ThreadId, CreateThreadParams>,'''.replace('              ', '    '),
          )

          replace_once(
              'codex-rs/thread-store/src/in_memory.rs',
              '''    pub async fn calls(&self) -> InMemoryThreadStoreCalls {
                  self.state.lock().await.calls.clone()
              }

              async fn create_thread(&self, params: CreateThreadParams) -> ThreadStoreResult<()> {'''.replace('              ', ''),
              '''    pub async fn calls(&self) -> InMemoryThreadStoreCalls {
                  self.state.lock().await.calls.clone()
              }

              /// Causes the next non-empty persisted append to fail once.
              ///
              /// This store exists for tests and debug configurations; the hook lets callers
              /// exercise production persistence error handling without replacing `LiveThread`.
              #[doc(hidden)]
              pub async fn fail_next_append_for_test(&self, message: impl Into<String>) {
                  self.state.lock().await.fail_next_append = Some(message.into());
              }

              async fn create_thread(&self, params: CreateThreadParams) -> ThreadStoreResult<()> {'''.replace('              ', ''),
          )

          replace_once(
              'codex-rs/thread-store/src/in_memory.rs',
              '''    async fn append_items(&self, params: AppendThreadItemsParams) -> ThreadStoreResult<()> {
                  if params.items.is_empty() {
                      return Ok(());
                  }
                  let mut state = self.state.lock().await;
                  let history_mode = history_mode_from_state(&state, params.thread_id);
                  let persisted_items = persisted_rollout_items(params.items.as_slice(), history_mode);
                  if persisted_items.is_empty() {
                      return Ok(());
                  }
                  state.calls.append_items += 1;
                  state
                      .histories
                      .entry(params.thread_id)
                      .or_default()
                      .extend(persisted_items);
                  Ok(())
              }'''.replace('              ', ''),
              '''    async fn append_items(&self, params: AppendThreadItemsParams) -> ThreadStoreResult<()> {
                  if params.items.is_empty() {
                      return Ok(());
                  }
                  let mut state = self.state.lock().await;
                  let history_mode = history_mode_from_state(&state, params.thread_id);
                  let persisted_items = persisted_rollout_items(params.items.as_slice(), history_mode);
                  if persisted_items.is_empty() {
                      return Ok(());
                  }
                  state.calls.append_items += 1;
                  if let Some(message) = state.fail_next_append.take() {
                      return Err(ThreadStoreError::Internal { message });
                  }
                  state
                      .histories
                      .entry(params.thread_id)
                      .or_default()
                      .extend(persisted_items);
                  Ok(())
              }'''.replace('              ', ''),
          )

          replace_once(
              'codex-rs/core/src/session/turn.rs',
              '''            Ok(response_input) => {
                              let call_id = response_input_tool_call_id(&response_input).map(str::to_string);
                              let response_item = response_input.into();
                              let result_persisted = sess
                                  .record_conversation_items(&turn_context, std::slice::from_ref(&response_item))
                                  .await;
                              record_direct_tool_result_persistence(
                                  sess.as_ref(),
                                  call_id.as_deref(),
                                  result_persisted,
                              )
                              .await;
                              mark_thread_memory_mode_polluted_if_external_context(
                                  sess.as_ref(),
                                  turn_context.as_ref(),
                                  &response_item,
                              )
                              .await;
                          }'''.replace('                          ', ''),
              '''            Ok(response_input) => {
                              record_direct_tool_result(
                                  sess.as_ref(),
                                  turn_context.as_ref(),
                                  response_input,
                              )
                              .await;
                          }'''.replace('                          ', ''),
          )

          replace_once(
              'codex-rs/core/src/session/turn.rs',
              '''fn response_input_tool_call_id(item: &ResponseInputItem) -> Option<&str> {''',
              '''async fn record_direct_tool_result(
                  sess: &Session,
                  turn_context: &TurnContext,
                  response_input: ResponseInputItem,
              ) {
                  let call_id = response_input_tool_call_id(&response_input).map(str::to_string);
                  let response_item = response_input.into();
                  let result_persisted = sess
                      .record_conversation_items(turn_context, std::slice::from_ref(&response_item))
                      .await;
                  record_direct_tool_result_persistence(
                      sess,
                      call_id.as_deref(),
                      result_persisted,
                  )
                  .await;
                  mark_thread_memory_mode_polluted_if_external_context(
                      sess,
                      turn_context,
                      &response_item,
                  )
                  .await;
              }

              fn response_input_tool_call_id(item: &ResponseInputItem) -> Option<&str> {'''.replace('              ', ''),
          )

          replace_once(
              'codex-rs/core/src/session/turn_tests.rs',
              '''use codex_protocol::ResponseItemId;
              use codex_protocol::items::AgentMessageContent;'''.replace('              ', ''),
              '''use codex_protocol::ResponseItemId;
              use codex_protocol::items::AgentMessageContent;
              use codex_protocol::models::BaseInstructions;
              use codex_protocol::protocol::RolloutItem;
              use codex_protocol::protocol::SessionSource;
              use codex_protocol::protocol::ThreadMemoryMode;
              use codex_thread_store::CreateThreadParams;
              use codex_thread_store::InMemoryThreadStore;
              use codex_thread_store::LiveThread;
              use codex_thread_store::ThreadPersistenceMetadata;
              use codex_thread_store::ThreadStore;'''.replace('              ', ''),
          )

          replace_once(
              'codex-rs/core/src/session/turn_tests.rs',
              '''use std::sync::Arc;
              use tracing_subscriber::prelude::*;'''.replace('              ', ''),
              '''use std::sync::Arc;
              use tracing_subscriber::prelude::*;
              use uuid::Uuid;'''.replace('              ', ''),
          )

          replace_once(
              'codex-rs/core/src/session/turn_tests.rs',
              '''fn direct_function_result(call_id: &str) -> ResponseInputItem {
                  ResponseInputItem::FunctionCallOutput {
                      call_id: call_id.to_string(),
                      output: codex_protocol::models::FunctionCallOutputPayload::from_text("ok".to_string()),
                  }
              }

              #[tokio::test]'''.replace('              ', ''),
              '''fn direct_function_result(call_id: &str) -> ResponseInputItem {
                  ResponseInputItem::FunctionCallOutput {
                      call_id: call_id.to_string(),
                      output: codex_protocol::models::FunctionCallOutputPayload::from_text("ok".to_string()),
                  }
              }

              async fn make_session_with_in_memory_persistence(
              ) -> (Session, TurnContext, Arc<InMemoryThreadStore>) {
                  let (mut session, turn_context) =
                      crate::session::tests::make_session_and_context().await;
                  let store = Arc::new(InMemoryThreadStore::default());
                  let thread_store: Arc<dyn ThreadStore> = store.clone();
                  let config = session.get_config().await;
                  let live_thread = LiveThread::create(
                      Arc::clone(&thread_store),
                      CreateThreadParams {
                          session_id: session.session_id(),
                          thread_id: session.thread_id(),
                          extra_config: None,
                          forked_from_id: None,
                          parent_thread_id: None,
                          source: SessionSource::Exec,
                          thread_source: None,
                          originator: "test_originator".to_string(),
                          base_instructions: BaseInstructions::default(),
                          dynamic_tools: Vec::new(),
                          selected_capability_roots: Vec::new(),
                          multi_agent_version: None,
                          history_mode: Default::default(),
                          history_base: None,
                          subagent_history_start_ordinal: None,
                          initial_window_id: Uuid::now_v7().to_string(),
                          metadata: ThreadPersistenceMetadata {
                              cwd: Some(config.cwd.to_path_buf()),
                              model_provider: config.model_provider_id.clone(),
                              memory_mode: ThreadMemoryMode::Enabled,
                          },
                      },
                  )
                  .await
                  .expect("create in-memory thread persistence");
                  session.services.thread_store = thread_store;
                  session.services.live_thread = Some(live_thread);
                  (session, turn_context, store)
              }

              fn has_persisted_function_result(items: &[RolloutItem], call_id: &str) -> bool {
                  items.iter().any(|item| {
                      matches!(
                          item,
                          RolloutItem::ResponseItem(ResponseItem::FunctionCallOutput {
                              call_id: persisted_call_id,
                              ..
                          }) if persisted_call_id == call_id
                      )
                  })
              }

              fn has_in_memory_function_result(items: &[ResponseItem], call_id: &str) -> bool {
                  items.iter().any(|item| {
                      matches!(
                          item,
                          ResponseItem::FunctionCallOutput {
                              call_id: observed_call_id,
                              ..
                          } if observed_call_id == call_id
                      )
                  })
              }

              #[tokio::test]'''.replace('              ', ''),
          )

          replace_once(
              'codex-rs/core/src/session/turn_tests.rs',
              '''#[tokio::test]
              async fn direct_tool_result_persistence_marks_success_after_authoritative_append() {
                  let (session, _) = crate::session::tests::make_session_and_context().await;
                  session
                      .begin_tool_operation_receipt(
                          "call-success".to_string(),
                          ToolOperationEffect::PotentialMutation,
                      )
                      .await;
                  session
                      .record_tool_operation_terminal("call-success", ToolOperationTerminalState::Completed)
                      .await;
                  let result = direct_function_result("call-success");

                  record_direct_tool_result_persistence(&session, response_input_tool_call_id(&result), true)
                      .await;

                  let receipt = session
                      .tool_operation_receipt("call-success")
                      .await
                      .expect("receipt should exist");
                  assert_eq!(receipt.result_state, ToolOperationResultState::Persisted);
                  assert!(!session.has_unreconciled_potential_mutation().await);
              }'''.replace('              ', ''),
              '''#[tokio::test]
              async fn direct_tool_result_persistence_treats_ephemeral_history_as_authoritative() {
                  let (session, turn_context) =
                      crate::session::tests::make_session_and_context().await;
                  session
                      .begin_tool_operation_receipt(
                          "call-ephemeral".to_string(),
                          ToolOperationEffect::PotentialMutation,
                      )
                      .await;
                  session
                      .record_tool_operation_terminal(
                          "call-ephemeral",
                          ToolOperationTerminalState::Completed,
                      )
                      .await;

                  record_direct_tool_result(
                      &session,
                      &turn_context,
                      direct_function_result("call-ephemeral"),
                  )
                  .await;

                  let receipt = session
                      .tool_operation_receipt("call-ephemeral")
                      .await
                      .expect("receipt should exist");
                  assert_eq!(receipt.result_state, ToolOperationResultState::Persisted);
                  assert!(!session.has_unreconciled_potential_mutation().await);
                  assert!(has_in_memory_function_result(
                      session.clone_history().await.raw_items(),
                      "call-ephemeral",
                  ));
              }

              #[tokio::test]
              async fn direct_tool_result_persistence_uses_successful_authoritative_append() {
                  let (session, turn_context, store) =
                      make_session_with_in_memory_persistence().await;
                  session
                      .begin_tool_operation_receipt(
                          "call-success".to_string(),
                          ToolOperationEffect::PotentialMutation,
                      )
                      .await;
                  session
                      .record_tool_operation_terminal(
                          "call-success",
                          ToolOperationTerminalState::Completed,
                      )
                      .await;

                  record_direct_tool_result(
                      &session,
                      &turn_context,
                      direct_function_result("call-success"),
                  )
                  .await;

                  let receipt = session
                      .tool_operation_receipt("call-success")
                      .await
                      .expect("receipt should exist");
                  assert_eq!(receipt.result_state, ToolOperationResultState::Persisted);
                  assert!(!session.has_unreconciled_potential_mutation().await);
                  assert_eq!(store.calls().await.append_items, 1);
                  let persisted = session
                      .services
                      .live_thread
                      .as_ref()
                      .expect("live thread")
                      .load_history(/*include_archived*/ true)
                      .await
                      .expect("load persisted history");
                  assert!(has_persisted_function_result(
                      &persisted.items,
                      "call-success",
                  ));
              }'''.replace('              ', ''),
          )

          replace_once(
              'codex-rs/core/src/session/turn_tests.rs',
              '''#[tokio::test]
              async fn direct_tool_result_persistence_marks_append_failure_ambiguous() {
                  let (session, _) = crate::session::tests::make_session_and_context().await;
                  session
                      .begin_tool_operation_receipt(
                          "call-failure".to_string(),
                          ToolOperationEffect::PotentialMutation,
                      )
                      .await;
                  session
                      .record_tool_operation_terminal("call-failure", ToolOperationTerminalState::Completed)
                      .await;
                  let result = direct_function_result("call-failure");

                  record_direct_tool_result_persistence(&session, response_input_tool_call_id(&result), false)
                      .await;

                  let receipt = session
                      .tool_operation_receipt("call-failure")
                      .await
                      .expect("receipt should exist");
                  assert_eq!(receipt.result_state, ToolOperationResultState::Ambiguous);
                  assert!(session.has_unreconciled_potential_mutation().await);
              }'''.replace('              ', ''),
              '''#[tokio::test]
              async fn direct_tool_result_persistence_marks_real_append_failure_ambiguous() {
                  let (session, turn_context, store) =
                      make_session_with_in_memory_persistence().await;
                  session
                      .begin_tool_operation_receipt(
                          "call-failure".to_string(),
                          ToolOperationEffect::PotentialMutation,
                      )
                      .await;
                  session
                      .record_tool_operation_terminal(
                          "call-failure",
                          ToolOperationTerminalState::Completed,
                      )
                      .await;
                  store
                      .fail_next_append_for_test("injected append failure")
                      .await;

                  record_direct_tool_result(
                      &session,
                      &turn_context,
                      direct_function_result("call-failure"),
                  )
                  .await;

                  let receipt = session
                      .tool_operation_receipt("call-failure")
                      .await
                      .expect("receipt should exist");
                  assert_eq!(receipt.result_state, ToolOperationResultState::Ambiguous);
                  assert!(session.has_unreconciled_potential_mutation().await);
                  assert_eq!(store.calls().await.append_items, 1);
                  let persisted = session
                      .services
                      .live_thread
                      .as_ref()
                      .expect("live thread")
                      .load_history(/*include_archived*/ true)
                      .await
                      .expect("load persisted history");
                  assert!(!has_persisted_function_result(
                      &persisted.items,
                      "call-failure",
                  ));
                  assert!(has_in_memory_function_result(
                      session.clone_history().await.raw_items(),
                      "call-failure",
                  ));
              }'''.replace('              ', ''),
          )
          PY
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Format and run focused tests
        run: |
          rustfmt --edition 2024 codex-rs/thread-store/src/in_memory.rs codex-rs/core/src/session/turn.rs codex-rs/core/src/session/turn_tests.rs
          rustfmt --edition 2024 --check codex-rs/thread-store/src/in_memory.rs codex-rs/core/src/session/turn.rs codex-rs/core/src/session/turn_tests.rs
          cd codex-rs
          cargo test -p codex-core --lib direct_tool_result_persistence_ --locked
          cargo test -p codex-thread-store --lib in_memory --locked
      - name: Verify patch hygiene
        run: git diff --check
      - name: Publish validated source-only head
        run: |
          rm -f .fieldwork-83-direct-append-evidence
          rm -f .github/workflows/fieldwork-83-direct-append-evidence.yml
          git add -A
          git commit -m 'core: test direct result persistence through live append'
          git push origin HEAD:fieldwork/83-direct-append-evidence
