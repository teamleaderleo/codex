name: fieldwork-turn-operation-receipts

on:
  pull_request:
    paths:
      - codex-rs/core/src/state/turn.rs
      - codex-rs/core/src/state/turn_operation_receipt_tests.rs
      - .github/workflows/fieldwork-turn-operation-receipts.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
      - name: Compile and run turn receipt tests
        run: cargo test -p codex-core --lib turn_operation_receipt --locked
