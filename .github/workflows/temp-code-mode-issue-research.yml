name: Temporary Codex issue research launcher

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-code-mode-issue-research.yml

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: review/code-mode-issue-ready
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate collector syntax
        run: python -m py_compile notes/code-mode-orphan-fix/research/scripts/collect_github_study.py

      - name: Collect frames, samples, comments, and timeline data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python notes/code-mode-orphan-fix/research/scripts/collect_github_study.py \
            --snapshot 2026-07-27T14:45:22Z \
            --mature-size 300 \
            --freshness-size 50 \
            --mature-seed 3561301 \
            --freshness-seed 3561302 \
            --output-dir research-output

      - name: Prepare repository-sized research snapshot
        run: |
          python - <<'PY'
          import csv
          import json
          import shutil
          from pathlib import Path

          source = Path("research-output")
          target = Path("notes/code-mode-orphan-fix/research/runs/2026-07-27")
          if target.exists():
              shutil.rmtree(target)
          target.mkdir(parents=True)

          for name in [
              "study-config.json",
              "machine-summary.json",
              "mature-sample.csv",
              "freshness-sample.csv",
              "mature-coded-machine.csv",
              "freshness-coded-machine.csv",
              "mature-threads.jsonl",
              "freshness-threads.jsonl",
          ]:
              shutil.copy2(source / name, target / name)

          keep = [
              "number",
              "url",
              "title",
              "state",
              "state_reason",
              "created_at",
              "updated_at",
              "closed_at",
              "comments_count",
              "author_login",
              "author_type",
              "author_association",
              "labels",
              "reactions_total",
          ]
          for cohort in ["mature", "freshness"]:
              rows = []
              with (source / f"{cohort}-frame.jsonl").open(encoding="utf-8") as handle:
                  for line in handle:
                      row = json.loads(line)
                      rows.append({key: row.get(key) for key in keep})
              with (target / f"{cohort}-frame.jsonl").open("w", encoding="utf-8") as handle:
                  for row in rows:
                      handle.write(json.dumps(row, ensure_ascii=False) + "\n")
              with (target / f"{cohort}-frame.csv").open("w", newline="", encoding="utf-8") as handle:
                  writer = csv.DictWriter(handle, fieldnames=keep)
                  writer.writeheader()
                  writer.writerows(rows)

          (target / "README.md").write_text(
              "# Codex issue-triage research run — 2026-07-27\n\n"
              "This directory contains the frozen frames, seeded samples, sampled public threads, "
              "and provisional deterministic coding generated by the research workflow.\n\n"
              "Fields ending in `_machine` are not publication-ready human judgements. "
              "They must be reviewed against `reviewer-research-brief.md` before quality or nuanced "
              "response claims are published.\n",
              encoding="utf-8",
          )
          PY

      - name: Commit reproducibility artifacts to research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes/code-mode-orphan-fix/research/runs/2026-07-27
          if git diff --cached --quiet; then
            echo "No dataset changes to commit"
          else
            git commit -m "Add 2026-07-27 Codex issue research dataset"
            git push origin HEAD:review/code-mode-issue-ready
          fi

      - name: Upload full research dataset
        uses: actions/upload-artifact@v4
        with:
          name: codex-issue-research-2026-07-27
          path: research-output
          if-no-files-found: error
          retention-days: 30
