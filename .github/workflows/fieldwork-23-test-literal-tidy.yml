name: Fieldwork 23 test literal tidy

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Tidy asserted test literal
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/core/src/unified_exec/async_watcher_tests.rs")
          text = path.read_text()
          old = '''        let chunk = format!(
              "chunk-{index:04}
          "
          )
          .into_bytes();'''
          new = '''        let chunk = format!("chunk-{index:04}\\n").into_bytes();'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one multiline test literal, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY

      - name: Format Rust
        working-directory: codex-rs
        run: cargo fmt --all -- --config imports_granularity=Item,group_imports=StdExternalCrate

      - name: Review and commit
        run: |
          git diff --check
          git diff -- codex-rs/core/src/unified_exec/async_watcher_tests.rs
          rm .github/workflows/fieldwork-23-test-literal-tidy.yml
          git config user.name "teamleaderleo"
          git config user.email "13091533+teamleaderleo@users.noreply.github.com"
          git add codex-rs/core/src/unified_exec/async_watcher_tests.rs \
            .github/workflows/fieldwork-23-test-literal-tidy.yml
          git commit -m "test: tidy unified exec transcript fixture"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
