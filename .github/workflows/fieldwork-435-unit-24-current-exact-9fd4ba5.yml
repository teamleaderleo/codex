name: fieldwork-435-unit-24-package-control-9fd4ba5

on:
  pull_request:
    branches:
      - fix/responses-lite-first-request
    paths:
      - .github/workflows/fieldwork-435-unit-24-current-exact-9fd4ba5.yml

concurrency:
  group: fieldwork-435-unit-24-package-control-9fd4ba5
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  SOURCE_HEAD: 9fd4ba575de8dd77bc411362256591ce9e7d8c82
  SOURCE_BASE: ee0247f95a6fe2b094ba2253d82cae2a2b4c2dff

jobs:
  package-control:
    name: sequential candidate/base package control
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify candidate source fence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git rev-parse HEAD^)" = "$SOURCE_BASE"
          actual="$(git diff --name-only "$SOURCE_BASE" "$SOURCE_HEAD" | sort)"
          expected="$(printf '%s\n' \
            codex-rs/core/src/client.rs \
            codex-rs/core/tests/suite/agent_websocket.rs \
            codex-rs/core/tests/suite/client_websockets.rs | sort)"
          test "$actual" = "$expected"
          echo 'FIELDWORK_LITE_PACKAGE_SOURCE_FENCE=3/3'

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Run candidate package gate
        id: candidate_package
        env:
          RUST_MIN_STACK: 33554432
        run: |
          set +e
          just test -p codex-core 2>&1 | tee /tmp/candidate-package.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "FIELDWORK_LITE_PACKAGE_CONTROL=candidate:$status"

      - name: Run candidate fix gate
        id: candidate_fix
        if: always()
        run: |
          set +e
          just fix -p codex-core 2>&1 | tee /tmp/candidate-fix.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "FIELDWORK_LITE_FIX_CONTROL=candidate:$status"

      - name: Record candidate worktree
        id: candidate_tree
        if: always()
        run: |
          set +e
          git diff --check >/tmp/candidate-diff.log 2>&1
          diff_status=$?
          git status --porcelain > /tmp/candidate-status.log
          if test -s /tmp/candidate-status.log; then clean=0; else clean=1; fi
          set -e
          echo "diff_status=$diff_status" >> "$GITHUB_OUTPUT"
          echo "clean=$clean" >> "$GITHUB_OUTPUT"
          echo "FIELDWORK_LITE_WORKTREE_CONTROL=candidate:diff=$diff_status;clean=$clean"

      - name: Switch to exact base
        if: always()
        run: |
          set -euo pipefail
          git reset --hard
          git clean -ffd
          git checkout --detach "$SOURCE_BASE"
          test "$(git rev-parse HEAD)" = "$SOURCE_BASE"

      - name: Run base package gate
        id: base_package
        if: always()
        env:
          RUST_MIN_STACK: 33554432
        run: |
          set +e
          just test -p codex-core 2>&1 | tee /tmp/base-package.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "FIELDWORK_LITE_PACKAGE_CONTROL=base:$status"

      - name: Normalize package markers
        id: markers
        if: always()
        run: |
          set -euo pipefail
          pattern='(^error:|^failures:|test result:|FAILED|panicked at|stack overflow|SIGABRT|failures:$|Caused by:)'
          grep -E "$pattern" /tmp/candidate-package.log 2>/dev/null | tail -n 300 > /tmp/candidate-markers.log || true
          grep -E "$pattern" /tmp/base-package.log 2>/dev/null | tail -n 300 > /tmp/base-markers.log || true
          candidate_hash=$(sha256sum /tmp/candidate-markers.log | cut -d' ' -f1)
          base_hash=$(sha256sum /tmp/base-markers.log | cut -d' ' -f1)
          echo "candidate_hash=$candidate_hash" >> "$GITHUB_OUTPUT"
          echo "base_hash=$base_hash" >> "$GITHUB_OUTPUT"
          echo "FIELDWORK_LITE_PACKAGE_MARKERS=candidate:$candidate_hash;base:$base_hash"

      - name: Post package-control report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_PACKAGE: ${{ steps.candidate_package.outputs.status }}
          BASE_PACKAGE: ${{ steps.base_package.outputs.status }}
          CANDIDATE_FIX: ${{ steps.candidate_fix.outputs.status }}
          DIFF_STATUS: ${{ steps.candidate_tree.outputs.diff_status }}
          TREE_CLEAN: ${{ steps.candidate_tree.outputs.clean }}
          CANDIDATE_HASH: ${{ steps.markers.outputs.candidate_hash }}
          BASE_HASH: ${{ steps.markers.outputs.base_hash }}
        run: |
          set -euo pipefail
          {
            echo '## Unit 24 sequential package control'
            echo
            echo "- candidate: \`$SOURCE_HEAD\`"
            echo "- base: \`$SOURCE_BASE\`"
            echo "- candidate package exit: \`${CANDIDATE_PACKAGE:-missing}\`"
            echo "- base package exit: \`${BASE_PACKAGE:-missing}\`"
            echo "- candidate fix exit: \`${CANDIDATE_FIX:-missing}\`"
            echo "- candidate diff-check exit: \`${DIFF_STATUS:-missing}\`"
            echo "- candidate worktree clean: \`${TREE_CLEAN:-missing}\`"
            echo "- candidate marker hash: \`${CANDIDATE_HASH:-missing}\`"
            echo "- base marker hash: \`${BASE_HASH:-missing}\`"
            echo
            echo '<details><summary>Candidate package markers</summary>'
            echo
            echo '```text'
            cat /tmp/candidate-markers.log 2>/dev/null || true
            echo '```'
            echo '</details>'
            echo
            echo '<details><summary>Base package markers</summary>'
            echo
            echo '```text'
            cat /tmp/base-markers.log 2>/dev/null || true
            echo '```'
            echo '</details>'
            echo
            echo '<details><summary>Candidate fix markers</summary>'
            echo
            echo '```text'
            grep -E '(^error:|^warning:|FAILED|panicked at|Caused by:)' /tmp/candidate-fix.log 2>/dev/null | tail -n 120 || true
            echo '```'
            echo '</details>'
            if test -s /tmp/candidate-status.log; then
              echo
              echo '<details><summary>Candidate changed worktree paths</summary>'
              echo
              echo '```text'
              cat /tmp/candidate-status.log
              echo '```'
              echo '</details>'
            fi
          } > /tmp/report.md
          cat /tmp/report.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/135/comments" --method POST --raw-field body="$(cat /tmp/report.md)"

      - name: Enforce hygiene and classification
        if: always()
        env:
          CANDIDATE_PACKAGE: ${{ steps.candidate_package.outputs.status }}
          BASE_PACKAGE: ${{ steps.base_package.outputs.status }}
          CANDIDATE_FIX: ${{ steps.candidate_fix.outputs.status }}
          DIFF_STATUS: ${{ steps.candidate_tree.outputs.diff_status }}
          TREE_CLEAN: ${{ steps.candidate_tree.outputs.clean }}
          CANDIDATE_HASH: ${{ steps.markers.outputs.candidate_hash }}
          BASE_HASH: ${{ steps.markers.outputs.base_hash }}
        run: |
          set -euo pipefail
          test "${CANDIDATE_FIX:-missing}" = 0
          test "${DIFF_STATUS:-missing}" = 0
          test "${TREE_CLEAN:-missing}" = 1
          if test "${CANDIDATE_PACKAGE:-missing}" = 0; then
            test "${BASE_PACKAGE:-missing}" = 0
            echo 'FIELDWORK_LITE_PACKAGE_CLASSIFICATION=both-pass'
          else
            test "${BASE_PACKAGE:-missing}" != 0
            test "${CANDIDATE_HASH:-missing}" = "${BASE_HASH:-different}"
            echo 'FIELDWORK_LITE_PACKAGE_CLASSIFICATION=matching-baseline-failure'
          fi
