name: fieldwork-83-direct-append-clean-pr-v3

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fieldwork-83-direct-append-clean-pr-v3.yml

permissions:
  contents: write

concurrency:
  group: fieldwork-83-direct-append-clean-pr-v3
  cancel-in-progress: true

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/83-direct-append-clean
          fetch-depth: 0
          persist-credentials: true

      - name: Configure publication identity
        run: |
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com

      - name: Apply direct source and tests
        run: python3 .github/fieldwork/83_apply_direct_append_clean.py

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Format and run focused tests
        run: |
          rustfmt --edition 2024 \
            codex-rs/thread-store/src/in_memory.rs \
            codex-rs/core/src/session/turn.rs \
            codex-rs/core/src/session/turn_tests.rs
          rustfmt --edition 2024 --check \
            codex-rs/thread-store/src/in_memory.rs \
            codex-rs/core/src/session/turn.rs \
            codex-rs/core/src/session/turn_tests.rs
          cd codex-rs
          cargo test -p codex-core --lib direct_tool_result_persistence_ --locked
          cargo test -p codex-thread-store --lib in_memory --locked

      - name: Verify and publish source-only head
        run: |
          git diff --check
          rm -f .fieldwork-83-direct-append-clean
          rm -rf .github/fieldwork
          rm -f .github/workflows/fieldwork-83-direct-append-clean.yml
          rm -f .github/workflows/fieldwork-83-direct-append-clean-pr.yml
          rm -f .github/workflows/fieldwork-83-direct-append-clean-pr-v2.yml
          rm -f .github/workflows/fieldwork-83-direct-append-clean-pr-v3.yml
          expected=$(printf '%s\n' \
            codex-rs/core/src/session/turn.rs \
            codex-rs/core/src/session/turn_tests.rs \
            codex-rs/thread-store/src/in_memory.rs)
          actual=$(git diff --name-only origin/main | sort)
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"
          git diff --check
          git add -A
          git commit -m 'core: prove direct result persistence through live append'
          git push origin HEAD:fieldwork/83-direct-append-clean
