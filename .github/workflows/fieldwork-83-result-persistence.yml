name: Fieldwork 83 direct result persistence

on:
  push:
    branches:
      - fieldwork/83-result-persistence-compaction-gate

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/83-result-persistence-compaction-gate
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Apply reviewed source slice
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}")
              file.write_text(text.replace(old, new, 1))

          session_mod = "codex-rs/core/src/session/mod.rs"
          replace_once(
              session_mod,
              '''    #[tracing::instrument(level = "trace", skip_all, fields(item_count = items.len()))]
              pub(crate) async fn record_conversation_items(
                  &self,
                  turn_context: &TurnContext,
                  items: &[ResponseItem],
              ) {
                  let items = self.prepare_conversation_items_for_history(turn_context, items);
                  let items = items.as_ref();
                  {
                      let mut state = self.state.lock().await;
                      state.current_time_reminder.note_recorded_items(items);
                      state.record_items(
                          items.iter(),
                          turn_context.model_info.truncation_policy.into(),
                      );
                  }
                  self.persist_rollout_response_items(items).await;
                  self.send_raw_response_items(turn_context, items).await;
              }
          ''',
              '''    #[tracing::instrument(level = "trace", skip_all, fields(item_count = items.len()))]
              pub(crate) async fn record_conversation_items(
                  &self,
                  turn_context: &TurnContext,
                  items: &[ResponseItem],
              ) -> bool {
                  let items = self.prepare_conversation_items_for_history(turn_context, items);
                  let items = items.as_ref();
                  {
                      let mut state = self.state.lock().await;
                      state.current_time_reminder.note_recorded_items(items);
                      state.record_items(
                          items.iter(),
                          turn_context.model_info.truncation_policy.into(),
                      );
                  }
                  let result_persisted = self.persist_rollout_response_items(items).await;
                  self.send_raw_response_items(turn_context, items).await;
                  result_persisted
              }
          ''',
          )
          replace_once(
              session_mod,
              '''    async fn persist_rollout_response_items(&self, items: &[ResponseItem]) {
                  let rollout_items: Vec<RolloutItem> = items
                      .iter()
                      .cloned()
                      .map(RolloutItem::ResponseItem)
                      .collect();
                  self.persist_rollout_items(&rollout_items).await;
              }
          ''',
              '''    async fn persist_rollout_response_items(&self, items: &[ResponseItem]) -> bool {
                  let rollout_items: Vec<RolloutItem> = items
                      .iter()
                      .cloned()
                      .map(RolloutItem::ResponseItem)
                      .collect();
                  self.persist_rollout_items_checked(&rollout_items).await
              }
          ''',
          )
          replace_once(
              session_mod,
              '''    #[tracing::instrument(level = "trace", skip_all, fields(item_count = items.len()))]
              pub(crate) async fn persist_rollout_items(&self, items: &[RolloutItem]) {
                  if let Some(live_thread) = self.live_thread()
                      && let Err(e) = live_thread.append_items(items).await
                  {
                      error!("failed to record rollout items: {e:#}");
                  }
              }
          ''',
              '''    #[tracing::instrument(level = "trace", skip_all, fields(item_count = items.len()))]
              pub(crate) async fn persist_rollout_items(&self, items: &[RolloutItem]) {
                  let _ = self.persist_rollout_items_checked(items).await;
              }

              /// Persists rollout items and reports whether they reached the authoritative
              /// history for this session lifetime. Ephemeral sessions intentionally use
              /// in-memory history as their complete lifetime.
              async fn persist_rollout_items_checked(&self, items: &[RolloutItem]) -> bool {
                  let Some(live_thread) = self.live_thread() else {
                      return true;
                  };
                  if let Err(e) = live_thread.append_items(items).await {
                      error!("failed to record rollout items: {e:#}");
                      return false;
                  }
                  true
              }
          ''',
          )

          turn = "codex-rs/core/src/session/turn.rs"
          replace_once(
              turn,
              '''            Ok(response_input) => {
                              let response_item = response_input.into();
                              sess.record_conversation_items(&turn_context, std::slice::from_ref(&response_item))
                                  .await;
                              mark_thread_memory_mode_polluted_if_external_context(
                                  sess.as_ref(),
                                  turn_context.as_ref(),
                                  &response_item,
                              )
                              .await;
                          }
          ''',
              '''            Ok(response_input) => {
                              let call_id = response_input_tool_call_id(&response_input).map(str::to_string);
                              let response_item = response_input.into();
                              let result_persisted = sess
                                  .record_conversation_items(
                                      &turn_context,
                                      std::slice::from_ref(&response_item),
                                  )
                                  .await;
                              if let Some(call_id) = call_id {
                                  if result_persisted {
                                      sess.record_tool_operation_result_persisted(&call_id).await;
                                  } else {
                                      sess.record_tool_operation_result_ambiguous(&call_id).await;
                                  }
                              }
                              mark_thread_memory_mode_polluted_if_external_context(
                                  sess.as_ref(),
                                  turn_context.as_ref(),
                                  &response_item,
                              )
                              .await;
                          }
          ''',
          )
          replace_once(
              turn,
              '''fn assign_missing_streamed_response_item_id(
          ''',
              '''fn response_input_tool_call_id(item: &ResponseInputItem) -> Option<&str> {
                  match item {
                      ResponseInputItem::FunctionCallOutput { call_id, .. }
                      | ResponseInputItem::McpToolCallOutput { call_id, .. }
                      | ResponseInputItem::CustomToolCallOutput { call_id, .. } => Some(call_id),
                      ResponseInputItem::ToolSearchOutput {
                          call_id,
                          execution,
                          ..
                      } if execution == "client" => Some(call_id),
                      ResponseInputItem::Message { .. } | ResponseInputItem::ToolSearchOutput { .. } => None,
                  }
              }

              fn assign_missing_streamed_response_item_id(
          ''',
          )

          tests = "codex-rs/core/src/session/turn_tests.rs"
          test_file = Path(tests)
          test_text = test_file.read_text()
          addition = r'''

          #[test]
          fn response_input_tool_call_id_tracks_direct_tool_results() {
              let function = ResponseInputItem::FunctionCallOutput {
                  call_id: "function-call".to_string(),
                  output: codex_protocol::models::FunctionCallOutputPayload::from_text(
                      "ok".to_string(),
                  ),
              };
              let custom = ResponseInputItem::CustomToolCallOutput {
                  call_id: "custom-call".to_string(),
                  name: Some("custom".to_string()),
                  output: codex_protocol::models::FunctionCallOutputPayload::from_text(
                      "ok".to_string(),
                  ),
              };
              let client_search = ResponseInputItem::ToolSearchOutput {
                  call_id: "search-call".to_string(),
                  status: "completed".to_string(),
                  execution: "client".to_string(),
                  tools: Vec::new(),
              };
              let server_search = ResponseInputItem::ToolSearchOutput {
                  call_id: "server-search".to_string(),
                  status: "completed".to_string(),
                  execution: "server".to_string(),
                  tools: Vec::new(),
              };
              let message = ResponseInputItem::Message {
                  role: "assistant".to_string(),
                  content: Vec::new(),
                  phase: None,
              };

              assert_eq!(
                  response_input_tool_call_id(&function),
                  Some("function-call")
              );
              assert_eq!(response_input_tool_call_id(&custom), Some("custom-call"));
              assert_eq!(
                  response_input_tool_call_id(&client_search),
                  Some("search-call")
              );
              assert_eq!(response_input_tool_call_id(&server_search), None);
              assert_eq!(response_input_tool_call_id(&message), None);
          }
          '''
          if "fn response_input_tool_call_id_tracks_direct_tool_results" in test_text:
              raise SystemExit("result persistence test already exists")
          test_file.write_text(test_text + addition)
          PY
          rm .github/workflows/fieldwork-83-result-persistence.yml
      - name: Format and run focused tests
        working-directory: codex-rs
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p codex-core --lib response_input_tool_call_id --locked
          cargo test -p codex-core --lib tool_operation_receipts --locked
      - name: Verify patch hygiene
        run: git diff --check
      - name: Commit validated source
        run: |
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
          git add -A
          git commit -m 'core: record authoritative direct tool result persistence'
          git push origin HEAD:fieldwork/83-result-persistence-compaction-gate
