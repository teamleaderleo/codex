name: fieldwork-84-mcp-publication-tickets

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fieldwork-84-mcp-publication-tickets.yml

permissions:
  contents: write

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/84-mcp-publication-tickets
          fetch-depth: 0
          persist-credentials: true
      - run: |
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
      - name: Apply publication generation and freshness state
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('codex-rs/codex-mcp/src/runtime.rs')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '''use std::sync::Arc;
          use std::sync::atomic::AtomicBool;
          use std::sync::atomic::Ordering;
          '''.replace('          ', ''),
              '''use std::sync::Arc;
          use std::sync::Mutex as StdMutex;
          '''.replace('          ', ''),
              1,
          )

          text = text.replace(
              '''pub struct McpRuntime {
              current: ArcSwap<PublishedMcpRuntime>,
              reconnect_pending: AtomicBool,
              elicitation_router: ElicitationRequestRouter,
          }
          '''.replace('          ', ''),
              '''pub struct McpRuntime {
              current: ArcSwap<PublishedMcpRuntime>,
              publication_state: StdMutex<McpPublicationState>,
              elicitation_router: ElicitationRequestRouter,
          }
          '''.replace('          ', ''),
              1,
          )

          guard_start = text.index('struct McpReconnectGuard')
          gate_start = text.index('#[derive(Clone)]\npub(crate) struct McpPublicationGate', guard_start)
          ticket_state = '''#[derive(Debug, Clone, Copy, Eq, PartialEq)]
          struct McpRefreshTicket {
              generation: u64,
              freshness_epoch: u64,
              force_fresh: bool,
          }

          #[derive(Debug, Default)]
          struct McpPublicationState {
              latest_requested_generation: u64,
              freshness_epoch: u64,
              published_freshness_epoch: u64,
          }

          impl McpPublicationState {
              fn request_fresh(&mut self) {
                  self.freshness_epoch = self
                      .freshness_epoch
                      .checked_add(1)
                      .expect("MCP freshness epoch overflow");
              }

              fn issue(&mut self, force_fresh: bool) -> McpRefreshTicket {
                  if force_fresh {
                      self.request_fresh();
                  }
                  self.latest_requested_generation = self
                      .latest_requested_generation
                      .checked_add(1)
                      .expect("MCP publication generation overflow");
                  McpRefreshTicket {
                      generation: self.latest_requested_generation,
                      freshness_epoch: self.freshness_epoch,
                      force_fresh: self.freshness_epoch > self.published_freshness_epoch,
                  }
              }

              fn can_publish(&self, ticket: McpRefreshTicket) -> bool {
                  ticket.generation == self.latest_requested_generation
                      && ticket.freshness_epoch == self.freshness_epoch
              }

              fn mark_published(&mut self, ticket: McpRefreshTicket) {
                  assert!(self.can_publish(ticket));
                  self.published_freshness_epoch = ticket.freshness_epoch;
              }
          }

          '''.replace('          ', '')
          text = text[:guard_start] + ticket_state + text[gate_start:]

          text = text.replace(
              '            reconnect_pending: AtomicBool::new(false),\n',
              '            publication_state: StdMutex::new(McpPublicationState::default()),\n',
              1,
          )

          replace_start = text.index('    /// Reconciles configured servers and publishes their immutable runtime snapshot.')
          publish_start = text.index('    async fn publish(', replace_start)
          replacement_methods = '''    /// Reconciles configured servers and publishes their immutable runtime snapshot.
          pub async fn replace(&self, input: McpRuntimeInput) {
              let ticket = self.issue_refresh_ticket(/*force_fresh*/ false);
              let current = self.current.load_full();
              let previous = (!ticket.force_fresh).then_some(current.connections.as_ref());
              let _ = self.publish(input, previous, ticket).await;
          }

          /// Starts fresh connections and returns their complete, refreshed Apps catalog.
          pub async fn replace_fresh(&self, input: McpRuntimeInput) -> anyhow::Result<Vec<ToolInfo>> {
              let ticket = self.issue_refresh_ticket(/*force_fresh*/ true);
              if !self.publish(input, /*previous*/ None, ticket).await {
                  anyhow::bail!("MCP refresh was superseded before publication");
              }
              self.latest_hard_refresh_codex_apps_tools_cache().await
          }

          fn issue_refresh_ticket(&self, force_fresh: bool) -> McpRefreshTicket {
              self.publication_state
                  .lock()
                  .unwrap_or_else(|poisoned| poisoned.into_inner())
                  .issue(force_fresh)
          }

          '''.replace('          ', '')
          text = text[:replace_start] + replacement_methods + text[publish_start:]

          text = text.replace(
              '''    async fn publish(&self, input: McpRuntimeInput, previous: Option<&McpConnectionSet>) {
          '''.replace('          ', ''),
              '''    async fn publish(
              &self,
              input: McpRuntimeInput,
              previous: Option<&McpConnectionSet>,
              ticket: McpRefreshTicket,
          ) -> bool {
          '''.replace('          ', ''),
              1,
          )

          old_publish_tail = '''        self.current.store(Arc::new(PublishedMcpRuntime {
              connections,
              config: Some(config),
              auth,
              auth_token,
              plugins_available,
              ready_selected_capability_roots,
          }));
          let _ = publish.send(true);
          }
          '''.replace('          ', '')
          new_publish_tail = '''        let candidate = Arc::new(PublishedMcpRuntime {
              connections,
              config: Some(config),
              auth,
              auth_token,
              plugins_available,
              ready_selected_capability_roots,
          });
          let accepted = {
              let mut state = self
                  .publication_state
                  .lock()
                  .unwrap_or_else(|poisoned| poisoned.into_inner());
              if state.can_publish(ticket) {
                  self.current.store(candidate);
                  state.mark_published(ticket);
                  true
              } else {
                  false
              }
          };
          if accepted {
              let _ = publish.send(true);
          }
          accepted
          }
          '''.replace('          ', '')
          if text.count(old_publish_tail) != 1:
              raise SystemExit('publish tail anchor changed')
          text = text.replace(old_publish_tail, new_publish_tail, 1)

          text = text.replace(
              '''    /// Ensures the next refresh creates fresh connections for every configured server.
              pub fn reconnect_on_next_refresh(&self) {
                  self.reconnect_pending.store(true, Ordering::Release);
              }
          '''.replace('          ', ''),
              '''    /// Ensures the next refresh creates fresh connections for every configured server.
              pub fn reconnect_on_next_refresh(&self) {
                  self.publication_state
                      .lock()
                      .unwrap_or_else(|poisoned| poisoned.into_inner())
                      .request_fresh();
              }
          '''.replace('          ', ''),
              1,
          )

          test_anchor = '''    #[tokio::test]
              async fn publication_gate_opens_only_for_the_winning_candidate() {
          '''.replace('          ', '')
          index = text.index(test_anchor)
          tests = '''    #[test]
          fn publication_state_rejects_older_generation() {
              let mut state = McpPublicationState::default();
              let older = state.issue(/*force_fresh*/ false);
              let newer = state.issue(/*force_fresh*/ false);

              assert!(!state.can_publish(older));
              assert!(state.can_publish(newer));
              state.mark_published(newer);
          }

          #[test]
          fn publication_state_carries_freshness_across_overlapping_refreshes() {
              let mut state = McpPublicationState::default();
              state.request_fresh();
              let older = state.issue(/*force_fresh*/ false);
              let newer = state.issue(/*force_fresh*/ false);

              assert!(older.force_fresh);
              assert!(newer.force_fresh);
              assert!(!state.can_publish(older));
              assert!(state.can_publish(newer));
              state.mark_published(newer);

              let sequential = state.issue(/*force_fresh*/ false);
              assert!(!sequential.force_fresh);
          }

          #[test]
          fn publication_state_rejects_candidate_when_freshness_advances() {
              let mut state = McpPublicationState::default();
              let stale = state.issue(/*force_fresh*/ false);
              state.request_fresh();

              assert!(!state.can_publish(stale));
              let replacement = state.issue(/*force_fresh*/ false);
              assert!(replacement.force_fresh);
              assert!(state.can_publish(replacement));
          }

          #[tokio::test]
          async fn publication_state_keeps_stale_candidate_gate_closed() {
              let mut state = McpPublicationState::default();
              let stale = state.issue(/*force_fresh*/ false);
              let current = state.issue(/*force_fresh*/ false);
              let (publish, gate) = McpPublicationGate::pending();

              if state.can_publish(stale) {
                  publish.send(true).expect("publish stale candidate");
              } else {
                  drop(publish);
              }

              assert!(!gate.wait().await);
              assert!(state.can_publish(current));
          }

          '''.replace('          ', '')
          text = text[:index] + tests + text[index:]

          path.write_text(text, encoding='utf-8')
          PY
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Execute focused runtime tests
        run: |
          rustfmt --edition 2024 codex-rs/codex-mcp/src/runtime.rs
          rustfmt --edition 2024 --check codex-rs/codex-mcp/src/runtime.rs
          cd codex-rs
          cargo test -p codex-mcp publication_state_ --locked
          cargo test -p codex-mcp publication_gate_opens_only_for_the_winning_candidate --locked
      - name: Publish source-only head
        run: |
          rm -f .github/workflows/fieldwork-84-mcp-publication-tickets.yml
          actual=$(git diff --name-only origin/main)
          test "$actual" = "codex-rs/codex-mcp/src/runtime.rs"
          git diff --check
          git add -A
          git commit -m 'mcp: publish only the latest refresh generation'
          git push origin HEAD:fieldwork/84-mcp-publication-tickets
