name: fieldwork-162-mcp-timeout-outcome-pr

on:
  pull_request:
    branches:
      - main
    paths:
      - .fieldwork-162-mcp-timeout-outcome
      - .github/fieldwork/162_apply_mcp_timeout_outcome.py
      - .github/fieldwork/162_add_timeout_handoff_test.py
      - .github/workflows/fieldwork-162-mcp-timeout-outcome.yml
      - .github/workflows/fieldwork-162-mcp-timeout-outcome-pr.yml
      - codex-rs/rmcp-client/src/rmcp_client.rs
      - codex-rs/rmcp-client/src/lib.rs
      - codex-rs/core/src/tools/context.rs
      - codex-rs/core/src/tools/context_tests.rs
      - codex-rs/core/src/tools/handlers/mcp.rs
      - codex-rs/core/src/mcp_tool_call.rs

permissions:
  contents: read

concurrency:
  group: fieldwork-162-mcp-timeout-outcome-pr
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/162-mcp-timeout-outcome
          fetch-depth: 0
          persist-credentials: false
      - name: Apply bounded internal outcome slice
        run: |
          python3 .github/fieldwork/162_apply_mcp_timeout_outcome.py
          python3 .github/fieldwork/162_add_timeout_handoff_test.py
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Format exact source files
        run: |
          rustfmt --edition 2024 \
            codex-rs/rmcp-client/src/rmcp_client.rs \
            codex-rs/rmcp-client/src/lib.rs \
            codex-rs/core/src/tools/context.rs \
            codex-rs/core/src/tools/context_tests.rs \
            codex-rs/core/src/tools/handlers/mcp.rs \
            codex-rs/core/src/mcp_tool_call.rs
          rustfmt --edition 2024 --check \
            codex-rs/rmcp-client/src/rmcp_client.rs \
            codex-rs/rmcp-client/src/lib.rs \
            codex-rs/core/src/tools/context.rs \
            codex-rs/core/src/tools/context_tests.rs \
            codex-rs/core/src/tools/handlers/mcp.rs \
            codex-rs/core/src/mcp_tool_call.rs
      - name: Test typed SDK failure classification
        working-directory: codex-rs
        run: cargo test -p codex-rmcp-client mcp_tool_call_failure_classification --locked
      - name: Test core execution-state mapping
        working-directory: codex-rs
        run: cargo test -p codex-core --lib mcp_tool_execution_state --locked
      - name: Test behavior-neutral model output
        working-directory: codex-rs
        run: cargo test -p codex-core --lib mcp_execution_state_does_not_change_model_visible_output --locked
      - name: Verify patch hygiene
        run: git diff --check
