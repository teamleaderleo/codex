name: fieldwork-239-deferred-exact-review

on:
  pull_request:
    branches:
      - fieldwork/239-deferred-exact-base
    paths:
      - .github/workflows/fieldwork-239-deferred-exact-review.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  exact-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Verify exact source and diff
        run: |
          set -euo pipefail
          upstream=97576b1794872e342450ebd577123e052ab57626
          source=2b9fd0fc597965341a1a9c61559b67135ed0a49d
          git cat-file -e "${upstream}^{commit}"
          git cat-file -e "${source}^{commit}"
          git merge-base --is-ancestor "$source" HEAD
          git diff --check "${upstream}...${source}"
          git diff --name-only "${upstream}...${source}" > /tmp/source-files
          cat /tmp/source-files
          test "$(wc -l < /tmp/source-files)" -eq 2
          grep -Fx 'codex-rs/core/src/tools/spec_plan.rs' /tmp/source-files
          grep -Fx 'codex-rs/core/src/tools/spec_plan_tests.rs' /tmp/source-files
          git diff --exit-code "$source" -- \
            codex-rs/core/src/tools/spec_plan.rs \
            codex-rs/core/src/tools/spec_plan_tests.rs
      - name: Check formatting
        working-directory: codex-rs
        run: cargo fmt --all -- --check
      - name: Resolve and run four exact planner tests
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test -p codex-core --lib --locked -- --list > /tmp/unit-tests.list
          suffixes=(
            deferred_extension_is_direct_when_search_is_unavailable
            deferred_runtime_without_search_metadata_is_direct
            code_mode_keeps_unsearchable_deferred_runtime_registered
            mcp_and_tool_search_follow_direct_and_deferred_tool_exposure
          )
          executed=0
          for suffix in "${suffixes[@]}"; do
            mapfile -t matches < <(sed -n 's/: test$//p' /tmp/unit-tests.list | grep "${suffix}$")
            printf '%s matches: %s\n' "$suffix" "${matches[*]:-<none>}"
            test "${#matches[@]}" -eq 1
            cargo test -p codex-core --lib --locked "${matches[0]}" -- --exact --nocapture
            executed=$((executed + 1))
          done
          test "$executed" -eq 4
          echo "FIELDWORK_DEFERRED_EXACT=4/4"
      - name: Classify unavailable optional Code Mode fallback
        working-directory: codex-rs
        run: |
          set -euo pipefail
          suffix=missing_process_host_falls_back_to_direct_tools_and_warns_once
          cargo test -p codex-core --test all --locked -- --list > /tmp/integration-tests.list
          mapfile -t matches < <(sed -n 's/: test$//p' /tmp/integration-tests.list | grep "${suffix}$")
          printf '%s matches: %s\n' "$suffix" "${matches[*]:-<none>}"
          test "${#matches[@]}" -eq 1

          set +e
          cargo test -p codex-core --test all --locked "${matches[0]}" -- --exact --nocapture 2>&1 | tee /tmp/code-mode-default.log
          default_status=${PIPESTATUS[0]}
          RUST_MIN_STACK=16777216 cargo test -p codex-core --test all --locked "${matches[0]}" -- --exact --nocapture 2>&1 | tee /tmp/code-mode-large.log
          large_status=${PIPESTATUS[0]}
          set -e

          test "$large_status" -eq 0
          if test "$default_status" -ne 0; then
            grep -E 'stack overflow|has overflowed its stack' /tmp/code-mode-default.log
          fi
          echo "FIELDWORK_CODE_MODE_FALLBACK=default:${default_status};large:${large_status}"
