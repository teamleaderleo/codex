name: fieldwork-83-direct-append-clean-pr-v2

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fieldwork-83-direct-append-clean-pr-v2.yml

permissions:
  contents: write

concurrency:
  group: fieldwork-83-direct-append-clean-pr-v2
  cancel-in-progress: true

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/83-direct-append-clean
          fetch-depth: 0
          persist-credentials: true

      - name: Configure publication identity
        run: |
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com

      - name: Apply reviewed source and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('.github/workflows/fieldwork-83-direct-append-clean.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python3 - <<'PY'") + 1
          stop = next(i for i, line in enumerate(lines[start:], start) if line.strip() == 'PY')
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines[start:stop]
          )

          turn_marker = 'turn_path = "codex-rs/core/src/session/turn.rs"\n'
          turn_start = script.index(turn_marker) + len(turn_marker)
          brittle_start = script.index('replace_once(', turn_start)
          brittle_end = script.index('\n\nreplace_once(', brittle_start)
          scoped_replacement = r'''
          target = Path(turn_path)
          text = target.read_text(encoding="utf-8")
          function_start = text.index("async fn drain_in_flight(")
          arm_start = text.index("            Ok(response_input) => {\n", function_start)
          arm_end = text.index("            Err(err) => {\n", arm_start)
          new_arm = """            Ok(response_input) => {
              record_direct_tool_result(
                  sess.as_ref(),
                  turn_context.as_ref(),
                  response_input,
              )
              .await;
          }
          """
          text = text[:arm_start] + new_arm + text[arm_end:]
          target.write_text(text, encoding="utf-8")
          '''.strip('\n')
          script = script[:brittle_start] + scoped_replacement + script[brittle_end:]
          Path('/tmp/fieldwork-83-direct-append-clean.py').write_text(script + '\n')
          PY
          python3 /tmp/fieldwork-83-direct-append-clean.py

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Format and run focused tests
        run: |
          rustfmt --edition 2024 \
            codex-rs/thread-store/src/in_memory.rs \
            codex-rs/core/src/session/turn.rs \
            codex-rs/core/src/session/turn_tests.rs
          rustfmt --edition 2024 --check \
            codex-rs/thread-store/src/in_memory.rs \
            codex-rs/core/src/session/turn.rs \
            codex-rs/core/src/session/turn_tests.rs
          cd codex-rs
          cargo test -p codex-core --lib direct_tool_result_persistence_ --locked
          cargo test -p codex-thread-store --lib in_memory --locked

      - name: Verify and publish source-only head
        run: |
          git diff --check
          rm -f .fieldwork-83-direct-append-clean
          rm -f .github/workflows/fieldwork-83-direct-append-clean.yml
          rm -f .github/workflows/fieldwork-83-direct-append-clean-pr.yml
          rm -f .github/workflows/fieldwork-83-direct-append-clean-pr-v2.yml
          expected=$(printf '%s\n' \
            codex-rs/core/src/session/turn.rs \
            codex-rs/core/src/session/turn_tests.rs \
            codex-rs/thread-store/src/in_memory.rs)
          actual=$(git diff --name-only origin/main | sort)
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"
          git diff --check
          git add -A
          git commit -m 'core: prove direct result persistence through live append'
          git push origin HEAD:fieldwork/83-direct-append-clean
