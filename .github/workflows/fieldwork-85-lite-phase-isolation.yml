name: fieldwork-85-lite-phase-isolation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fieldwork-85-lite-phase-isolation.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  phase-markers:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Apply Responses Lite candidate
        run: python3 .github/fieldwork/85_apply_lite_prewarm_full_first_turn.py
      - name: Add phase markers to the full regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('codex-rs/core/tests/suite/agent_websocket.rs')
          text = path.read_text(encoding='utf-8')
          start = text.index('async fn websocket_first_responses_lite_turn_sends_full_manifest_after_startup_prewarm()')
          end = text.index('\n#[tokio::test', start)
          segment = text[start:end]
          replacements = [
              ('    skip_if_no_network!(Ok(()));\n', '    eprintln!("FIELDWORK_PHASE=entered_test");\n    skip_if_no_network!(Ok(()));\n'),
              ('    let server = start_websocket_server', '    eprintln!("FIELDWORK_PHASE=before_server");\n    let server = start_websocket_server'),
              ('    let mut model_info = lite_model_info();', '    eprintln!("FIELDWORK_PHASE=after_server");\n    let mut model_info = lite_model_info();'),
              ('    let test = test_codex()', '    eprintln!("FIELDWORK_PHASE=before_build");\n    let test = test_codex()'),
              ('    test.submit_turn_with_policy(', '    eprintln!("FIELDWORK_PHASE=after_build");\n    eprintln!("FIELDWORK_PHASE=before_submit");\n    test.submit_turn_with_policy('),
              ('    let connection = server.single_connection();', '    eprintln!("FIELDWORK_PHASE=after_submit");\n    let connection = server.single_connection();'),
              ('    assert_eq!(connection.len(), 3);', '    eprintln!("FIELDWORK_PHASE=before_assertions");\n    assert_eq!(connection.len(), 3);'),
          ]
          for old, new in replacements:
              if segment.count(old) != 1:
                  raise SystemExit(f'phase anchor changed: {old!r}')
              segment = segment.replace(old, new, 1)
          path.write_text(text[:start] + segment + text[end:], encoding='utf-8')
          PY
      - name: Format diagnostic source
        working-directory: codex-rs
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
      - name: Run full regression with phase output
        working-directory: codex-rs
        run: cargo test -p codex-core --test all websocket_first_responses_lite_turn_sends_full_manifest_after_startup_prewarm --locked -- --nocapture
