name: fieldwork-85-lite-trace-isolation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fieldwork-85-lite-trace-isolation.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  trace-disabled-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Apply Responses Lite candidate
        run: python3 .github/fieldwork/85_apply_lite_prewarm_full_first_turn.py
      - name: Add diagnostic trace-disable switch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('codex-rs/core/src/client.rs')
          text = path.read_text(encoding='utf-8')
          old = '''            let inference_trace_attempt = if warmup {
              // Prewarm sends `generate=false`; it is connection setup, not a
              // model inference attempt that should appear in rollout traces.
              InferenceTraceAttempt::disabled()
          } else {
              inference_trace.start_attempt()
          };
          '''.replace('          ', '')
          new = '''            let inference_trace_attempt = if warmup
              || std::env::var_os("FIELDWORK_DISABLE_WS_INFERENCE_TRACE").is_some()
          {
              // Diagnostic control: isolate full request serialization from transport.
              InferenceTraceAttempt::disabled()
          } else {
              inference_trace.start_attempt()
          };
          '''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit('inference trace attempt anchor changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Format diagnostic source
        working-directory: codex-rs
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
      - name: Run full test_codex control with WebSocket inference trace disabled
        working-directory: codex-rs
        env:
          FIELDWORK_DISABLE_WS_INFERENCE_TRACE: "1"
        run: cargo test -p codex-core --test all websocket_first_responses_lite_turn_sends_full_manifest_after_startup_prewarm --locked
