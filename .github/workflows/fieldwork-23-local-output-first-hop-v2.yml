name: fieldwork-23-local-output-first-hop-v2

on:
  pull_request:
    branches:
      - fieldwork/23-pinned-base
    paths:
      - .github/workflows/fieldwork-23-local-output-first-hop-v2.yml

permissions:
  contents: write

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/23-unified-exec-authoritative-transcript
          fetch-depth: 0
          persist-credentials: true
      - run: |
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
      - name: Move local retention before best-effort broadcast
        run: |
          python3 - <<'PY'
          from pathlib import Path

          process = Path('codex-rs/core/src/unified_exec/process.rs')
          text = process.read_text(encoding='utf-8')
          spawn_start = text.index('    pub(super) async fn spawn_with_channels(')
          task_start = text.index('    fn spawn_local_output_task(', spawn_start)
          spawn_segment = text[spawn_start:task_start]
          combiner = '        let output_rx = codex_utils_pty::combine_output_receivers(stdout_rx, stderr_rx);\n'
          if spawn_segment.count(combiner) != 1:
              raise SystemExit('local combiner line changed')
          spawn_segment = spawn_segment.replace(combiner, '', 1)
          call_old = '''        managed.output_task = Some(Self::spawn_local_output_task(
              output_rx,
              Arc::clone(&managed.output_buffer),
          '''.replace('          ', '')
          call_new = '''        managed.output_task = Some(Self::spawn_local_output_task(
              stdout_rx,
              stderr_rx,
              Arc::clone(&managed.output_buffer),
          '''.replace('          ', '')
          if spawn_segment.count(call_old) != 1:
              raise SystemExit('local output task call changed')
          spawn_segment = spawn_segment.replace(call_old, call_new, 1)
          text = text[:spawn_start] + spawn_segment + text[task_start:]

          task_start = text.index('    fn spawn_local_output_task(')
          task_end = text.index('\n    fn signal_exit(', task_start)
          replacement = '''    pub(super) fn spawn_local_output_task(
              mut stdout_receiver: tokio::sync::mpsc::Receiver<Vec<u8>>,
              mut stderr_receiver: tokio::sync::mpsc::Receiver<Vec<u8>>,
              buffer: OutputBuffer,
              completion_buffer: OutputBuffer,
              output_notify: Arc<Notify>,
              output_closed: Arc<AtomicBool>,
              output_closed_notify: Arc<Notify>,
              output_tx: broadcast::Sender<Vec<u8>>,
          ) -> JoinHandle<()> {
              tokio::spawn(async move {
                  let _output_task_guard = OutputTaskGuard {
                      output_closed: Arc::clone(&output_closed),
                      output_closed_notify: Arc::clone(&output_closed_notify),
                  };
                  let mut stdout_open = true;
                  let mut stderr_open = true;
                  while stdout_open || stderr_open {
                      let chunk = tokio::select! {
                          stdout = stdout_receiver.recv(), if stdout_open => match stdout {
                              Some(chunk) => Some(chunk),
                              None => {
                                  stdout_open = false;
                                  None
                              }
                          },
                          stderr = stderr_receiver.recv(), if stderr_open => match stderr {
                              Some(chunk) => Some(chunk),
                              None => {
                                  stderr_open = false;
                                  None
                              }
                          },
                      };
                      let Some(chunk) = chunk else {
                          continue;
                      };
                      Self::record_output_chunk(&buffer, &completion_buffer, &chunk).await;
                      let _ = output_tx.send(chunk);
                      output_notify.notify_waiters();
                  }
              })
          }
          '''.replace('          ', '')
          process.write_text(text[:task_start] + replacement + text[task_end:], encoding='utf-8')

          tests = Path('codex-rs/core/src/unified_exec/process_tests.rs')
          text = tests.read_text(encoding='utf-8')
          imports = '''use std::sync::atomic::AtomicBool;
          use std::sync::atomic::Ordering;
          use tokio::sync::Notify;
          use tokio::sync::broadcast;
          use tokio::sync::mpsc;
          '''.replace('          ', '')
          if 'use tokio::sync::broadcast;' not in text:
              text = text.replace('use std::sync::Arc;\n', 'use std::sync::Arc;\n' + imports, 1)
          test_name = 'local_output_task_retains_stdout_before_best_effort_broadcast'
          if test_name in text:
              raise SystemExit('local output saturation test already exists')
          test = '''
          #[tokio::test]
          async fn local_output_task_retains_stdout_before_best_effort_broadcast() {
              let (stdout_tx, stdout_rx) = mpsc::channel(512);
              let (stderr_tx, stderr_rx) = mpsc::channel(1);
              drop(stderr_tx);
              let buffer = Arc::new(Mutex::new(
                  crate::unified_exec::head_tail_buffer::HeadTailBuffer::default(),
              ));
              let completion_buffer = Arc::new(Mutex::new(
                  crate::unified_exec::head_tail_buffer::HeadTailBuffer::default(),
              ));
              let output_notify = Arc::new(Notify::new());
              let output_closed = Arc::new(AtomicBool::new(false));
              let output_closed_notify = Arc::new(Notify::new());
              let (output_tx, mut lagging_receiver) = broadcast::channel(1);
              let task = UnifiedExecProcess::spawn_local_output_task(
                  stdout_rx,
                  stderr_rx,
                  Arc::clone(&buffer),
                  Arc::clone(&completion_buffer),
                  output_notify,
                  Arc::clone(&output_closed),
                  output_closed_notify,
                  output_tx,
              );

              let mut expected = Vec::new();
              for index in 0..256 {
                  let chunk = format!("stdout-{index:04}\\n").into_bytes();
                  expected.extend_from_slice(&chunk);
                  stdout_tx.send(chunk).await.expect("send stdout chunk");
              }
              drop(stdout_tx);
              task.await.expect("local output task should finish");

              assert!(output_closed.load(Ordering::Acquire));
              assert!(matches!(
                  lagging_receiver.recv().await,
                  Err(broadcast::error::RecvError::Lagged(_))
              ));
              assert_eq!(buffer.lock().await.total_bytes(), expected.len());
              assert_eq!(completion_buffer.lock().await.total_bytes(), expected.len());
              assert_eq!(
                  completion_buffer.lock().await.to_bytes_with_omission_marker(),
                  expected
              );
          }
          '''.replace('          ', '')
          tests.write_text(text + test, encoding='utf-8')
          PY
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Execute focused unified-exec controls
        run: |
          rustfmt --edition 2024 \
            codex-rs/core/src/unified_exec/process.rs \
            codex-rs/core/src/unified_exec/process_tests.rs
          rustfmt --edition 2024 --check \
            codex-rs/core/src/unified_exec/process.rs \
            codex-rs/core/src/unified_exec/process_tests.rs
          cd codex-rs
          cargo test -p codex-core --lib local_output_task_retains_stdout_before_best_effort_broadcast --locked
          cargo test -p codex-core --lib completed_item_includes_output_emitted_before_subscription --locked
          cargo test -p codex-core --lib reconcile_transcript_replaces_partial_stream_with_authoritative_output --locked
      - name: Publish source-only head
        run: |
          rm -f .github/workflows/fieldwork-23-local-output-first-hop.yml
          rm -f .github/workflows/fieldwork-23-local-output-first-hop-v2.yml
          git diff --check
          git add -A
          git commit -m 'core: retain local exec output before broadcast'
          git push origin HEAD:fieldwork/23-unified-exec-authoritative-transcript
