name: fieldwork-83-current-upstream-append-outcome-v2

# Head-only trigger marker: schema-correct exact pass 2.
on:
  pull_request:
    branches:
      - fieldwork/upstream-b545-append-outcome-v2-base
    paths:
      - .github/workflows/fieldwork-83-current-upstream-append-outcome-v2.yml
      - .github/fieldwork/83_apply_append_outcome_current_upstream.py

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: true
          fetch-depth: 0
      - run: |
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
      - name: Apply append outcome prerequisite
        run: |
          git fetch origin f7265553ea1510304f3091833dcbce65ef21f10c a0ab863c8d9f90fd9bd284cc6b31049e2579da51
          git diff --binary f7265553ea1510304f3091833dcbce65ef21f10c a0ab863c8d9f90fd9bd284cc6b31049e2579da51 -- codex-rs/thread-store/src/in_memory.rs > /tmp/store.patch
          git apply --3way /tmp/store.patch
          python3 .github/fieldwork/83_apply_append_outcome_current_upstream.py
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Format and verify candidate
        working-directory: codex-rs
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
      - name: Resolve and run four exact append controls
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test -p codex-core --lib --locked -- --list > /tmp/tests.list
          suffixes=(
            append_outcome_ephemeral_history_is_authoritative
            append_outcome_reports_successful_live_append
            append_outcome_reports_prewrite_failure
            append_outcome_reports_commit_then_error_as_failure
          )
          executed=0
          for suffix in "${suffixes[@]}"; do
            mapfile -t matches < <(sed -n 's/: test$//p' /tmp/tests.list | grep "${suffix}$")
            printf '%s matches: %s\n' "$suffix" "${matches[*]:-<none>}"
            test "${#matches[@]}" -eq 1
            cargo test -p codex-core --lib --locked "${matches[0]}" -- --exact --nocapture
            executed=$((executed + 1))
          done
          test "$executed" -eq 4
          echo 'FIELDWORK_APPEND_OUTCOME_EXACT=4/4'
      - name: Run thread-store package tests
        working-directory: codex-rs
        run: cargo test -p codex-thread-store --locked
      - name: Publish source-only current-upstream prerequisite
        run: |
          git diff HEAD -- \
            codex-rs/core/src/session/mod.rs \
            codex-rs/core/src/session/turn_tests.rs \
            codex-rs/thread-store/src/in_memory.rs > /tmp/source.patch
          test -s /tmp/source.patch
          git reset --hard HEAD
          git checkout -B publish b545c94041017d000e2c8b2f6272705d21b85dfb
          git apply /tmp/source.patch
          git diff --check
          git add \
            codex-rs/core/src/session/mod.rs \
            codex-rs/core/src/session/turn_tests.rs \
            codex-rs/thread-store/src/in_memory.rs
          git commit -m 'core: propagate rollout append outcomes'
          git push --force origin HEAD:fieldwork/83-append-outcome-current-upstream
