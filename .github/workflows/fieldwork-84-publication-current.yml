name: fieldwork-84-publication-current

on:
  pull_request:
    branches:
      - fieldwork/84-publication-carrier-base-97576
    paths:
      - .github/workflows/fieldwork-84-publication-current.yml

permissions:
  contents: read

concurrency:
  group: fieldwork-84-publication-current
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact publication source head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 84b191c66d00ee95a840fb389df0b06f3558f615
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Verify one-file source fence
        run: |
          set -euo pipefail
          actual="$(git diff --name-only 97576b1794872e342450ebd577123e052ab57626 HEAD)"
          test "$actual" = 'codex-rs/codex-mcp/src/runtime.rs'
          git diff --check 97576b1794872e342450ebd577123e052ab57626 HEAD

      - name: Format and run exact publication controls
        working-directory: codex-rs
        env:
          RUST_MIN_STACK: 16777216
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          mapfile -t tests < <(cargo test -p codex-mcp --lib --locked -- --list | grep 'publication_' | cut -d: -f1)
          test "${#tests[@]}" -eq 5
          for test_name in "${tests[@]}"; do
            cargo test -p codex-mcp --lib --locked "$test_name" -- --exact
          done
