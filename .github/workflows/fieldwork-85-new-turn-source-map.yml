name: fieldwork-85-new-turn-source-map

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fieldwork-85-new-turn-source-map.yml

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Locate new-turn implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          needle = 'new_turn_with_sub_id'
          matches = []
          for path in Path('codex-rs/core/src').rglob('*.rs'):
              text = path.read_text(encoding='utf-8')
              for index in range(text.count(needle)):
                  pass
              if needle in text:
                  matches.append((path, text))

          print(f'FIELDWORK_SOURCE_MAP=files:{len(matches)}')
          for path, text in matches:
              print(f'FIELDWORK_SOURCE_MAP=path:{path}')
              positions = []
              start = 0
              while True:
                  pos = text.find(needle, start)
                  if pos < 0:
                      break
                  positions.append(pos)
                  start = pos + len(needle)
              for pos in positions:
                  line = text.count('\n', 0, pos) + 1
                  print(f'FIELDWORK_SOURCE_MAP=occurrence:{path}:{line}')
                  fn_start = text.rfind('\n', 0, pos) + 1
                  brace = text.find('{', pos)
                  if brace < 0:
                      continue
                  depth = 0
                  fn_end = None
                  for i in range(brace, len(text)):
                      if text[i] == '{':
                          depth += 1
                      elif text[i] == '}':
                          depth -= 1
                          if depth == 0:
                              fn_end = i + 1
                              break
                  if fn_end is None:
                      continue
                  snippet = text[fn_start:fn_end]
                  print('FIELDWORK_SOURCE_MAP=begin')
                  print(snippet)
                  print('FIELDWORK_SOURCE_MAP=end')
          if not matches:
              raise SystemExit('new_turn_with_sub_id symbol not found')
          PY
