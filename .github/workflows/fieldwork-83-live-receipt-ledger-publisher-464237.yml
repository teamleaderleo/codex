name: fieldwork-83-live-receipt-ledger-publisher-464237

on:
  pull_request:
    branches:
      - fieldwork/83-tool-effect-fmt-464237
    paths:
      - .github/fieldwork/83_live_receipt_ledger.py
      - .github/workflows/fieldwork-83-live-receipt-ledger-publisher-464237.yml

permissions:
  contents: write

concurrency:
  group: fieldwork-83-live-receipt-ledger-publisher-464237
  cancel-in-progress: true

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact publisher carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify publisher identity
        env:
          SOURCE_HEAD: b76d46832f8426cb8acb4031b00f41069c7d7014
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$SOURCE_HEAD")" = "$SOURCE_HEAD"
          actual="$(git diff --name-only "$SOURCE_HEAD" HEAD | sort)"
          expected="$(printf '%s\n' .github/fieldwork/83_live_receipt_ledger.py .github/workflows/fieldwork-83-live-receipt-ledger-publisher-464237.yml | sort)"
          test "$actual" = "$expected"
          echo "FIELDWORK_LIVE_LEDGER_PUBLISHER_HEAD=$(git rev-parse HEAD)"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply live-ledger source and verify fence
        env:
          SOURCE_HEAD: b76d46832f8426cb8acb4031b00f41069c7d7014
        run: |
          set -euo pipefail
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
          cp .github/fieldwork/83_live_receipt_ledger.py /tmp/83_live_receipt_ledger.py
          git switch --detach "$SOURCE_HEAD"
          python /tmp/83_live_receipt_ledger.py
          (cd codex-rs && cargo fmt --all)
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            codex-rs/core/src/session/mod.rs \
            codex-rs/core/src/session/tool_operation.rs \
            codex-rs/core/src/state/mod.rs \
            codex-rs/core/src/state/session.rs \
            codex-rs/core/src/state/tool_operation_receipts.rs | sort)"
          test "$actual" = "$expected"
          printf 'FIELDWORK_LIVE_LEDGER_SOURCE_FILES\n%s\n' "$actual"

      - name: Run nine exact live-ledger controls
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test -p codex-core --lib --locked -- --list > /tmp/live-ledger-tests.list
          suffixes=(
            potential_mutation_reconciles_after_terminal_and_result
            direct_and_code_mode_identities_coexist
            duplicate_persistence_remains_ambiguous
            conflicting_terminal_outcomes_remain_ambiguous
            repeated_begin_escalates_identity_to_ambiguous_mutation
            late_observation_defaults_to_potential_mutation
            read_only_receipt_does_not_block_mutation_preflight
            overflow_sets_coverage_lost_without_eviction
            invalid_identity_sets_coverage_lost
          )
          executed=0
          for suffix in "${suffixes[@]}"; do
            mapfile -t matches < <(sed -n 's/: test$//p' /tmp/live-ledger-tests.list | grep "${suffix}$")
            printf '%s matches: %s\n' "$suffix" "${matches[*]:-<none>}"
            test "${#matches[@]}" -eq 1
            cargo test -p codex-core --lib --locked "${matches[0]}" -- --exact --nocapture
            executed=$((executed + 1))
          done
          test "$executed" -eq 9
          echo 'FIELDWORK_LIVE_RECEIPT_LEDGER_EXACT=9/9'

      - name: Compile core library
        working-directory: codex-rs
        run: cargo check -p codex-core --lib --locked

      - name: Publish clean source branch
        env:
          SOURCE_BRANCH: fieldwork/83-live-receipt-ledger-464237
        run: |
          set -euo pipefail
          git add codex-rs/core/src/session/mod.rs codex-rs/core/src/session/tool_operation.rs codex-rs/core/src/state/mod.rs codex-rs/core/src/state/session.rs codex-rs/core/src/state/tool_operation_receipts.rs
          git commit -m 'core: add session-scoped tool operation receipt ledger'
          git switch -C "$SOURCE_BRANCH"
          git push --force origin "HEAD:refs/heads/$SOURCE_BRANCH"
          echo "FIELDWORK_LIVE_LEDGER_SOURCE_HEAD=$(git rev-parse HEAD)"
          echo 'FIELDWORK_LIVE_LEDGER_SOURCE_BASE=b76d46832f8426cb8acb4031b00f41069c7d7014'
