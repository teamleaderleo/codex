name: Fieldwork operation effect delegation

on:
  push:
    branches:
      - fieldwork/83-effect-delegation

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/83-effect-delegation
          fetch-depth: 0

      - name: Apply bounded delegation patch and regression
        shell: python
        run: |
          from pathlib import Path

          registry_path = Path("codex-rs/core/src/tools/registry.rs")
          registry = registry_path.read_text(encoding="utf-8")
          old_import = '''use codex_tools::ToolName;
          use codex_tools::ToolSearchInfo;
          '''
          new_import = '''use codex_tools::ToolName;
          use codex_tools::ToolOperationEffect;
          use codex_tools::ToolSearchInfo;
          '''
          if old_import not in registry:
              raise SystemExit("registry import anchor not found exactly")
          registry = registry.replace(old_import, new_import, 1)

          old_delegate = '''    fn exposure(&self) -> ToolExposure {
                  self.exposure
              }

              fn supports_parallel_tool_calls(&self) -> bool {
          '''
          new_delegate = '''    fn exposure(&self) -> ToolExposure {
                  self.exposure
              }

              fn operation_effect(&self) -> ToolOperationEffect {
                  self.handler.operation_effect()
              }

              fn supports_parallel_tool_calls(&self) -> bool {
          '''
          if old_delegate not in registry:
              raise SystemExit("ExposureOverride delegation anchor not found exactly")
          registry_path.write_text(registry.replace(old_delegate, new_delegate, 1), encoding="utf-8")

          tests_path = Path("codex-rs/core/src/tools/registry_tests.rs")
          tests = tests_path.read_text(encoding="utf-8")
          old_handler = '''impl CoreToolRuntime for TestHandler {}

          #[derive(Clone)]
          '''
          new_handler = '''impl CoreToolRuntime for TestHandler {}

          struct ReadOnlyTestHandler {
              tool_name: codex_tools::ToolName,
          }

          impl ToolExecutor<ToolInvocation> for ReadOnlyTestHandler {
              fn tool_name(&self) -> codex_tools::ToolName {
                  self.tool_name.clone()
              }

              fn spec(&self) -> codex_tools::ToolSpec {
                  test_spec(&self.tool_name)
              }

              fn operation_effect(&self) -> codex_tools::ToolOperationEffect {
                  codex_tools::ToolOperationEffect::ReadOnly
              }

              fn handle(&self, _invocation: ToolInvocation) -> codex_tools::ToolExecutorFuture<'_> {
                  Box::pin(async {
                      Ok(
                          Box::new(crate::tools::context::FunctionToolOutput::from_text(
                              "ok".to_string(),
                              Some(true),
                          )) as Box<dyn crate::tools::context::ToolOutput>,
                      )
                  })
              }
          }

          impl CoreToolRuntime for ReadOnlyTestHandler {}

          #[derive(Clone)]
          '''
          if old_handler not in tests:
              raise SystemExit("registry test handler anchor not found exactly")
          tests = tests.replace(old_handler, new_handler, 1)

          test_anchor = '''#[tokio::test]
          async fn function_tools_expose_default_hook_payloads_and_rewrites() -> anyhow::Result<()> {
          '''
          regression = '''#[test]
          fn exposure_override_preserves_operation_effect() {
              let tool_name = codex_tools::ToolName::plain("read_only");
              let handler = Arc::new(ReadOnlyTestHandler {
                  tool_name: tool_name.clone(),
              });

              let overridden = override_tool_exposure(handler, ToolExposure::Hidden);

              assert_eq!(
                  overridden.operation_effect(),
                  codex_tools::ToolOperationEffect::ReadOnly
              );
          }

          #[tokio::test]
          async fn function_tools_expose_default_hook_payloads_and_rewrites() -> anyhow::Result<()> {
          '''
          if test_anchor not in tests:
              raise SystemExit("registry test insertion anchor not found exactly")
          tests_path.write_text(tests.replace(test_anchor, regression, 1), encoding="utf-8")

          Path(".github/workflows/fieldwork-effect-delegation.yml").unlink()

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: nextest

      - name: Format Rust
        working-directory: codex-rs
        run: |
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Test effect delegation regression
        working-directory: codex-rs
        run: cargo nextest run -p codex-core exposure_override_preserves_operation_effect --no-fail-fast

      - name: Commit validated patch
        run: |
          git config user.name "fieldwork-ci"
          git config user.email "fieldwork-ci@users.noreply.github.com"
          git add codex-rs/core/src/tools/registry.rs codex-rs/core/src/tools/registry_tests.rs .github/workflows/fieldwork-effect-delegation.yml
          git commit -m "fix(tools): preserve operation effect through exposure overrides"
          git push origin HEAD:fieldwork/83-effect-delegation
