name: Fieldwork append acknowledgement current materializer

on:
  pull_request:
    paths:
      - ".github/workflows/fieldwork-append-ack-current.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fieldwork-append-ack-current-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact public source
        uses: actions/checkout@v4
        with:
          ref: 2b5bdcf67547860f2e5c5a605009a70026796b2b
          fetch-depth: 0

      - name: Fetch reviewed predecessor
        run: git fetch origin fix/session-durable-append-acknowledgement

      - name: Compose current three-file candidate
        shell: bash
        run: |
          set -euo pipefail
          git show origin/fix/session-durable-append-acknowledgement:codex-rs/core/src/session/turn_tests.rs \
            > codex-rs/core/src/session/turn_tests.rs
          git show origin/fix/session-durable-append-acknowledgement:codex-rs/thread-store/src/in_memory.rs \
            > codex-rs/thread-store/src/in_memory.rs

          python3 - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/core/src/session/mod.rs")
          source = path.read_text()
          replacements = [
              (
                  """    pub(crate) async fn record_conversation_items(
                  &self,
                  turn_context: &TurnContext,
                  items: &[ResponseItem],
              ) {
          """,
                  """    pub(crate) async fn record_conversation_items(
                  &self,
                  turn_context: &TurnContext,
                  items: &[ResponseItem],
              ) -> bool {
          """,
              ),
              (
                  """        self.persist_rollout_response_items(items).await;
                  self.send_raw_response_items(turn_context, items).await;
              }
          """,
                  """        let persisted = self.persist_rollout_response_items(items).await;
                  self.send_raw_response_items(turn_context, items).await;
                  persisted
              }
          """,
              ),
              (
                  """    async fn persist_rollout_response_items(&self, items: &[ResponseItem]) {
                  let rollout_items: Vec<RolloutItem> = items
                      .iter()
                      .cloned()
                      .map(RolloutItem::ResponseItem)
                      .collect();
                  self.persist_rollout_items(&rollout_items).await;
              }
          """,
                  """    async fn persist_rollout_response_items(&self, items: &[ResponseItem]) -> bool {
                  let rollout_items: Vec<RolloutItem> = items
                      .iter()
                      .cloned()
                      .map(RolloutItem::ResponseItem)
                      .collect();
                  self.persist_rollout_items_checked(&rollout_items).await
              }
          """,
              ),
              (
                  """    #[tracing::instrument(level = \"trace\", skip_all, fields(item_count = items.len()))]
              pub(crate) async fn persist_rollout_items(&self, items: &[RolloutItem]) {
                  if let Some(live_thread) = self.live_thread()
                      && let Err(e) = live_thread.append_items(items).await
                  {
                      error!(\"failed to record rollout items: {e:#}\");
                  }
              }
          """,
                  """    #[tracing::instrument(level = \"trace\", skip_all, fields(item_count = items.len()))]
              pub(crate) async fn persist_rollout_items(&self, items: &[RolloutItem]) {
                  let _ = self.persist_rollout_items_checked(items).await;
              }

              async fn persist_rollout_items_checked(&self, items: &[RolloutItem]) -> bool {
                  let Some(live_thread) = self.live_thread() else {
                      return true;
                  };
                  if let Err(e) = live_thread.append_items(items).await {
                      error!(\"failed to record rollout items: {e:#}\");
                      return false;
                  }
                  true
              }
          """,
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected one exact replacement, found {count}: {old.splitlines()[0]!r}")
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY

          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            codex-rs/core/src/session/mod.rs \
            codex-rs/core/src/session/turn_tests.rs \
            codex-rs/thread-store/src/in_memory.rs | sort)"

      - name: Format and run focused gates
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p codex-core append_outcome --locked
          cargo test -p codex-thread-store --locked

      - name: Verify exact diff after tests
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain --untracked-files=normal | grep -vE '^ M (codex-rs/core/src/session/mod.rs|codex-rs/core/src/session/turn_tests.rs|codex-rs/thread-store/src/in_memory.rs)$' || true)"

      - name: Publish clean current source branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B fix/session-durable-append-acknowledgement-current
          git add \
            codex-rs/core/src/session/mod.rs \
            codex-rs/core/src/session/turn_tests.rs \
            codex-rs/thread-store/src/in_memory.rs
          git commit -m "fix(core): expose current durable append acknowledgement"
          git push origin HEAD:refs/heads/fix/session-durable-append-acknowledgement-current --force-with-lease
