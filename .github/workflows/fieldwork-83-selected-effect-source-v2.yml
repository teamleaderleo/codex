name: Fieldwork 83 selected effect source v2

on:
  push:
    branches:
      - fieldwork/83-selected-effect-terminal-closure

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/83-selected-effect-terminal-closure
          fetch-depth: 0
      - name: Configure validation identity
        run: |
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
      - name: Apply corrected source candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/fieldwork-83-selected-effect-source.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == 'from pathlib import Path')
          stop = next(
              i for i, line in enumerate(source[start:], start)
              if line.strip() == "Path('.fieldwork-83-selected-effect-trigger').unlink(missing_ok=True)"
          )
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in source[start:stop + 1]
          )
          Path('/tmp/fieldwork-83-selected-effect.py').write_text(script + '\n')
          PY
          python3 /tmp/fieldwork-83-selected-effect.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('codex-rs/core/src/tools/registry_tests.rs')
          text = path.read_text()
          old = '.await\n        .expect_err('
          new = '.await\n        .err()\n        .expect('
          if text.count(old) != 2:
              raise SystemExit(f'expected two error assertions, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          for temporary in [
              '.github/workflows/fieldwork-83-selected-effect-source.yml',
              '.github/workflows/fieldwork-83-selected-effect-source-v2.yml',
              '.github/workflows/fieldwork-83-selected-effect-pr.yml',
              '.fieldwork-83-selected-effect-trigger',
          ]:
              Path(temporary).unlink(missing_ok=True)
          PY
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Format and run focused tests
        run: |
          rustfmt --edition 2024 codex-rs/core/src/tools/lifecycle.rs codex-rs/core/src/tools/registry.rs codex-rs/core/src/tools/registry_tests.rs
          rustfmt --edition 2024 --check codex-rs/core/src/tools/lifecycle.rs codex-rs/core/src/tools/registry.rs codex-rs/core/src/tools/registry_tests.rs
          cd codex-rs
          cargo test -p codex-core --lib receipt_before_dispatch --locked
          cargo test -p codex-core --lib dispatch_notifies_tool_lifecycle_contributors --locked
          cargo test -p codex-core --lib tools::lifecycle::tests --locked
      - name: Verify patch hygiene
        run: git diff --check
      - name: Commit validated source
        run: |
          git add -A
          git commit -m 'core: begin tool receipts from selected runtime before dispatch'
          git push origin HEAD:fieldwork/83-selected-effect-terminal-closure
