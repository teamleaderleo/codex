name: Fieldwork 83 mutation identity bootstrap

on:
  push:
    branches:
      - fieldwork/83-compaction-mutation-identity

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install repository test commands
        run: |
          command -v just >/dev/null || cargo install just --locked
          cargo nextest --version >/dev/null 2>&1 || cargo install cargo-nextest --locked

      - name: Apply bounded candidate
        run: python3 .github/fieldwork/83_apply.py

      - name: Format
        run: just fmt

      - name: Run focused codex-core tests
        run: just test -p codex-core call_result_identity

      - name: Check diff
        run: git diff --check

      - name: Commit validated candidate
        run: |
          rm .github/fieldwork/83_apply.py
          rm .github/workflows/fieldwork-83-bootstrap.yml
          rmdir .github/fieldwork 2>/dev/null || true
          git config user.name "teamleaderleo"
          git config user.email "13091533+teamleaderleo@users.noreply.github.com"
          git add codex-rs/core/src .github
          git commit -m "core: block compaction on ambiguous tool results"
          git push origin HEAD:fieldwork/83-compaction-mutation-identity
