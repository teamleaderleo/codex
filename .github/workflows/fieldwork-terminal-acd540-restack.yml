name: fieldwork-terminal-acd540-restack

on:
  pull_request:
    branches:
      - fieldwork/upstream-acd540-terminal-restack-base
    paths:
      - .github/workflows/fieldwork-terminal-acd540-restack.yml

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  UPSTREAM_HEAD: acd540f1581bf30f963fccbcce43ac494102242c
  HISTORICAL_SOURCE: 7db66fe3f235df77c36a9db521677e23379bcac5
  SOURCE_BRANCH: fieldwork/23-terminal-acd540-source

jobs:
  restack-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ env.UPSTREAM_HEAD }}
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Restack historical source and preserve current source work
        run: |
          set -euo pipefail
          git config user.name fieldwork-bot
          git config user.email fieldwork-bot@users.noreply.github.com

          if ! git cherry-pick "$HISTORICAL_SOURCE"; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            printf 'conflicts:\n%s\n' "${conflicts[*]:-<none>}"
            expected=(
              codex-rs/core/src/unified_exec/async_watcher.rs
              codex-rs/core/src/unified_exec/process_tests.rs
            )
            test "${#conflicts[@]}" -eq "${#expected[@]}"
            test "${conflicts[0]}" = "${expected[0]}"
            test "${conflicts[1]}" = "${expected[1]}"
            git checkout --theirs -- codex-rs/core/src/unified_exec/async_watcher.rs
            git checkout --ours -- codex-rs/core/src/unified_exec/process_tests.rs
            git add "${expected[@]}"
            GIT_EDITOR=true git cherry-pick --continue
          fi

          python3 <<'PY'
          from pathlib import Path

          watcher = Path('codex-rs/core/src/unified_exec/async_watcher.rs')
          text = watcher.read_text()
          assert 'use std::collections::VecDeque;' not in text
          text = text.replace(
              'use std::pin::Pin;',
              'use std::collections::VecDeque;\nuse std::pin::Pin;',
              1,
          )
          text = text.replace(
              'let mut pending = Vec::<u8>::new();',
              'let mut pending = VecDeque::<u8>::new();',
              1,
          )
          text = text.replace('pending: &mut Vec<u8>,', 'pending: &mut VecDeque<u8>,', 1)
          text = text.replace('pending.extend_from_slice(&chunk);', 'pending.extend(chunk);', 1)
          start = text.index('fn split_valid_utf8_prefix(')
          end = text.index('async fn resolve_aggregated_output', start)
          replacement = '''fn split_valid_utf8_prefix(buffer: &mut VecDeque<u8>) -> Option<Vec<u8>> {
              split_valid_utf8_prefix_with_max(buffer, UNIFIED_EXEC_OUTPUT_DELTA_MAX_BYTES)
          }

          fn split_valid_utf8_prefix_with_max(
              buffer: &mut VecDeque<u8>,
              max_bytes: usize,
          ) -> Option<Vec<u8>> {
              if buffer.is_empty() {
                  return None;
              }

              let max_len = buffer.len().min(max_bytes);
              let split = match std::str::from_utf8(&buffer.make_contiguous()[..max_len]) {
                  Ok(_) => max_len,
                  Err(error) => error.valid_up_to().max(1),
              };
              Some(buffer.drain(..split).collect())
          }

          '''
          text = text[:start] + replacement + text[end:]
          watcher.write_text(text)

          watcher_tests = Path('codex-rs/core/src/unified_exec/async_watcher_tests.rs')
          text = watcher_tests.read_text()
          required = (
              'use std::collections::VecDeque;',
              'completed_item_includes_output_emitted_before_subscription',
              'reconcile_transcript_replaces_partial_stream_with_authoritative_output',
              'split_valid_utf8_prefix_consumes_all_valid_bytes_before_invalid_utf8',
              'split_invalid_utf8_advances_without_shifting_remaining_bytes',
          )
          for marker in required:
              assert marker in text, marker

          process = Path('codex-rs/core/src/unified_exec/process.rs')
          text = process.read_text()
          assert 'pub(super) fn spawn_local_output_task(' in text
          text = text.replace(
              'pub(super) fn spawn_local_output_task(',
              'fn spawn_local_output_task(',
              1,
          )
          process.write_text(text)

          process_tests = Path('codex-rs/core/src/unified_exec/process_tests.rs')
          text = process_tests.read_text()
          assert 'local_output_task_retains_stdout_before_best_effort_broadcast' not in text
          text = text.replace(
              'use super::process::UnifiedExecProcess;\n',
              'use super::process::NoopSpawnLifecycle;\nuse super::process::UnifiedExecProcess;\n',
              1,
          )
          text = text.replace(
              'use codex_exec_server::WriteStatus;\n',
              'use codex_exec_server::WriteStatus;\nuse codex_utils_pty::ProcessDriver;\nuse codex_utils_pty::spawn_from_driver;\n',
              1,
          )
          text = text.replace(
              'use std::sync::Arc;\n',
              'use std::sync::Arc;\nuse std::sync::atomic::Ordering;\nuse std::time::Duration;\n',
              1,
          )
          text = text.replace(
              'use tokio::sync::Mutex;\n',
              'use tokio::sync::Mutex;\nuse tokio::sync::broadcast;\nuse tokio::sync::mpsc;\nuse tokio::sync::oneshot;\n',
              1,
          )
          text += r'''

          async fn local_output_process() -> (
              UnifiedExecProcess,
              broadcast::Sender<Vec<u8>>,
              oneshot::Sender<i32>,
          ) {
              let (writer_tx, _writer_rx) = mpsc::channel(1);
              let (stdout_tx, stdout_rx) = broadcast::channel(512);
              let (exit_tx, exit_rx) = oneshot::channel();
              let spawned = spawn_from_driver(ProcessDriver {
                  writer_tx,
                  stdout_rx,
                  stderr_rx: None,
                  exit_rx,
                  terminator: None,
                  writer_handle: None,
                  resizer: None,
              });
              let process = UnifiedExecProcess::from_spawned(
                  spawned,
                  codex_sandboxing::SandboxType::None,
                  Box::new(NoopSpawnLifecycle),
              )
              .await
              .expect("driver-backed local process should start");
              (process, stdout_tx, exit_tx)
          }

          async fn wait_for_local_output_close(process: &UnifiedExecProcess) {
              let output_handles = process.output_handles();
              tokio::time::timeout(Duration::from_secs(5), async {
                  while !output_handles.output_closed.load(Ordering::Acquire) {
                      tokio::task::yield_now().await;
                  }
              })
              .await
              .expect("local output task should close");
          }

          #[tokio::test]
          async fn local_output_task_retains_stdout_before_best_effort_broadcast() {
              let (process, stdout_tx, exit_tx) = local_output_process().await;
              let mut lagging_receiver = process.output_receiver();
              let mut expected = Vec::new();
              for index in 0..256 {
                  let chunk = format!("stdout-{index:04}\n").into_bytes();
                  expected.extend_from_slice(&chunk);
                  stdout_tx.send(chunk).expect("send stdout chunk");
              }
              drop(stdout_tx);
              exit_tx.send(0).expect("send exit code");
              wait_for_local_output_close(&process).await;

              assert!(matches!(
                  lagging_receiver.recv().await,
                  Err(broadcast::error::RecvError::Lagged(_))
              ));
              let output_handles = process.output_handles();
              assert_eq!(
                  output_handles.output_buffer.lock().await.total_bytes(),
                  expected.len()
              );
              assert_eq!(process.completion_buffer().lock().await.total_bytes(), expected.len());
              assert_eq!(
                  process
                      .completion_buffer()
                      .lock()
                      .await
                      .to_bytes_with_omission_marker(),
                  expected
              );
          }

          #[tokio::test]
          async fn local_output_task_retains_invalid_utf8_when_broadcast_lags() {
              let (process, stdout_tx, exit_tx) = local_output_process().await;
              let mut lagging_receiver = process.output_receiver();
              let mut expected = Vec::new();
              for index in 0..256 {
                  let chunk = vec![0xff, (index % 251) as u8, b'\n'];
                  expected.extend_from_slice(&chunk);
                  stdout_tx.send(chunk).expect("send invalid UTF-8 chunk");
              }
              drop(stdout_tx);
              exit_tx.send(0).expect("send exit code");
              wait_for_local_output_close(&process).await;

              assert!(matches!(
                  lagging_receiver.recv().await,
                  Err(broadcast::error::RecvError::Lagged(_))
              ));
              assert_eq!(
                  process
                      .completion_buffer()
                      .lock()
                      .await
                      .to_bytes_with_omission_marker(),
                  expected
              );
          }
          '''
          process_tests.write_text(text)
          PY

          git reset --soft "$UPSTREAM_HEAD"
          git add codex-rs/core/src/unified_exec/process.rs \
                  codex-rs/core/src/unified_exec/process_tests.rs \
                  codex-rs/core/src/unified_exec/async_watcher.rs \
                  codex-rs/core/src/unified_exec/async_watcher_tests.rs
          git commit -m 'core: retain terminal output before best-effort delivery'

      - name: Verify source fence and format
        run: |
          set -euo pipefail
          git diff --check "$UPSTREAM_HEAD"...HEAD
          git diff --name-only "$UPSTREAM_HEAD"...HEAD | sort > /tmp/source-files
          cat /tmp/source-files
          cat > /tmp/expected-files <<'EOF'
          codex-rs/core/src/unified_exec/async_watcher.rs
          codex-rs/core/src/unified_exec/async_watcher_tests.rs
          codex-rs/core/src/unified_exec/process.rs
          codex-rs/core/src/unified_exec/process_tests.rs
          EOF
          diff -u /tmp/expected-files /tmp/source-files
          cd codex-rs
          just fmt
          cd ..
          git add codex-rs/core/src/unified_exec/process.rs \
                  codex-rs/core/src/unified_exec/process_tests.rs \
                  codex-rs/core/src/unified_exec/async_watcher.rs \
                  codex-rs/core/src/unified_exec/async_watcher_tests.rs
          git commit --amend --no-edit
          git diff --check "$UPSTREAM_HEAD"...HEAD

      - name: Execute exact terminal and deque controls
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test -p codex-core --lib --locked -- --list > /tmp/tests.list
          suffixes=(
            local_output_task_retains_stdout_before_best_effort_broadcast
            local_output_task_retains_invalid_utf8_when_broadcast_lags
            completed_item_includes_output_emitted_before_subscription
            reconcile_transcript_replaces_partial_stream_with_authoritative_output
            split_valid_utf8_prefix_respects_max_bytes_for_ascii
            split_valid_utf8_prefix_avoids_splitting_utf8_codepoints
            split_valid_utf8_prefix_makes_progress_on_invalid_utf8
            split_valid_utf8_prefix_consumes_all_valid_bytes_before_invalid_utf8
            split_invalid_utf8_advances_without_shifting_remaining_bytes
          )
          for suffix in "${suffixes[@]}"; do
            mapfile -t matches < <(sed -n 's/: test$//p' /tmp/tests.list | grep "${suffix}$")
            printf '%s matches: %s\n' "$suffix" "${matches[*]:-<none>}"
            test "${#matches[@]}" -eq 1
            cargo test -p codex-core --lib --locked "${matches[0]}" -- --exact --nocapture
          done
          echo 'FIELDWORK_TERMINAL_ACD540_EXACT=9/9'

      - name: Execute focused codex-core target gate
        working-directory: codex-rs
        run: just test -p codex-core

      - name: Publish source-only branch
        run: |
          set -euo pipefail
          test "$(git diff --name-only "$UPSTREAM_HEAD"...HEAD | wc -l)" -eq 4
          git push --force origin "HEAD:refs/heads/$SOURCE_BRANCH"
          echo "FIELDWORK_SOURCE_HEAD=$(git rev-parse HEAD)"
          echo "FIELDWORK_SOURCE_BASE=$UPSTREAM_HEAD"
