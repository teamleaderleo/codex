name: fieldwork-84-reconnect-appserver

on:
  pull_request:
    branches:
      - fieldwork/84-reconnect-appserver-carrier-base-97576
    paths:
      - .github/fieldwork/84_reconnect_appserver.py
      - .github/workflows/fieldwork-84-reconnect-appserver.yml

permissions:
  contents: write

concurrency:
  group: fieldwork-84-reconnect-appserver
  cancel-in-progress: true

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure validation identity
        run: |
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
          echo "FIELDWORK_MCP_RECONNECT_CARRIER_HEAD=$(git rev-parse HEAD)"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply reconnect candidate and app-server control
        env:
          CURRENT_BASE: 97576b1794872e342450ebd577123e052ab57626
          RECONNECT_HEAD: bd6fc6634f03efffb7590b6c1954acb198cf900c
        run: |
          set -euo pipefail
          cp .github/fieldwork/84_reconnect_appserver.py /tmp/84_reconnect_appserver.py
          git diff --binary "$CURRENT_BASE" "$RECONNECT_HEAD" -- \
            codex-rs/core/src/codex_thread.rs \
            codex-rs/core/tests/suite/mcp_tool_exposure.rs \
            > /tmp/reconnect.patch
          test -s /tmp/reconnect.patch
          git switch --detach "$CURRENT_BASE"
          git apply --3way --index /tmp/reconnect.patch
          python /tmp/84_reconnect_appserver.py
          git diff --check

      - name: Format and verify exact source fence
        env:
          CURRENT_BASE: 97576b1794872e342450ebd577123e052ab57626
        run: |
          set -euo pipefail
          cd codex-rs
          cargo fmt --all
          cargo fmt --all -- --check
          cd ..
          actual="$(git diff --name-only "$CURRENT_BASE" | sort)"
          expected="$(printf '%s\n' \
            codex-rs/app-server/tests/suite/v2/mcp_tool.rs \
            codex-rs/core/src/codex_thread.rs \
            codex-rs/core/tests/suite/mcp_tool_exposure.rs | sort)"
          printf 'actual source files:\n%s\n' "$actual"
          test "$actual" = "$expected"
          git diff --check "$CURRENT_BASE"

      - name: Resolve and run three exact reconnect controls
        working-directory: codex-rs
        env:
          RUST_MIN_STACK: 16777216
        run: |
          set -euo pipefail
          cargo test -p codex-core --test all --locked -- --list > /tmp/core-integration-tests.list
          cargo test -p codex-app-server --test all --locked -- --list > /tmp/appserver-integration-tests.list

          run_exact() {
            local package="$1"
            local list_file="$2"
            local suffix="$3"
            mapfile -t matches < <(sed -n 's/: test$//p' "$list_file" | grep "${suffix}$")
            printf '%s matches: %s\n' "$suffix" "${matches[*]:-<none>}"
            test "${#matches[@]}" -eq 1
            cargo test -p "$package" --test all --locked "${matches[0]}" -- --exact --nocapture
          }

          run_exact codex-core /tmp/core-integration-tests.list host_mcp_config_refresh_reconnects_ready_clients
          run_exact codex-core /tmp/core-integration-tests.list ordinary_runtime_config_refresh_reuses_ready_mcp_client
          run_exact codex-app-server /tmp/appserver-integration-tests.list mcp_server_refresh_request_reconnects_ready_thread_clients
          echo 'FIELDWORK_MCP_RECONNECT_EXACT=3/3'

      - name: Preserve source fence
        run: |
          set -euo pipefail
          git add \
            codex-rs/app-server/tests/suite/v2/mcp_tool.rs \
            codex-rs/core/src/codex_thread.rs \
            codex-rs/core/tests/suite/mcp_tool_exposure.rs
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            codex-rs/app-server/tests/suite/v2/mcp_tool.rs \
            codex-rs/core/src/codex_thread.rs \
            codex-rs/core/tests/suite/mcp_tool_exposure.rs | sort)"
          test "$actual" = "$expected"
          git diff --cached --check

      - name: Publish clean source-only branch
        env:
          SOURCE_BRANCH: fieldwork/84-mcp-reconnect-appserver-97576
        run: |
          set -euo pipefail
          git switch -C "$SOURCE_BRANCH"
          git commit -m 'core: reconnect MCP clients on host refresh'
          git push --force origin "HEAD:refs/heads/$SOURCE_BRANCH"
          echo "FIELDWORK_SOURCE_HEAD=$(git rev-parse HEAD)"
          echo "FIELDWORK_SOURCE_BASE=97576b1794872e342450ebd577123e052ab57626"
